<script>
// Zufall mit Startwert, damit Tests wiederholbar sind
'use strict';
window.A = window.A || {};
A.RNG = class {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() { let x = this.s; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.s = x >>> 0; return this.s / 4294967296; }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  weighted(list, w) { const tot = list.reduce((s, x) => s + w(x), 0); let r = this.next() * tot; for (const x of list) { r -= w(x); if (r <= 0) return x; } return list[list.length - 1]; }
};
A.rng = new A.RNG(Date.now());

</script>

A.QUESTS = [

<script>
// Der Abstieg – Spiellogik: Held, Items, Ebenen, Belohnungen, Lager, Speichern (die Welt selbst steht in world.js)
'use strict';
window.A = window.A || {};

A.Game = (function () {
  const SAVE = 'abstieg.v1';

  function metaEffects() {

  function classUnlocked(c) { return c.unlock === 0 && !c.soon; }

  // ---------- Durchlauf ----------

      seed: Math.floor(Math.random() * 1e9), race: race.id, cls: cls.id,

  // ---------- Abgeleitete Werte ----------

    const s = r.stats;
    const sum = (k) => gearList().reduce((a, it) => a + (it.stats[k] || 0), 0);
    const mod = race.mod || {};

    const d = {
      maxHp: Math.round((40 + s.tou * 8 + r.level * 6 + sum('hp')) * (mod.hpMul || 1) * (1 + me.hpMul)),
      atk: Math.round((4 + s.str * 2 + sum('atk')) * (1 + atkPct)),
      mag: Math.round((4 + s.mind * 2 + sum('mag')) * (1 + magPct)),
      def: Math.round(s.tou * 0.5 + sum('def') + (mod.def || 0)),
      spd: Math.round(5 + s.dex * 0.6 + sum('spd') + (mod.spd || 0)),
      crit: Math.round(5 + s.dex * 0.8 + s.luck * 0.6 + sum('crit') + (mod.crit || 0)),
      dodge: Math.round(s.dex * 0.5 + sum('dodge') + (mod.dodge || 0)),
      lifesteal: sum('lifesteal'), thorns: sum('thorns'), poisonOnHit: sum('poisonOnHit') + (mod.poisonOnHit || 0),
      regen: sum('regen') + (mod.regen || 0), startShield: sum('startShield'), goldPct: sum('goldPct') + ((mod.goldMul || 1) - 1) * 100,
      xpPct: sum('xpPct'), revive: sum('revive'), trap: mod.trap || 0, luck: s.luck + sum('luck'),
      skillSlots: 3 + (mod.skillSlots || 0), itemLuck: me.itemLuck + (mod.itemLuck || 0),
    };
    return d;
  }

  function monsterEntity(m, floor, elite, idx) {
    const hpM = 1 + 0.32 * (floor - 1), atkM = 1 + 0.22 * (floor - 1);
    const e = {
      id: 'e' + idx, mid: m.id, name: (elite ? A.t(A.UI.elitePrefix) + ' ' : '') + A.t(m.name), side: 'enemy', kind: m.kind,
      maxHp: Math.round(m.hp * hpM * (elite ? 1.8 : 1) * (m.boss ? 1 : 1)), atk: Math.round(m.atk * atkM * (elite ? 1.3 : 1)), mag: Math.round(m.atk * atkM * (elite ? 1.3 : 1)),
      def: Math.round((m.def || 0) * (1 + 0.15 * (floor - 1))), spd: m.spd + (elite ? 2 : 0), crit: m.crit || 5, dodge: m.dodge || 0,
      poisonOnHit: m.poisonOnHit || 0, burn: m.burn || 0, thorns: m.thorns || 0, steal: m.steal || 0, color: m.color, shape: m.shape,
      boss: !!m.boss, elite: !!elite, split: !!m.split, healOnPhys: m.healOnPhys || 0, skills: [],
    };
    e.hp = e.maxHp;
    if (elite) { const t = run ? run.rng.pick(['giftig', 'gepanzert', 'schnell']) : 'gepanzert'; e.eliteKind = t; if (t === 'giftig') e.poisonOnHit += 3; if (t === 'gepanzert') e.def += 5; if (t === 'schnell') e.spd += 4; }
    return e;
  }

  // ---------- Items ----------
  function rollRarity(bonusLuck) {
    const rng = run ? run.rng : A.rng;
    const luck = (bonusLuck || 0) + (run ? derived().itemLuck : 0);
    const list = Object.keys(A.RARITY);
    return rng.weighted(list, k => {
      const r = A.RARITY[k];
      let w = r.weight;
      if (k !== 'common' && k !== 'cursed') w *= 1 + luck * 0.35;
      if (k === 'common') w /= 1 + luck * 0.35 + (run ? run.floor * 0.15 : 0);
      return w;
    });
  }
  let itemSeq = 0;
  function makeItem(base, rarity, floor, forceUnique) {
    const rng = run ? run.rng : A.rng;
    const R = A.RARITY[rarity];
    const scale = (1 + 0.18 * (floor - 1)) * R.mult;
    const it = { uid: 'i' + (++itemSeq) + '_' + Math.floor(rng.next() * 1e6), base: base.id, slot: base.slot, rarity, floor, stats: {}, affixes: [], name: null, flavor: null };
    for (const k of ['atk', 'mag', 'def', 'hp', 'spd', 'crit', 'dodge']) if (base[k]) it.stats[k] = Math.round(base[k] * (k === 'spd' || k === 'crit' || k === 'dodge' ? 1 : scale));
    // Einzelstück?
    const uniq = forceUnique || ((rarity === 'legendary' || rarity === 'cursed') ? A.UNIQUES.filter(u => u.rarity === rarity && (!run || !run.seenUniques || !run.seenUniques.includes(u.id))) : []);
    if (Array.isArray(uniq) ? uniq.length && rng.chance(0.7) : uniq) {
      const u = Array.isArray(uniq) ? rng.pick(uniq) : uniq;
      const ub = A.BASES.find(b => b.id === u.base);
      it.base = ub.id; it.slot = ub.slot; it.unique = u.id; it.name = u.name; it.flavor = u.flavor;
      it.stats = {};
      for (const k of ['atk', 'mag', 'def', 'hp', 'spd', 'crit', 'dodge']) if (ub[k]) it.stats[k] = Math.round(ub[k] * (k === 'spd' || k === 'crit' || k === 'dodge' ? 1 : scale));
      for (const k of Object.keys(u.stats)) it.stats[k] = (it.stats[k] || 0) + u.stats[k];
      if (run) { run.seenUniques = run.seenUniques || []; run.seenUniques.push(u.id); }
      return it;
    }
    const pool = rng.shuffle(A.AFFIXES).slice(0, R.affixes);
    for (const a of pool) {
      const v = Math.round(a.val * (['hp', 'def'].includes(a.key) ? (1 + 0.15 * (floor - 1)) : 1) * (rarity === 'epic' || rarity === 'legendary' || rarity === 'cursed' ? 1.3 : 1));
      it.stats[a.key] = (it.stats[a.key] || 0) + v; it.affixes.push(a.key);
    }
    if (rarity === 'cursed') { const bad = rng.pick(['def', 'dodge', 'spd', 'regen']); it.stats[bad] = (it.stats[bad] || 0) - (bad === 'spd' ? 3 : bad === 'regen' ? 2 : 8); it.curse = bad; }
    if (rng.chance(rarity === 'common' ? 0.15 : 0.5)) it.flavor = rng.pick(A.QUIRKS);
    return it;
  }
  function itemName(it) {
    if (it.name) return A.t(it.name);
    const base = A.BASES.find(b => b.id === it.base);
    let n = A.t(base.name);
    if (it.affixes.length) n += ' ' + A.t(A.AFFIXES.find(a => a.key === it.affixes[0]).name);
    if (it.rarity === 'cursed') n = (A.LANG === 'de' ? 'Verfluchte(r) ' : 'Cursed ') + n;
    return n;
  }
  function itemLines(it) {
    const out = [];
    const L = { atk: A.UI.derived.atk, mag: A.UI.derived.mag, def: A.UI.derived.def, hp: A.UI.hp, spd: A.UI.derived.spd, crit: A.UI.derived.crit, dodge: A.UI.derived.dodge };
    for (const k of ['atk', 'mag', 'def', 'hp', 'spd', 'crit', 'dodge']) if (it.stats[k]) out.push((it.stats[k] > 0 ? '+' : '') + it.stats[k] + (k === 'crit' || k === 'dodge' ? ' %' : '') + ' ' + A.t(L[k]));
    for (const a of A.AFFIXES) if (it.stats[a.key] && !['atk', 'mag', 'def', 'hp', 'spd', 'crit', 'dodge'].includes(a.key)) out.push(A.t(a.text).replace('{v}', it.stats[a.key]));
    if (it.stats.revive) out.push(A.LANG === 'de' ? 'Einmal pro Durchlauf überleben' : 'Survive once per run');
    if (it.stats.luck) out.push('+' + it.stats.luck + ' ' + A.t(A.UI.stat.luck));
    return out;
  }
  function randomItem(rarity, slotPref) {
    const rng = run.rng;
    let bases = A.BASES.filter(b => !b.cls || b.cls.includes(run.cls));
    if (slotPref) bases = bases.filter(b => b.slot === slotPref);
    return makeItem(rng.pick(bases), rarity || rollRarity(), run.floor);
  }
  function equip(it) {
    let slot = it.slot;
    if (slot === 'trinket' && run.gear.trinket && !run.gear.trinket2) slot = 'trinket2';
    const old = run.gear[slot];
    run.gear[slot] = it;
    run.bag = run.bag.filter(x => x.uid !== it.uid);
    if (old) run.bag.push(old);
    const d = derived(); if (run.hp > d.maxHp) run.hp = d.maxHp;
    save();
  }
  function sellValue(it) { return Math.round((8 + it.floor * 6) * A.RARITY[it.rarity].mult); }
  function sell(it) { run.gold += sellValue(it); run.bag = run.bag.filter(x => x.uid !== it.uid); save(); }
  function addToBag(it) { run.bag.push(it); while (run.bag.length > 8) { const worst = run.bag.slice().sort((a, b) => A.RARITY[a.rarity].mult - A.RARITY[b.rarity].mult)[0]; run.gold += sellValue(worst); run.bag = run.bag.filter(x => x.uid !== worst.uid); } save(); }

  // ---------- Ebenen (Räume) ----------
  function newFloor() {
    run.floorSeed = run.rng.int(1, 2e9); run.rooms = null;
    run.quest = run.rng.pick(A.QUESTS); run.questProg = 0; run.questDone = false; run.floorKills = 0;
    run.shopItems = null; run.currentEvent = null;
  }
  function descend() {
    if (run.floor >= A.MAX_FLOOR) { run.over = true; run.won = true; finishRun(); return 'won'; }
    run.floor++; newFloor(); save(); return 'descend';
  }
  // Raum betreten: Händler-Ware oder Ereignis festlegen (einmal pro Raum)
  function roomContent(kind) {
    if (kind === 'merchant' && !run.shopItems) run.shopItems = [randomItem(), randomItem(), randomItem(rollRarity(1))].map(it => ({ it, price: Math.round(sellValue(it) * 2.5) }));
    if (kind === 'statue' && !run.currentEvent) { run.currentEvent = run.rng.pick(A.EVENTS.filter(e => e.id !== run.lastEvent)); run.lastEvent = run.currentEvent.id; }
    save();
  }
  function questEvent(kind) {
    const q = run.quest; if (!q || run.questDone) return;
    if (q.type === 'crits' && kind === 'crit') run.questProg++;
    if (q.type === 'elite' && kind === 'elite') run.questProg = 1;
    if (q.type === 'nodmg' && kind === 'nodmg') run.questProg = 1;
    if (q.type === 'kills') run.questProg = run.floorKills;
    if (run.questProg >= q.n) { run.questDone = true; run.questRewardPending = q.reward; }
  }
  // Belohnung für einen getöteten Gegner
  function killReward(e) {
    const f = run.floor, d = derived();
    const mult = e.boss ? 10 : e.elite ? 2.5 : 1;
    const gold = Math.round(run.rng.int(3, 6) * (1 + 0.25 * (f - 1)) * mult * (1 + d.goldPct / 100));
    const xp = Math.round((6 + f * 3) * (e.boss ? 6 : e.elite ? 2 : 1) * (1 + d.xpPct / 100));
    run.kills++; run.floorKills++; meta.totalKills++;
    const items = [];
    if (e.boss) { items.push(randomItem('legendary'), randomItem(rollRarity(2))); }
    else if (e.elite) { items.push(randomItem(rollRarity(1))); questEvent('elite'); }
    else if (run.rng.chance(0.08 + d.itemLuck * 0.03)) items.push(randomItem());
    const levels = addXp(xp);
    questEvent('kill');
    save();
    return { gold, coins: e.boss ? 8 : e.elite ? 4 : Math.max(1, Math.round(gold / 4)), xp, items, levels, potion: !e.boss && run.rng.chance(0.04) };
  }
  // Raum gesäubert: ein Item als Belohnung, Aufgabe prüfen
  function roomCleared(room, stats) {
    const items = [];
    if (room.type === 'fight') items.push(randomItem());
    if (room.type === 'elite') items.push(randomItem(rollRarity(1)));
    if (stats && stats.dmgRoom === 0) questEvent('nodmg');
    if (run.questRewardPending) { const rw = run.questRewardPending; run.questRewardPending = null; if (rw.gold) run.gold += rw.gold; if (rw.xp) addXp(rw.xp); if (rw.item) items.push(randomItem(rw.item)); run.questJustDone = true; }
    save();
    return { items };
  }
  function xpNeed(l) { return Math.round(40 * Math.pow(l, 1.4)); }
  function addXp(xp) {
    run.xp += xp; let ups = 0;
    while (run.xp >= xpNeed(run.level)) { run.xp -= xpNeed(run.level); run.level++; run.points += 3; ups++; if (run.level % 3 === 0) run.pendingSkillPick = (run.pendingSkillPick || 0) + 1; }
    if (ups) { const d = derived(); run.hp = Math.min(d.maxHp, run.hp + Math.round(d.maxHp * 0.2 * ups)); run.levelUpFlag = true; }
    return ups;
  }
  function spend(stat) { if (run.points <= 0) return; run.points--; run.stats[stat]++; const before = derived(); run.hp = Math.min(before.maxHp, run.hp + (stat === 'tou' ? 8 : 0)); save(); }
  function skillOffer() {
    const cls = A.CLASSES.find(c => c.id === run.cls);
    const rest = cls.skills.filter(s => !run.known.includes(s));
    return run.rng.shuffle(rest).slice(0, 3);
  }
  function learnSkill(id) { run.known.push(id); run.pendingSkillPick--; if (run.active.length < derived().skillSlots) run.active.push(id); save(); }
  function setActive(ids) { run.active = ids.slice(0, derived().skillSlots); save(); }

  // ---------- Räume ----------
  function doRest(kind) { const d = derived(); if (kind === 'heal') run.hp = Math.min(d.maxHp, run.hp + Math.round(d.maxHp * 0.5)); else run.points++; save(); }
  function doEvent(choiceIdx) {
    const ev = run.currentEvent, ch = ev.choices[choiceIdx], rng = run.rng;
    let r = rng.next(), oc = ch.outcomes[ch.outcomes.length - 1];
    for (const o of ch.outcomes) { if (r < o.p) { oc = o; break; } r -= o.p; }
    const d = derived(); const res = { msg: A.t(oc.msg), items: [] };
    if (oc.heal) run.hp = Math.min(d.maxHp, run.hp + Math.round(d.maxHp * oc.heal));
    if (oc.dmg) run.hp = Math.max(1, run.hp - Math.round(d.maxHp * oc.dmg));
    if (oc.gold) run.gold = Math.max(0, run.gold + oc.gold);
    if (oc.xp) addXp(oc.xp);
    if (oc.stat) run.stats[oc.stat]++;
    if (oc.potion) run.potions += oc.potion;
    if (oc.item) res.items.push(randomItem(oc.item));
    if (oc.curse) res.items.push(randomItem('cursed'));
    if (oc.sacrifice) { const worst = run.bag[0]; if (worst) run.bag.shift(); run.points += 2; }
    for (const it of res.items) addToBag(it);
    save(); return res;
  }
  function treasure() { const items = [randomItem(rollRarity(1)), randomItem(rollRarity(1))]; const gold = Math.round(run.rng.int(15, 30) * (1 + 0.3 * (run.floor - 1))); run.gold += gold; save(); return { items, gold }; }
  function buy(idx) { const s = run.shopItems[idx]; if (!s || run.gold < s.price) return false; run.gold -= s.price; run.shopItems[idx] = null; addToBag(s.it); return true; }
  function buyPotion() { const p = 25 + run.floor * 5; if (run.gold < p) return false; run.gold -= p; run.potions++; save(); return true; }
  function potionPrice() { return 25 + run.floor * 5; }
  function usePotion() { if (run.potions <= 0) return false; run.potions--; const d = derived(); run.hp = Math.min(d.maxHp, run.hp + Math.round(d.maxHp * 0.4)); save(); return true; }

  // ---------- Ende ----------
  function finishRun() {
    const sparks = run.floor * 8 + Math.floor(run.kills * 1.2) + (run.won ? 60 : 0) + run.level * 2;
    run.sparksEarned = sparks; meta.sparks += sparks; meta.runs++; meta.best = Math.max(meta.best, run.floor);
    saveMeta(); save();
  }
  function metaBuy(id) { const u = A.META_SHOP.find(x => x.id === id); if (!u || meta.unlocked.includes(id) || meta.sparks < u.cost || (u.needs && !meta.unlocked.includes(u.needs))) return false; meta.sparks -= u.cost; meta.unlocked.push(id); saveMeta(); return true; }

  // ---------- Speichern ----------
  function save() { if (!run) return; try { const { rng, ...rest } = run; localStorage.setItem(SAVE, JSON.stringify(Object.assign({}, rest, { rngState: rng.s }))); } catch (e) {} }
  function load() { try { const d = JSON.parse(localStorage.getItem(SAVE)); if (!d || d.over) return null; run = d; run.rng = new A.RNG(d.rngState || d.seed); return run; } catch (e) { return null; } }
  function clearRun() { run = null; try { localStorage.removeItem(SAVE); } catch (e) {} }
  function resetAll() { clearRun(); meta = { sparks: 0, unlocked: [], runs: 0, best: 0, sound: true, totalKills: 0 }; saveMeta(); }

  loadMeta();
  return {
    get run() { return run; }, get meta() { return meta; }, metaEffects, raceUnlocked, classUnlocked,
    newRun, load, clearRun, resetAll, save, saveMeta, derived, monsterEntity,
    makeItem, itemName, itemLines, randomItem, rollRarity, equip, sell, sellValue, addToBag,
    newFloor, descend, roomContent, questEvent, killReward, roomCleared, xpNeed, spend, skillOffer, learnSkill, setActive,
    doRest, doEvent, treasure, buy, buyPotion, potionPrice, usePotion, finishRun, metaBuy,
  };
})();

<script>
// Der Abstieg – Die Welt: Ebenen aus Räumen, Held in Echtzeit steuern, Gegner, Angriffe, Beute.
'use strict';
window.A = window.A || {};

A.World = (function () {
  const TS = 32, CW = 15, CH = 11, GX = 3, GY = 3;   // Kachelgrösse, Zellen-Grösse in Kacheln, Raster

  // ---------- Ebene bauen ----------
  function genFloor(floor, seed, saved) {

  // ---------- Start einer Ebene ----------
  function enter(floor, seed, saved, hooksIn) {

  }
  function mkHero(x, y) {

  }
  function refreshHero(h) {

  // ---------- Kacheln und Kollision ----------
  function tile(x, y) { const tx = Math.floor(x / TS), ty = Math.floor(y / TS); if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return 0; return W.tiles[ty][tx]; }

  }

  function inside(r, x, y) { const tx = x / TS, ty = y / TS; return tx >= r.x + 0.5 && tx <= r.x + r.w - 0.5 && ty >= r.y + 0.5 && ty <= r.y + r.h - 0.5; }

  // ---------- Gegner ----------
  function spawnRoom(r) {

    }

      let x, y, tries = 0;

      addMon(m, x, y);

  }
  function addMon(m, x, y) {
    Object.assign(m, { x, y, r: m.boss ? 24 : m.elite ? 17 : 14, hp: m.hp, shield: 0, effects: [], buffs: {}, stun: 0, flash: 0, alive: true, state: 'idle', st: 0, cd: 1 + Math.random(), fx: -1, fy: 0, speed: (m.kind === 'melee' ? 62 : 55) + m.spd * 7, inv: 0, swing: 0, alpha: 1 });
    W.mons.push(m); return m;
  }

  // ---------- Treffer-Rechnung ----------
  function statOf(e, k) { const b = e.buffs && e.buffs[k]; let v = e[k] || 0; if (b && b.until > W.t) v = b.mul ? v * (1 + b.mul) : v + b.add; return v; }
  function float(x, y, text, color, size) { W.floats.push({ x: x + (Math.random() - 0.5) * 16, y, text, color: color || '#fff', size: size || 16, life: 1 }); }
  function hit(from, to, raw, opts) {

    float(to.x, to.y - to.r - 10, (crit ? '✦' : '') + '−' + dmg + (absorbed ? ' 🛡' : ''), col, crit ? 20 : to.side === 'hero' ? 17 : 14);

      if (from.lifesteal && from.alive) heal(from, Math.max(1, Math.round(dmg * from.lifesteal / 100)));
      if (from.poisonOnHit) addEffect(to, 'poison', Math.max(1, Math.round(from.poisonOnHit * (1 + W.floor * 0.3))), 3);
      if (from.burn) addEffect(to, 'burn', Math.max(1, Math.round(statOf(from, 'mag') * from.burn)), 2);
      if (opts.poison) addEffect(to, 'poison', Math.max(1, Math.round(statOf(from, 'atk') * opts.poison / 3)), 3);
      if (opts.burn) addEffect(to, 'burn', Math.max(1, Math.round(statOf(from, 'mag') * opts.burn)), 2);

      if (to.healOnPhys && opts.kind !== 'magic') heal(to, Math.round(to.maxHp * to.healOnPhys));
      if (from.steal && to.side === 'hero') { const g = Math.min(G().run.gold, 5 + W.floor * 3); if (g > 0) { G().run.gold -= g; float(from.x, from.y - from.r - 24, '💰 −' + g, '#f5c542', 13); } }
      if (to.side === 'hero' && from.side === 'enemy') { const k = Math.hypot(to.x - from.x, to.y - from.y) || 1; moveEnt(to, (to.x - from.x) / k * 10, (to.y - from.y) / k * 10); }
    }
    if (to.split && !to.didSplit && to.hp <= to.maxHp / 2) { to.didSplit = true; const base = A.MONSTERS.find(m => m.id === 'schleimer'); for (let i = 0; i < 2; i++) { const s = G().monsterEntity(base, W.floor, false, 90 + i); addMon(s, to.x + (i ? 40 : -40), to.y + 20); } float(to.x, to.y - 50, A.LANG === 'de' ? 'Teilt sich!' : 'Splits!', '#9be37a', 16); }
    checkDeath(to);

  }
  function heal(e, n) { if (!e.alive || n <= 0) return; const b = e.hp; e.hp = Math.min(e.maxHp, e.hp + n); if (e.hp > b) float(e.x, e.y - e.r - 10, '+' + (e.hp - b), '#6fdc7a', 14); }
  function addEffect(e, kind, dmg, sec) { const cur = e.effects.find(x => x.kind === kind); if (cur) { cur.dmg = Math.max(cur.dmg, dmg); cur.until = W.t + sec; } else e.effects.push({ kind, dmg, until: W.t + sec, tick: W.t + 1 }); }
  function checkDeath(e) {

    }

    for (const it of rw.items) W.picks.push({ kind: 'item', it, x: e.x + (Math.random() - 0.5) * 30, y: e.y + 10 + (Math.random() - 0.5) * 30, t: 0 });

  }

  // ---------- Angriffe des Helden ----------
  function nearestMon(x, y, maxD) { let best = null, bd = maxD || 1e9; for (const m of W.mons) { if (!m.alive) continue; const d = dist({ x, y }, m); if (d < bd) { bd = d; best = m; } } return best; }
  function faceTarget(h) { const m = nearestMon(h.x, h.y, 320); if (m) { const d = dist(h, m) || 1; h.fx = (m.x - h.x) / d; h.fy = (m.y - h.y) / d; } }
  function arc(h, radius, pow, opts) {

    else if (sk.kind === 'multi' || sk.multi) { let n = 0; for (const m of W.mons) { if (m.alive && dist(h, m) < 170 + m.r) { hit(h, m, (magic ? statOf(h, 'mag') : statOf(h, 'atk')) * sk.pow, { kind: magic ? 'magic' : 'phys', burn: sk.burn }); n++; } } W.fx.push({ kind: 'ring', x: h.x, y: h.y, r: 170, life: 0.35, color: magic ? '#ff8a3d' : '#fff' }); }

  }
  function usePotion() { const h = W.hero; if (!G().usePotion()) return false; const d = G().derived(); heal(h, Math.round(d.maxHp * 0.4) - (h.hp - G().run.hp > 0 ? 0 : 0)); h.hp = G().run.hp = Math.max(h.hp, G().run.hp); return true; }

  // ---------- Gegner-Verhalten ----------
  function monStep(m, dt) {

    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!dungeonEl.classList.contains('on') || !Wd.W) return;
    const inp = input.read();
    Wd.step(dt, inp);
    if (G.run) G.run.rooms = Wd.saveRooms();
    draw.draw(Wd.W, dt);
    hudT += dt; if (hudT > 0.15) { hudT = 0; hudUpdate(); controlsTick(); }
  }
  // Knöpfe am Rand
  let ctl = null;
  function buildControls() {
    const r = G.run;
    const sk = r.active.filter(Boolean);
    $('#controls').innerHTML = `<div id="btnGrid">
      ${sk.map((id, i) => `<button class="cbtn sk" data-sk="${i}"><span class="ring"></span><span class="lbl">${esc(t(A.SKILLS[id].name))}</span><span class="key">${i + 1}</span></button>`).join('')}
      <button class="cbtn pot" id="bPotion">🧪<span class="n"></span><span class="key">Q</span></button>
      <button class="cbtn atk" id="bAtk">⚔️<span class="key">␣</span></button>
      <button class="cbtn use" id="bUse" style="display:none">✋<span class="key">E</span></button>
    </div>`;
    ctl = { atk: $('#bAtk'), use: $('#bUse'), pot: $('#bPotion'), sk: Array.from(document.querySelectorAll('#controls .sk')) };
    input.bindAttack(ctl.atk);
    ctl.sk.forEach(b => b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (Wd.useSkill(+b.dataset.sk)) sfx.click(); }));
    ctl.pot.addEventListener('pointerdown', (e) => { e.preventDefault(); if (Wd.usePotion()) { sfx.buy(); hudUpdate(); } });
    ctl.use.addEventListener('pointerdown', (e) => { e.preventDefault(); Wd.interact(); });
  }
  function controlsTick() {
    if (!ctl || !Wd.W) return;
    const h = Wd.W.hero, r = G.run;
    ctl.sk.forEach((b, i) => { const id = h.skills[i]; if (!id) return; const cd = Math.max(0, (h.cds[id] || 0) - Wd.W.t); const tot = A.SKILLS[id].cd * 2; b.classList.toggle('cold', cd > 0); b.querySelector('.ring').style.setProperty('--p', (cd / tot * 100) + '%'); });
    ctl.pot.querySelector('.n').textContent = r.potions; ctl.pot.classList.toggle('cold', r.potions <= 0);
    ctl.use.style.display = Wd.W.near ? '' : 'none';
    if (Wd.W.near) ctl.use.innerHTML = ({ chest: '💰', fire: '🔥', merchant: '🛒', statue: '❓', stairs: '⬇️' })[Wd.W.near.kind] + '<span class="key">E</span>';
  }
  input.onKey = (code, e) => {
    if (!dungeonEl.classList.contains('on')) return;
    if (overlay.classList.contains('on')) { if (code === 'Escape' || code === 'KeyI' || code === 'Tab') { const b = $('#bClose'); if (b) b.click(); e.preventDefault(); } return; }
    if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') { if (Wd.useSkill(+code.slice(-1) - 1)) sfx.click(); }
    if (code === 'KeyQ') { if (Wd.usePotion()) { sfx.buy(); hudUpdate(); } }
    if (code === 'KeyE' || code === 'Enter') Wd.interact();
    if (code === 'KeyI' || code === 'Tab' || code === 'Escape') { e.preventDefault(); showSheet(); }
    if (code === 'Space') e.preventDefault();
  };
  // Gefundenes Item
  function foundItem(it) {
    const cur = slotCurrent(it);
    ov(`<h2>${A.LANG === 'de' ? 'Gefunden' : 'Found'}</h2>${itemHtml(it, null, cur)}<button class="btn primary" id="bEq">${t(U.equip)}${cur ? ` (${A.LANG === 'de' ? 'ersetzt' : 'replaces'} ${esc(G.itemName(cur))})` : ''}</button><button class="btn" id="bBag">${t(U.bag)}</button><button class="btn" id="bClose">${t(U.sell)} ${G.sellValue(it)}🪙</button>`);
    $('#bEq').onclick = () => { G.addToBag(it); G.equip(it); sfx.buy(); ovClose(); };
    $('#bBag').onclick = () => { G.addToBag(it); sfx.click(); ovClose(); };
    $('#bClose').onclick = () => { G.run.gold += G.sellValue(it); G.save(); sfx.buy(); ovClose(); };
  }
  // Dinge im Raum
  function useProp(p) {
    const r = G.run;
    if (p.kind === 'stairs') {
      ov(`<div class="center"><div style="font-size:50px">⬇️</div><h2>${t(U.floor)} ${r.floor + 1}</h2><div class="sub">${A.LANG === 'de' ? 'Neue Schicht, neue Gegner, neue Aufgabe.' : 'New layer, new enemies, new quest.'}</div><button class="btn primary" id="bOk">${t(U.descend)}</button><button class="btn" id="bClose">${t(U.back)}</button></div>`);
      $('#bOk').onclick = () => { sfx.click(); overlay.classList.remove('on'); overlay.innerHTML = ''; const res = G.descend(); if (res === 'won') { runOver(); return; } Portal.showAd(() => dungeon(true)); };
      $('#bClose').onclick = () => ovClose();
    }
    else if (p.kind === 'chest') { Wd.markUsed(p); treasure(); }
    else if (p.kind === 'fire') { Wd.markUsed(p); rest(); }
    else if (p.kind === 'merchant') { G.roomContent('merchant'); shop(); }
    else if (p.kind === 'statue') { Wd.markUsed(p); G.roomContent('statue'); eventScreen(); }
  }
  // ---------- Heldenblatt ----------
  function showSheet(tab) {
    const r = G.run, d = G.derived();
    tab = tab || 'stats';
    const statsHtml = ['str', 'tou', 'dex', 'mind', 'luck'].map(k => `<div class="stat"><span>${t(U.stat[k])}</span><span><b>${r.stats[k]}</b>${r.points > 0 ? `<button data-sp="${k}">+</button>` : ''}</span></div>`).join('');
    const kv = `<div class="kv" style="margin-top:10px"><span>${t(U.hp)} <b>${d.maxHp}</b></span><span>${t(U.derived.atk)} <b>${d.atk}</b></span><span>${t(U.derived.mag)} <b>${d.mag}</b></span><span>${t(U.derived.def)} <b>${d.def}</b></span><span>${t(U.derived.spd)} <b>${d.spd}</b></span><span>${t(U.derived.crit)} <b>${d.crit} %</b></span><span>${t(U.derived.dodge)} <b>${d.dodge} %</b></span><span>${t(U.xp)} <b>${r.xp}/${G.xpNeed(r.level)}</b></span></div>`;
    const gear = A.SLOTS.map(s => { const it = r.gear[s]; return it ? itemHtml(it) : `<div class="item" style="opacity:0.5"><div><div class="slotlbl">${t(U.slot[s === 'trinket2' ? 'trinket' : s])}</div><div class="nm">–</div></div></div>`; }).join('');
    const bag = r.bag.length ? r.bag.map(it => itemHtml(it, `<button class="primary" data-eq="${it.uid}">${t(U.equip)}</button><button data-sell="${it.uid}">${t(U.sell)} ${G.sellValue(it)}🪙</button>`, slotCurrent(it))).join('') : `<div class="mini">${A.LANG === 'de' ? 'Leer.' : 'Empty.'}</div>`;
    const skills = r.known.map(id => { const sk = A.SKILLS[id]; const on = r.active.includes(id); return `<div class="skill ${on ? 'on' : ''}" data-sk="${id}"><div><div class="nm">${on ? '●' : '○'} ${t(sk.name)}</div><div class="ds">${t(sk.desc)}</div></div><div class="cd">${sk.cd * 2} s</div></div>`; }).join('');
    const content = tab === 'stats' ? `${r.points > 0 ? `<div class="q">⬆ ${r.points} ${t(U.points)}</div>` : ''}${statsHtml}${kv}` :
      tab === 'gear' ? `${gear}<h2 style="margin-top:12px">${t(U.bag)} (${r.bag.length}/8)</h2>${bag}${r.potions > 0 ? `<button class="btn" id="bPot">🧪 ${t(U.usePotion)}</button>` : ''}` :
      `<div class="mini" style="margin-bottom:8px">${A.LANG === 'de' ? `Bis zu ${d.skillSlots} aktiv, auf den Knöpfen 1 bis ${d.skillSlots}.` : `Up to ${d.skillSlots} active, on buttons 1 to ${d.skillSlots}.`}</div>${skills}`;
    ov(`<div class="tabs"><button data-tab="stats" class="${tab === 'stats' ? 'on' : ''}">${t(U.stats)}</button><button data-tab="gear" class="${tab === 'gear' ? 'on' : ''}">${t(U.items)}</button><button data-tab="skills" class="${tab === 'skills' ? 'on' : ''}">${t(U.skills)}</button></div>${content}<button class="btn" id="bClose">${t(U.back)}</button>`);
    overlay.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showSheet(b.dataset.tab));
    overlay.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { G.spend(b.dataset.sp); sfx.click(); showSheet('stats'); });
    overlay.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { G.equip(r.bag.find(x => x.uid === b.dataset.eq)); sfx.buy(); showSheet('gear'); });
    overlay.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => { G.sell(r.bag.find(x => x.uid === b.dataset.sell)); sfx.buy(); showSheet('gear'); });
    overlay.querySelectorAll('[data-sk]').forEach(el => el.onclick = () => { const id = el.dataset.sk; let a = r.active.slice(); if (a.includes(id)) a = a.filter(x => x !== id); else if (a.length < d.skillSlots) a.push(id); else return; G.setActive(a); sfx.click(); showSheet('skills'); });
    const bp = $('#bPot'); if (bp) bp.onclick = () => { G.usePotion(); if (Wd.W) Wd.W.hero.hp = r.hp; sfx.buy(); showSheet('gear'); };
    $('#bClose').onclick = () => { ovClose(); if (r.pendingSkillPick > 0) skillPick(); };
  }
  function skillPick() {
    const r = G.run; const offer = G.skillOffer();
    if (!offer.length) { r.pendingSkillPick = 0; G.save(); return; }
    ov(`<h2>${t(U.newSkill)}</h2>${offer.map(id => { const sk = A.SKILLS[id]; return `<div class="skill" data-pick="${id}"><div><div class="nm">${t(sk.name)}</div><div class="ds">${t(sk.desc)}</div></div><div class="cd">${sk.cd * 2} s</div></div>`; }).join('')}`);
    overlay.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => { G.learnSkill(el.dataset.pick); sfx.buy(); if (r.pendingSkillPick > 0) skillPick(); else { ovClose(); buildControls(); } });
  }

  // ---------- Räume ----------
  function rest() {
    ov(`<h2>🔥 ${t(U.node.rest)}</h2><div class="sub">${A.LANG === 'de' ? 'Ein Feuer. Endlich. Niemand will dich fressen. Vorerst.' : 'A fire. Finally. Nothing wants to eat you. For now.'}</div>
      <button class="btn primary" id="bHeal">${t(U.heal)}</button><button class="btn" id="bTrain">${t(U.train)}</button>`);
    $('#bHeal').onclick = () => { G.doRest('heal'); Wd.W.hero.hp = G.run.hp; sfx.buy(); ovClose(); };
    $('#bTrain').onclick = () => { G.doRest('train'); sfx.buy(); ovClose(); };
  }
  function eventScreen() {
    const r = G.run, ev = r.currentEvent;
    ov(`<h2>❓ ${t(ev.title)}</h2><div class="msg">${t(ev.text)}</div>${ev.choices.map((c, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" data-c="${i}" ${c.needItem && !r.bag.length ? 'disabled' : ''}>${t(c.text)}</button>`).join('')}`);
    overlay.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const res = G.doEvent(+b.dataset.c); sfx.click(); r.currentEvent = null; Wd.W.hero.hp = r.hp; hudUpdate();
      ov(`<h2>❓ ${t(ev.title)}</h2><div class="msg">${esc(res.msg)}</div>${res.items.map(it => itemHtml(it)).join('')}<button class="btn primary" id="bClose">${t(U.leave)}</button>`);
      $('#bClose').onclick = () => ovClose(); });
  }
  function shop() {
    const r = G.run;
    const items = r.shopItems.map((s, i) => s ? itemHtml(s.it, `<button class="${r.gold >= s.price ? 'primary' : ''}" data-buy="${i}" ${r.gold >= s.price ? '' : 'disabled'}>${t(U.buy)} ${s.price}🪙</button>`, slotCurrent(s.it)) : '').join('');
    const bag = r.bag.map(it => itemHtml(it, `<button data-sell="${it.uid}">${t(U.sell)} ${G.sellValue(it)}🪙</button>`)).join('');
    ov(`<h2>🛒 ${t(U.node.shop)}</h2><div class="sub">${A.LANG === 'de' ? '«Alles frisch. Fast alles. Keine Rückgabe.»' : '"All fresh. Mostly. No returns."'}</div>${items}
      <div class="item"><div style="flex:1"><div class="nm">🧪 ${t(U.potion)}</div><div class="ln">+40 % ${t(U.hp)}</div></div><div class="act"><button class="${r.gold >= G.potionPrice() ? 'primary' : ''}" id="bPot" ${r.gold >= G.potionPrice() ? '' : 'disabled'}>${t(U.buy)} ${G.potionPrice()}🪙</button></div></div>
      ${bag ? `<h2 style="margin-top:12px">${t(U.bag)}</h2>${bag}` : ''}<button class="btn primary" id="bClose">${t(U.leave)}</button>`);
    overlay.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { if (G.buy(+b.dataset.buy)) { sfx.buy(); shop(); } });
    overlay.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => { G.sell(r.bag.find(x => x.uid === b.dataset.sell)); sfx.buy(); shop(); });
    $('#bPot').onclick = () => { if (G.buyPotion()) { sfx.buy(); shop(); } };
    $('#bClose').onclick = () => { sfx.click(); ovClose(); };
  }
  function treasure() {
    const res = G.treasure();
    for (const it of res.items) G.addToBag(it);
    ov(`<h2>💰 ${t(U.node.treasure)}</h2><div class="msg">${A.LANG === 'de' ? `Eine Truhe. Unverschlossen. Verdächtig. <b class="goldc">+${res.gold} 🪙</b>` : `A chest. Unlocked. Suspicious. <b class="goldc">+${res.gold} 🪙</b>`}</div>${res.items.map(it => itemHtml(it)).join('')}<div class="mini">${A.LANG === 'de' ? 'Liegt im Beutel. Anlegen über den Helden-Knopf oben.' : 'Now in your bag. Equip via the hero button above.'}</div><button class="btn primary" id="bClose">${t(U.leave)}</button>`);
    $('#bClose').onclick = () => { sfx.click(); ovClose(); };
  }

  // ---------- Ende ----------
  function runOver() {
    const r = G.run;
    if (!r.over) { r.over = true; G.finishRun(); }
    Portal.gameplayStop();
    overlay.classList.remove('on'); overlay.innerHTML = '';
    hud.classList.remove('on');
    const won = r.won;
    show(`<div class="center" style="padding-top:6vh"><div style="font-size:56px">${won ? '🏆' : '💀'}</div><h2>${won ? t(U.win) : t(U.runOver)}</h2>
      ${won ? `<div class="msg">${t(U.blocked)}</div>` : `<div class="sub">${t(U.dead)} ${r.floor}.</div>`}
      <div class="card" style="text-align:left"><div class="kv"><span>${t(U.reached)} <b>${r.floor}</b></span><span>${t(U.level)} <b>${r.level}</b></span><span>${t(U.kills)} <b>${r.kills}</b></span><span>🪙 <b>${r.gold}</b></span></div></div>
      <div class="big spark">✦ +${r.sparksEarned}</div><div class="mini">${t(U.sparksEarned)}</div>
      <button class="btn primary" id="bCamp" style="margin-top:16px">${t(U.toCamp)}</button></div>`);
    $('#bCamp').onclick = () => { sfx.click(); G.clearRun(); Portal.showAd(() => camp()); };
  }

  // ---------- Start ----------
  document.addEventListener('visibilitychange', () => { if (document.hidden) G.save(); });
  window.__abstieg = { G, Wd, title, dungeon, get overlay() { return overlay; } };
  title();
})();

</script>
</body>
</html>
