  :root {
    --ink: #181425; --night: #1d1a2e; --panel: #262b44; --panel2: #2e3452; --line: #3a4466; --steel: #5a6988; --mist: #8b9bb4; --pale: #c0cbdc;
    --text: #ead4aa; --muted: #8b9bb4; --gold: #feae34; --gold2: #fee761; --orange: #f77622; --rust: #be4a2f; --red: #e43b44; --dred: #a22633;
    --green: #63c74d; --cyan: #2ce8f5; --blue: #0099db; --spark: #c77dff;
    --ui: 'Pixelify Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --deco: 'Jacquard 24', 'Pixelify Sans', serif;
    --notch: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    --notch2: polygon(6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px), 0 6px, 3px 6px, 3px 3px, 6px 3px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
  body { user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; }
  img.px { image-rendering: pixelated; image-rendering: crisp-edges; vertical-align: middle; flex: none; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  body.play #bg { display: none; }
  #app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; z-index: 1; }
  body.play #app { max-width: none; }

  /* ---------- Anzeige oben (Held, Leben, Gold, Tränke, Ebene) ---------- */
  #hud { display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 6; align-items: center; gap: 7px; padding: calc(7px + env(safe-area-inset-top)) 10px 16px; background: linear-gradient(rgba(24,20,37,0.92) 0%, rgba(24,20,37,0.7) 62%, rgba(24,20,37,0) 100%); pointer-events: none; }
  body.play #hud { max-width: 620px; margin: 0 auto; }
  #hud.on { display: flex; }
  #hud > * { pointer-events: auto; }
  #heroBtn { position: relative; width: 46px; height: 46px; flex: none; border: 3px solid var(--ink); clip-path: var(--notch); background: radial-gradient(circle at 50% 30%, #4a557a, #262b44 75%); box-shadow: inset 0 0 0 2px var(--steel), inset 0 -4px 0 2px rgba(0,0,0,0.3); cursor: pointer; padding: 0; display: grid; place-items: center; overflow: hidden; }
  #heroBtn img { width: 36px; height: 26px; margin-top: 8px; }
  #heroBtn .lv { position: absolute; left: 0; bottom: 0; min-width: 18px; padding: 1px 3px 2px; background: var(--ink); color: var(--gold2); font-size: 12px; font-weight: 700; line-height: 1; }
  #heroBtn .plus { display: none; position: absolute; right: 1px; top: 1px; width: 15px; height: 15px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 700; line-height: 14px; text-align: center; }
  #heroBtn.pts { box-shadow: inset 0 0 0 2px var(--gold), inset 0 -4px 0 2px rgba(0,0,0,0.3); animation: ptsPulse 1s steps(2) infinite; }
  #heroBtn.pts .plus { display: block; }
  @keyframes ptsPulse { 50% { background: radial-gradient(circle at 50% 30%, #6a5a3a, #3e2731 75%); } }
  #bars { flex: 1; min-width: 70px; display: flex; flex-direction: column; gap: 4px; }
  #hpbar { position: relative; height: 18px; background: var(--ink); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--steel); overflow: hidden; }
  #hpbar b, #hpbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; display: block; }
  #hpbar b { background: #f6757a; transition: width 0.6s 0.25s; }
  #hpbar i { background: linear-gradient(#f6757a 0 3px, #e43b44 3px 11px, #a22633 11px); transition: width 0.12s; }
  #hpbar.low i { animation: lowHp 0.6s steps(2) infinite; }
  @keyframes lowHp { 50% { filter: brightness(1.5); } }
  #hudGold.bump, #hudPot.bump { animation: hudBump 0.25s ease-out; }
  @keyframes hudBump { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.18); filter: brightness(1.6); } 100% { transform: scale(1); filter: brightness(1); } }
  #hptext { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; line-height: 1; color: #fff; text-shadow: 1px 0 var(--ink), -1px 0 var(--ink), 0 1px var(--ink), 0 -1px var(--ink); }
  #xpbar { height: 6px; background: var(--ink); box-shadow: 0 0 0 1px #3a4466; }
  #xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(#e0a4ff 0 2px, #9b55d6 2px); transition: width 0.3s; }
  .pill { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 7px 0 5px; background: rgba(24,20,37,0.85); border: 2px solid var(--line); clip-path: var(--notch); font-size: 15px; font-weight: 700; white-space: nowrap; line-height: 1; }
  .pill.gold { color: var(--gold2); }
  .pill.bump { animation: bump 0.25s; }
  @keyframes bump { 40% { transform: scale(1.18); } }

  /* ---------- Menüs ---------- */
  #screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom)); position: relative; }
  h1, h2 { font-family: var(--deco); font-weight: 400; color: var(--gold2); margin: 0; line-height: 1; letter-spacing: 1px; }
  h2 { font-size: 34px; margin: 0 0 10px; text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink), 0 4px var(--ink), 0 0 14px rgba(247,118,34,0.35); display: flex; align-items: center; gap: 10px; }
  h3 { font-size: 15px; font-weight: 700; color: var(--mist); text-transform: uppercase; letter-spacing: 2px; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
  h3::after { content: ''; flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 9px); }
  .sub { color: var(--mist); font-size: 15px; margin-bottom: 14px; line-height: 1.35; }
  .center { text-align: center; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 9px; padding: 12px 14px 14px; border: 3px solid var(--ink); clip-path: var(--notch); background: #3a4466; color: var(--text); font-family: var(--ui); font-size: 18px; font-weight: 700; line-height: 1.1; letter-spacing: 0.5px; text-shadow: 0 2px 0 rgba(0,0,0,0.45); box-shadow: inset 0 -4px 0 #262b44, inset 0 3px 0 #5a6988; cursor: pointer; text-align: center; }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 #262b44, inset 0 3px 0 #262b44; }
  .btn.primary { background: var(--gold); color: #3e2731; text-shadow: 0 1px 0 rgba(255,255,255,0.4); box-shadow: inset 0 -4px 0 #be4a2f, inset 0 3px 0 #fee761; }

'use strict';
window.A = window.A || {};
A.RNG = class {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() { let x = this.s; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.s = x >>> 0; return this.s / 4294967296; }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  weighted(list, w) { const tot = list.reduce((s, x) => s + w(x), 0); let r = this.next() * tot; for (const x of list) { r -= w(x); if (r <= 0) return x; } return list[list.length - 1]; }
};

A.FLOORS_PER_WORLD = 4;
A.worldIndex = (f) => Math.floor((Math.max(1, f) - 1) / A.FLOORS_PER_WORLD);
A.worldOf = (f) => A.WORLDS[A.worldIndex(f) % A.WORLDS.length];
A.worldRound = (f) => Math.floor(A.worldIndex(f) / A.WORLDS.length);      // 0 = erster Durchgang, 1 = die Welten kommen wieder ...
A.isBossFloor = (f) => f % A.FLOORS_PER_WORLD === 0;
A.bossOf = (f) => A.isBossFloor(f) ? A.BOSSES[A.worldOf(f).boss] : null;
A.worldName = (f) => { const n = A.t(A.worldOf(f).name), r = A.worldRound(f); return r ? n + ' ' + ['', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'][Math.min(r, 7)] : n; };
// Gegner-Auswahl: auf der ersten Ebene einer Welt die ersten drei Arten, dann je Ebene eine mehr
A.monsterPool = (f) => { const w = A.worldOf(f), k = (Math.max(1, f) - 1) % A.FLOORS_PER_WORLD; return w.mons.slice(0, 3 + k).map(id => A.MONSTERS.find(m => m.id === id)).filter(Boolean); };

<script>
// Der Abstieg – Ebenen-Bau: Räume in verschiedenen Formen (Rechteck, Achteck, Rund, Kreuz, L, Ring, Säulenhalle,
// Zwillingskammern, Insel, Becken, Stege ...), verbunden über Gänge, dazu Hindernisse und Gefahren je Welt.

//          5 Gefahr-Boden (Treibsand, Schlamm, seichtes Wasser, Glut: begehbar, bremst oder brennt)
'use strict';
window.A = window.A || {};

A.Levels = (function () {
  // Raster aus Zellen, je Zelle ein Raum; DX/DY: Lage der Türen in der Zelle (zwei Kacheln breit: DX/DX+1 bzw. DY/DY+1).
  // Grosse Räume (Ebenen-Bau 4): Zellen und Räume rund 1.4-mal so breit und hoch, also etwa doppelt so viel Platz
  const SMALL = { GX: 4, GY: 4, CW: 17, CH: 13, DX: 8, DY: 6 }, BIG = { GX: 4, GY: 4, CW: 24, CH: 18, DX: 11, DY: 8, big: true };

  // ---------- Raumformen ----------
  // Liefert ein Raster (Zeilen) mit 0 Wand, 1 Boden, 3 Hindernis, 4 Grube, 5 Gefahr
  function shapeMask(kind, w, h, rng, wd, big) {
    const m = []; for (let y = 0; y < h; y++) m.push(new Array(w).fill(1));

        const c = Math.min(big ? 4 : 3, Math.floor(Math.min(w, h) / 3));
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (x + y < c || (w - 1 - x) + y < c || x + (h - 1 - y) < c || (w - 1 - x) + (h - 1 - y) < c) m[y][x] = 0;
        break;

        const rx = w / 2, ry = h / 2;

        break;

        const ax = Math.max(2, Math.floor(w / 5)), ay = Math.max(2, Math.floor(h / 5));
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (Math.abs(x - cx) > ax + 0.5 && Math.abs(y - cy) > ay + 0.5) m[y][x] = 0;
        break;
      }
      case 'L': {
        const qw = Math.floor(w * 0.45), qh = Math.floor(h * 0.45), left = rng.chance(0.5), top = rng.chance(0.5);
        for (let y = 0; y < qh; y++) for (let x = 0; x < qw; x++) m[top ? y : h - 1 - y][left ? x : w - 1 - x] = 0;
        break;

        const fill = pit && rng.chance(0.7) ? 4 : 0, g = big ? 4 : 3;   // Gang rundherum: 3 Kacheln, in grossen Räumen 4

        break;

        else { const wy = Math.floor(h / 2), gx = rng.int(1, w - 3); for (let x = 0; x < w; x++) if (x !== gx && x !== gx + 1) m[wy][x] = 0; }

    return m;

  const PLAIN = ['rect', 'octagon', 'circle', 'rect'];

  // big: grosse Räume (Kampfräume etwa doppelte Fläche, die anderen etwas grösser)
  function pickShape(type, wd, rng, big) {

<script>
// Der Abstieg – Elite-Gegner mit Eigenschaften (A.ELITE_TRAITS in data.js): je tiefer, desto mehr Eigenschaften,
// jede mit eigener Wirkung, Warnkreis am Boden und eigenem Aussehen. game.js ruft make() beim Bauen des Gegners,
// world.js ruft onAdd/step/onHurt/onDeal/onDeath und tick() einmal pro Bild; draw.js zeichnet.
'use strict';
window.A = window.A || {};

A.Elites = (function () {
  const TAU = Math.PI * 2, PX = 2, EY = 0.6;   // EY: Bodenkreise sind flach (wie bei den Bossen)

  const W = () => api.W;

  const TR = (id) => A.ELITE_TRAITS[id];
  const has = (m, id) => !!(m.traits && m.traits.indexOf(id) >= 0);

  // ---------- Auswürfeln ----------
  // Welt 1: eine Eigenschaft, ab Ebene 5 zwei, ab Ebene 15 drei, in den Welten II (ab Ebene 25) eine mehr

    const out = [], ids = Object.keys(A.ELITE_TRAITS);
    const ok = (id) => !out.includes(id)
      && !(base.rooted && (id === 'flink' || id === 'blinzelnd'))
      && !(base.teleport && id === 'blinzelnd') && !(base.summon && id === 'beschwoerer')
      && !(TR(id).heal && out.some(o => TR(o).heal))   // höchstens eine, die ihn am Leben hält
      && !(id === 'flink' && out.includes('riese')) && !(id === 'riese' && out.includes('flink'));
    for (let k = 0; k < n; k++) { const pool = ids.filter(ok); if (!pool.length) break; out.push(rng.pick(pool)); }
    return out;
  }

  function make(e, base, floor, n, rng, forced) {
    const tr = forced ? forced.filter(id => A.ELITE_TRAITS[id]) : roll(base, n, rng);
    e.traits = tr; e.eliteKind = tr[0]; e.name = A.t(base.name);
    e.maxHp = Math.round(e.maxHp * (1 + 0.12 * (tr.length - 1)));   // mehr Eigenschaften, etwas mehr Leben
    for (const id of tr) {
      if (id === 'flink') e.spd += 5;
      else if (id === 'gepanzert') { e.def += Math.round(6 + floor * 0.5); e.kbImmune = true; }
      else if (id === 'giftig') e.poisonOnHit += 3;
      else if (id === 'feurig') e.burn = Math.max(e.burn, 0.3);
      else if (id === 'frostig') e.slowOnHit = true;
      else if (id === 'beschwoerer') { const pool = A.monsterPool(floor).filter(x => !x.rooted && x.id !== base.id); e.summon = (pool.length ? rng.pick(pool) : base).id; e.summonCd = 7; }
      else if (id === 'blinzelnd') e.teleport = true;
      else if (id === 'vampir') e.lifesteal = 35;
      else if (id === 'riese') { e.giant = true; e.maxHp = Math.round(e.maxHp * 1.6); e.atk = Math.round(e.atk * 1.2); e.mag = Math.round(e.mag * 1.2); e.spd = Math.max(0, e.spd - 1); }
    }
    if (tr.includes('schild')) e.shieldCap = Math.round(e.maxHp * 0.3);
    e.hp = e.maxHp;
    return e;
  }
  // Beim Hinstellen in den Raum (world.js addMon): Zeitgeber, voller Schild
  function onAdd(m) {
    if (!m.traits) return;
    m.ef = { fire: 2 + Math.random() * 2, frost: 2.5 + Math.random() * 2.5, storm: 2 + Math.random() * 2, stomp: 2 + Math.random(), heal: 3, busy: 0, hurtT: -9, spin: Math.random() * TAU, bladeT: 0, trail: 0, lx: m.x, ly: m.y, ghosts: [], gT: 0 };

  // ---------- Bodenanzeigen ----------
  // W.efx: tele (Warnkreis, wirkt bei 'at'), puddle (Gift- oder Eispfütze), beam (Heilstrahl)

window.A = window.A || {};

A.Combos = (function () {
  const TAU = Math.PI * 2, PX = 2, EY = 0.6;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const L = (de, en) => (A.LANG === 'de' ? de : en);
  let api = null;   // Werkzeuge aus world.js: hit, heal, boom, float, fx, heroPower, castSkill, statOf, freeSpot
  const W = () => api && api.W;
  function bind(a) { api = a; }
  const C = (id) => A.COMBOS[id];
  const live = (m) => m.alive && !(m.spawn > 0);
  const on = (h, id) => !!(h && h.combo && h.combo[id]);
  const fight = (w) => !!(w && w.active && w.mons.some(live));
  const pow = (h) => api.heroPower(h);
  function add(o) { const w = W(); (w.cbfx || (w.cbfx = [])).push(o); return o; }
  function later(o) { const w = W(); (w.cbQ || (w.cbQ = [])).push(o); }
  function nearest(x, y, maxD) { let best = null, bd = maxD; for (const m of W().mons) { if (!live(m)) continue; const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = m; } } return best; }
  let popT = 0;   // Knall der Raketen nicht zu oft hintereinander

  // ---------- Teile ----------
  const EL_MIN = 2;   // so viele Ausrüstungs-Teile eines Elements braucht ein Element-Teil
  const CLS_ICON = { klinge: 'i_schwert', schuetze: 'i_bogen', weber: 'i_stab', rufer: 's_skel', brau: 's_wonder' };
  function hasPart(p, r, d) {
    if (p.tal) return (r.talents || []).includes(p.tal);
    if (p.el) return ((d.gear && d.gear.count[p.el]) || 0) >= EL_MIN;
    if (p.spell) return (r.known || []).includes(p.spell);
    if (p.leg) return !!(d.leg && d.leg[p.leg]);
    if (p.tro) { const T = A.TROPHIES[p.tro]; return !!(T && d.tro && d.tro[T.power]); }
    if (p.cls) return r.cls === p.cls;
    return false;
  }
  function partName(p) {
    if (p.tal) return A.t(A.TALENTS[p.tal].name);
    if (p.el) return L(`${A.t(A.ELEMENTS[p.el].name)} (${EL_MIN} Teile)`, `${A.t(A.ELEMENTS[p.el].name)} (${EL_MIN} pieces)`);
    if (p.spell) return L('Zauber ', 'Spell ') + A.t(A.SKILLS[p.spell].name);
    if (p.leg) return A.t(A.LEGENDS[p.leg].name);
    if (p.tro) return A.t(A.TROPHIES[p.tro].name);
    return A.t(A.CLASSES.find(c => c.id === p.cls).name);
  }
  // Wo gibt es das fehlende Teil?
  function partWhere(p) {
    if (p.tal) return L('Segen am Schrein', 'shrine blessing');
    if (p.spell) return L('am Schrein, das Zauberbuch reicht', 'at the shrine, the spell book is enough');
    if (p.el) return L('Ausrüstung oder Schmiede', 'gear or forge');
    if (p.leg) return A.Legends.hint(p.leg);
    if (p.tro) return L('Trophäe vom ', 'trophy from ') + A.t(A.BOSSES[p.tro].name);
    return L('nur diese Klasse', 'this class only');
  }
  function partIcon(p) {
    if (p.tal) return A.TALENTS[p.tal].icon || 'u_star';
    if (p.el) return A.ELEMENTS[p.el].icon;
    if (p.spell) return A.SKILLS[p.spell].icon || 's_strike';
    if (p.leg) return 'i_' + A.LEGENDS[p.leg].ico;
    if (p.tro) return p.tro === 'schleimkoenig' ? 'crown' : A.Art.itemIcon(A.TROPHIES[p.tro].base);
    return CLS_ICON[p.cls] || 'u_star';
  }
  function recipe(id) { return C(id).need.map(partName).join(' + '); }

  // ---------- Stand (game.js derived, Heldenblatt, Schrein) ----------
  // full: beide Teile da; on: ausserdem schon am Schrein erwacht (run.combos) – nur diese wirken
  function evaluate(r, d) {
    const full = {}, act = {}, woke = r.combos || [];
    for (const id in A.COMBOS) if (C(id).need.every(p => hasPart(p, r, d))) { full[id] = true; if (woke.includes(id)) act[id] = true; }
    return { full, on: act };
  }
  // Für das Heldenblatt: wirkt, bereit (erwacht am nächsten Schrein), ruht (erwacht, aber ein Teil fehlt), fast (ein Teil fehlt noch)
  function list(r, d) {
    const out = [], woke = r.combos || [], ord = { on: 0, ready: 1, rest: 2, near: 3 };
    for (const id in A.COMBOS) {
      const miss = C(id).need.filter(p => !hasPart(p, r, d));
      if (miss.some(p => p.cls)) continue;   // gehört zu einer anderen Klasse
      const st = !miss.length ? (woke.includes(id) ? 'on' : 'ready') : woke.includes(id) ? 'rest' : miss.length === 1 ? 'near' : null;
      if (st) out.push({ id, st, miss });
    }
    return out.sort((a, b) => ord[a.st] - ord[b.st]);
  }
  // Welche Kombos würde ein Segen am Schrein ganz machen?
  function completes(b, r, d) {
    if (!b || (b.type !== 'talent' && b.type !== 'spell')) return [];
    const key = b.type === 'talent' ? 'tal' : 'spell', out = [];
    for (const id in A.COMBOS) {
      const need = C(id).need; if (!need.some(p => p[key] === b.id)) continue;
      if (need.every(p => p[key] === b.id || hasPart(p, r, d))) out.push(id);
    }
    return out;
  }

  // ---------- Treffer ----------
  // vor der Schadensrechnung: Vampirfürst (+6 % je Blutkugel) und Todesmut (unter 35 % Leben ist jeder Treffer ein Volltreffer)
  function pre(from, to, opts) {
    const w = W(); if (!w || from !== w.hero || to.side !== 'enemy' || !from.combo) return null;
    let mul = 1, force = false;
    if (from.bloodUntil > w.t && from.bloodN) mul *= 1 + 0.06 * from.bloodN;
    if (on(from, 'todesmut') && from.hp < from.maxHp * 0.35 && (opts.kind === 'phys' || opts.kind === 'magic')) force = true;
    return mul === 1 && !force ? null : { mul, force };
  }
  // Geschoss ohne Schuss-Ton (es kommen oft viele auf einmal)
  function bolt(h, x, y, a, dmg, o) {
    const sp = o.speed || 420;
    W().shots.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: o.r || 4, side: 'hero', from: h, dmg, opts: Object.assign({ kind: 'magic', proc: true }, o), life: o.life || 0.8, color: o.color });
  }
  // eigener Begleiter (Baby-Schleim, Schattenklon): world.js lässt ihn laufen und beissen wie den Geisterwolf, gezeichnet wird er hier
  function ally(h, p, dur, x, y) {
    const w = W(), [ax, ay] = api.freeSpot(x, y, 10);
    const a = { side: 'hero', ally: true, hp: 1e9, maxHp: 1e9, x: ax, y: ay, r: 10, fx: h.fx, fy: 0, pow: p, until: w.t + dur, perm: false, cd: 0.25, swing: 0, alive: true, crit: 0, spawn: 0.25 };
    w.allies.push(a);
    return a;
  }
  // Gegner besiegt: Blutkugel (Vampirfürst), Fadenfunke (Fadensturm)
  function onKill(e) {
    const w = W(), h = w && w.hero; if (!h || !h.alive || !h.combo) return;
    if (on(h, 'vampirfuerst')) { const a = Math.random() * TAU; add({ kind: 'blood', x: e.x, y: e.y - 10, vx: Math.cos(a) * 130, vy: Math.sin(a) * 90 - 40, t0: w.t }); }
    if (on(h, 'fadensturm')) later({ kind: 'thread', at: w.t + 0.12, x: e.x, y: e.y });
  }
  // Held getroffen: Kaktus schiesst Steinstacheln
  function onHurt(h, from) {
    const w = W(); if (!on(h, 'kaktus') || !h.alive || h.hp <= 0 || !from || from.side !== 'enemy' || h.cactT > w.t) return;
    h.cactT = w.t + 1.2;
    const a0 = Math.random() * TAU;
    for (let i = 0; i < 6; i++) { const a = a0 + i / 6 * TAU; bolt(h, h.x + Math.cos(a) * 14, h.y + Math.sin(a) * 10, a, pow(h) * 0.5, { kind: 'phys', color: '#a2e05a', speed: 400, life: 0.6 }); }
    api.float(h.x, h.y - 56, L('Stachelig!', 'Prickly!'), '#a2e05a', 13);
    if (A.FX) A.FX.burst(h.x, h.y - 8, 12, { color: ['#a2e05a', '#8b9bb4', '#c0cbdc'], smin: 60, smax: 170, life: 0.4, z: 6, vz: 90, g: 380 });
  }
  // Held weicht aus: ein Schattenklon springt heraus
  function onDodge(h) {
    const w = W(); if (!on(h, 'schattenklon') || !h.alive || h.cloneT > w.t || !fight(w)) return;
    h.cloneT = w.t + 1.5;
    const c = ally(h, 0.6, 4, h.x - h.fx * 26, h.y + 6);
    c.cb = 'clone'; c.col = '#b55088'; c.rate = 0.5; c.spd = 1.3; c.r = 11;
    api.float(h.x, h.y - 60, L('Schattenklon!', 'Shadow clone!'), '#e0a4ff', 13);
    if (A.FX) A.FX.burst(c.x, c.y - 10, 14, { color: ['#b55088', '#68386c', '#e0a4ff'], smin: 50, smax: 160, life: 0.45, add: true, kind: 'spark', drag: 3 });
  }

  // ---------- Explosionen ----------
  // Nach jeder Explosion (world.js boom, Legenden, Ausrüstung): Raketen der Kettenreaktion, Blitze des Feuerballs, Domino, Knochen
  function onBoom(x, y, r, dmg, opts) {
    const w = W(), h = w && w.hero; if (!h || !h.alive || !h.combo) return;
    if (opts.kette && on(h, 'feuerwerk')) rockets(h, x, y);
    if (opts.fb && on(h, 'plasmaball')) plasma(h, x, y, dmg * 0.5);
    if (on(h, 'domino') && (opts.domino || 0) < 2 && Math.random() < 0.35) {
      const a = Math.random() * TAU, d = 45 + Math.random() * 45;
      w.marks.push({ kind: 'boom', x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * EY, r: Math.max(54, r * 0.85), at: w.t + 0.22, dmg: dmg * 0.7, col: '#feae34', opts: { proc: true, domino: (opts.domino || 0) + 1 } });
    }
    if (opts.bone && A.FX) A.FX.burst(x, y - 8, 16, { color: ['#ead4aa', '#c0cbdc', '#e0a4ff'], smin: 60, smax: 200, life: 0.6, z: 6, vz: 140, g: 420 });
  }
  // Feuerwerk: 4 Raketen fliegen im Bogen zu Gegnern in der Nähe und zerplatzen bunt
  const FW = ['#fee761', '#f77622', '#2ce8f5', '#f6757a', '#63c74d', '#c77dff', '#ffffff'];
  function rockets(h, x, y) {
    const w = W(), tg = w.mons.filter(m => live(m) && Math.hypot(m.x - x, m.y - y) < 300), k0 = Math.floor(Math.random() * 4);
    for (let i = 0; i < 4; i++) {
      const m = tg.length ? tg[(k0 + i) % tg.length] : null, a = Math.random() * TAU, d = 50 + Math.random() * 80;
      add({ kind: 'rocket', x0: x, y0: y, x, y, z: 0, tx: m ? m.x : x + Math.cos(a) * d, ty: m ? m.y : y + Math.sin(a) * d * EY, tgt: m, t0: w.t + i * 0.07, at: w.t + 0.45 + i * 0.07,
        col: FW[Math.floor(Math.random() * FW.length)], arc: 50 + Math.random() * 40, side: (Math.random() < 0.5 ? -1 : 1) * (20 + Math.random() * 30), tr: [] });
    }
    if (A.Sound.ignite) A.Sound.ignite();
  }
  function rocketStep(o, w, h) {
    if (w.t < o.t0) return;
    if (o.tgt && live(o.tgt)) { o.tx = o.tgt.x; o.ty = o.tgt.y; }
    const p = clamp((w.t - o.t0) / (o.at - o.t0), 0, 1), s = Math.sin(Math.PI * p), dx = o.tx - o.x0, dy = o.ty - o.y0, dl = Math.hypot(dx, dy) || 1;
    o.x = o.x0 + dx * p - dy / dl * o.side * s; o.y = o.y0 + dy * p + dx / dl * o.side * s * EY; o.z = o.arc * s;
    o.tr.push([o.x, o.y - o.z]); if (o.tr.length > 10) o.tr.shift();
    if (A.FX && !A.FX.low && Math.random() < 0.5) A.FX.part({ add: true, x: o.x, y: o.y, z: o.z, vx: (Math.random() - 0.5) * 20, vy: 0, vz: -30, life: 0.3, color: Math.random() < 0.5 ? o.col : '#fee761', drag: 2 });
    if (p >= 1) { o.done = true; if (h.alive) pop(h, o.x, o.y, o.col); }
  }
  function pop(h, x, y, col) {
    const w = W(), r = 58, dmg = pow(h) * 0.4;
    for (const m of w.mons) if (live(m) && Math.hypot(m.x - x, m.y - y) < r + m.r) api.hit(h, m, dmg, { kind: 'magic', proc: true, burn: 0.4, color: col });
    api.fx('boom', { x, y, r, color: col, soft: true });
    if (A.FX) {
      const c2 = FW[Math.floor(Math.random() * FW.length)];
      for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, sp = 90 + Math.random() * 100; A.FX.part({ add: true, x, y, z: 26, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * EY, vz: 40 + Math.random() * 40, g: 160, life: 0.55 + Math.random() * 0.3, color: i % 2 ? col : c2, drag: 2.2, size: Math.random() < 0.3 ? 2 : 1 }); }
      A.FX.flash(x, y - 20, r, col, 0.18);
    }
    const now = performance.now(); if (now - popT > 70) { popT = now; if (A.Sound.glass) A.Sound.glass(false); }
    onBoom(x, y, r, dmg, { proc: true });
  }
  // Plasmaball: aus der Feuerball-Explosion springen Blitze in die 3 nächsten Gegner
  function plasma(h, x, y, dmg) {
    const w = W(), tg = w.mons.filter(m => live(m) && Math.hypot(m.x - x, m.y - y) < 260).sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y)).slice(0, 3);
    for (const m of tg) {
      w.bolts.push({ x0: x, y0: y - 10, x1: m.x, y1: m.y - 10, life: 0.3, max: 0.3, col: '#c77dff', seed: Math.random() * 99 });
      api.hit(h, m, dmg, { kind: 'magic', proc: true, noKb: true, color: '#c77dff' });
    }
    if (tg.length) api.fx('zap', { x, y, color: '#c77dff' });
  }
  // Kettenblitz trifft: kleine Plasma-Explosion
  function onChainHit(m, dmg) {
    const w = W(), h = w && w.hero; if (!on(h, 'plasmaball')) return;
    api.boom(m.x, m.y, 52, dmg * 0.4, { proc: true }, '#c77dff');
  }
  // Meteor schlägt ein: Meteorschauer bringt 2 kleine Brocken mit (auf Gegner in der Nähe, sonst daneben)
  function onMeteor(k) {
    const w = W(), h = w && w.hero; if (k.mini || !on(h, 'meteorschauer')) return;
    const near = w.mons.filter(m => live(m) && Math.hypot(m.x - k.x, m.y - k.y) < 220).sort(() => Math.random() - 0.5);
    for (let i = 0; i < 2; i++) {
      const m = near[i], a = Math.random() * TAU, d = 60 + Math.random() * 40;
      w.marks.push({ kind: 'meteor', mini: true, x: m ? m.x : k.x + Math.cos(a) * d, y: m ? m.y : k.y + Math.sin(a) * d * EY, r: 54, t0: w.t, at: w.t + 0.35 + i * 0.2, dmg: k.dmg * 0.35, burn: k.burn, col: k.col, opts: { proc: true } });
    }
  }

  // ---------- Geschosse, Münzen, Zauber, Angriffe ----------
  // Pfeilhagel: ein normaler Pfeil teilt sich beim Treffer in 2 weitere (die teilen sich nicht noch einmal)
  function onShotHit(s, m) {
    const w = W(), h = w && w.hero; if (s.from !== h || !s.opts.basic || !on(h, 'pfeilhagel')) return;
    const a0 = Math.atan2(s.vy, s.vx), sp = Math.hypot(s.vx, s.vy) || 420;
    for (const da of [-0.5, 0.5]) { const a = a0 + da; bolt(h, m.x + Math.cos(a) * (m.r + 6), m.y + Math.sin(a) * (m.r + 6), a, s.dmg * 0.5, { kind: s.opts.kind, color: s.color, speed: sp, life: 0.45 }); }
  }
  // Goldregen: jede Münze im Kampf schiesst einen Goldsplitter auf den nächsten Gegner
  function onCoin(h) {
    const w = W(); if (!on(h, 'goldregen') || !fight(w)) return;
    const m = nearest(h.x, h.y, 420); if (!m) return;
    bolt(h, h.x, h.y - 6, Math.atan2(m.y - h.y, m.x - h.x), pow(h) * 0.4, { kind: 'magic', color: '#feae34', speed: 560, life: 0.9 });
    if (A.FX) A.FX.burst(h.x, h.y - 18, 4, { color: ['#fee761', '#feae34', '#ffffff'], smin: 30, smax: 90, life: 0.3, add: true, kind: 'spark', drag: 4 });
  }
  // Zauberecho: mit Echokaskade öfter, und das Echo wirkt den Zauber gleich noch einmal (nicht bei Schutz-, Heil- und Helfer-Zaubern)
  const NO_ECHO = ['shield', 'heal', 'buff', 'dash', 'ally', 'sacrifice', 'rally', 'brew', 'summon', 'wonder'];
  function echoChance(h) { return on(h, 'echokaskade') ? 0.4 : 0.25; }
  function onEcho(h, id) {
    const w = W(), sk = A.SKILLS[id]; if (!on(h, 'echokaskade') || !sk || NO_ECHO.includes(sk.kind) || sk.zone === 'heal') return;
    later({ kind: 'echo', at: w.t + 0.3, id });
  }
  // Wirbelwind: jeder 4. Schlag schleudert die kreisenden Klingen weit hinaus und zurück (world.js orbStep fragt swirl)
  function onAttack(h) {
    const w = W(); if (!on(h, 'wirbelwind') || h.atkN % 4 !== 0 || !w.orbs.some(o => o.perm)) return;
    w.cbSwirl = { t0: w.t, until: w.t + 0.9 };
    api.float(h.x, h.y - 58, L('Wirbelwind!', 'Whirlwind!'), '#c0cbdc', 13);
    if (A.FX) A.FX.part({ kind: 'ring', x: h.x, y: h.y, life: 0.5, size: 150, color: '#c0cbdc', add: true });
    if (A.Sound.swing) A.Sound.swing();
  }
  function swirl() { const w = W(), s = w && w.cbSwirl; if (!s || w.t >= s.until) return 0; return Math.sin(Math.PI * (w.t - s.t0) / (s.until - s.t0)); }
  // Begleiter geht (Zeit abgelaufen oder verdrängt): Knochenknall lässt Diener zerplatzen
  function onAllyGone(a) {
    const w = W(), h = w && w.hero; if (!a.minion || !on(h, 'knochenknall') || !h.alive || !fight(w)) return;
    w.marks.push({ kind: 'boom', x: a.x, y: a.y, r: 72, at: w.t + 0.05, dmg: pow(h) * 0.6, col: '#e0a4ff', opts: { raise: true, proc: true, bone: true } });
  }
  // Pudding verschluckt einen Gegner: Königsfamilie spuckt einen Baby-Schleim aus (bis 4)
  function onGulp(p, x, y) {
    const w = W(), h = w && w.hero; if (!on(h, 'koenigsfamilie')) return;
    const kids = w.allies.filter(a => a.cb === 'baby' && !a.gone);
    if (kids.length >= 4) { const old = kids.sort((q, r) => q.until - r.until)[0]; old.gone = true; api.fx('appear', { m: old }); }
    const b = ally(h, 0.3, 15, x, y);
    b.cb = 'baby'; b.r = 8; b.col = '#9be37a'; b.rate = 0.55; b.spd = 1.25; b.fx = p.fx;
    api.float(x, y - 30, L('Ein Enkel!', 'A grandchild!'), '#9be37a', 12);
    if (A.FX) A.FX.burst(x, y - 6, 10, { color: ['#9be37a', '#63c74d', '#fee761'], smin: 40, smax: 120, life: 0.45, z: 4, vz: 90, g: 380 });
  }
  // Zahlen für andere Dateien
  function wolves(h) { return on(h, 'rudel') ? 3 : 1; }               // Treuer Begleiter (world.js syncPerm)
  function surpriseEvery(h) { return on(h, 'brauerei') ? 3 : 4; }     // Überraschungs-Flaschen (classes.js)
  function bounces(h) { return on(h, 'brauerei') ? 2 : 0; }           // so oft springt eine Überraschung weiter

  // ---------- Jedes Bild ----------
  function tick(dt) {
    const w = W(); if (!w) return; const h = w.hero; if (!h) return;
    const inFight = fight(w);
    if (h.alive && h.combo) {
      if (inFight) {
        if (on(h, 'gewitterklingen')) storm(w, h, dt);
        if (on(h, 'meteorschauer') && (h.cbMetT = (h.cbMetT == null ? 3 : h.cbMetT) - dt) <= 0) { h.cbMetT = 7; shower(w, h); }
        if (on(h, 'pilzteppich') && h.moving && (h.shroomT = (h.shroomT || 0) - dt) <= 0) { h.shroomT = 1.3; plant(w, h); }
      } else h.cbMetT = 3;
      if (on(h, 'permafrost')) permafrost(w, h, dt);
      todesmut(w, h, dt);
    }
    // Warteschlange: Echo-Echo und Fadenfunken
    if (w.cbQ && w.cbQ.length) {
      for (const q of w.cbQ) if (w.t >= q.at) { q.done = true; if (h.alive) queued(q, w, h); }
      w.cbQ = w.cbQ.filter(q => !q.done);
    }
    // Raketen, Blutkugeln, Giftpilze
    for (const o of w.cbfx || []) {
      if (o.done) continue;
      if (o.kind === 'rocket') rocketStep(o, w, h);
      else if (o.kind === 'blood') bloodStep(o, w, h, dt);
      else if (o.kind === 'shroom') shroomStep(o, w, h);
    }
    if (w.cbfx && w.cbfx.length) w.cbfx = w.cbfx.filter(o => !o.done);
  }
  function queued(q, w, h) {
    if (q.kind === 'echo') {
      if (!h.skills.includes(q.id)) return;

  // ---------- Piñata-Keule und Sparschwein ----------

  // Der Held wurde getroffen: Bienen werden sauer, ein harter Treffer lässt das Sparschwein platzen
  function onHurt(h, from, dmg) {

  function burstPig(h, p, w) {
    const k = Math.min(16, 6 + Math.floor(p.n / 3)), dmg = pow(h) * (0.25 + p.n * 0.02), a0 = Math.random() * TAU;
    const src = { x: h.x, y: h.y, r: 6, side: 'hero', tal: {}, crit: h.crit };

  // ---------- Jedes Bild ----------
  function onRoomStart(h) { h.gnomeT = 1.5; h.hornT = 2; h.cloudT = 0.6; h.bubT = 1; h.peelT = 0.6; }
  function tick(dt) {

  // ---------- Zeichnen im Retro-Look (dr.b = Bild, dr.g = Leuchten) ----------

    const ls = w.wild; if (!ls || !ls.length) return;

    for (const o of ls) {

        } else { R = 6; x = o.x / PX - cx; y = (o.y - o.z) / PX - cy + Math.sin(t * 3 + o.ph) * 1.5; }
        const wob = Math.sin(t * 5 + o.ph) * 0.6;

        b.globalAlpha = 0.75; b.strokeStyle = '#c0f8ff'; b.lineWidth = 1; circ(b, x, y, R + wob);
        b.globalAlpha = 0.6; b.strokeStyle = '#f6757a'; b.beginPath(); b.arc(Math.round(x), Math.round(y), Math.max(1, R - 1 + wob), 0.2 + t, 1.1 + t); b.stroke();
        b.globalAlpha = 1; b.fillStyle = '#ffffff'; b.fillRect(Math.round(x - R * 0.45), Math.round(y - R * 0.55), 2, 1); b.fillRect(Math.round(x - R * 0.55), Math.round(y - R * 0.4), 1, 1);
        g.globalAlpha = 0.35; g.strokeStyle = '#9be8ff'; circ(g, x, y, R + 1); g.globalAlpha = 1;
      } else if (o.kind === 'swat') {
        const spr = A.Art.sprite('swatter'), S = 3, k = o.hit ? 1 : clamp((w.t - o.t0) / 0.1, 0, 1), fade = clamp((o.until - w.t) / 0.2, 0, 1);
        b.save(); b.globalAlpha = fade; b.translate(Math.round(o.x / PX - cx), Math.round(o.y / PX - cy - 4)); b.rotate(o.ang + Math.PI / 2);
        b.drawImage(spr.img, -Math.round(spr.w * S / 2), -Math.round(spr.h * S * (0.35 + 0.65 * k)), spr.w * S, Math.round(spr.h * S * (0.35 + 0.65 * k)));

    }

    if (c && h) {

      b.strokeStyle = c.flash > 0 ? '#ffffff' : '#8f6a4a'; b.lineWidth = 1;
      b.beginPath(); b.moveTo(Math.round(hx), Math.round(hy)); b.quadraticCurveTo(Math.round((hx + x) / 2), Math.round(Math.max(hy, y) + 4), Math.round(x), Math.round(y + 2)); b.stroke();
      const spr = A.Art.sprite('cloud', Math.floor(t * 2) % 2);
      dr.blit(spr, x, y + 4, false, { white: c.flash > 0 });
      if (c.flash > 0) { g.globalAlpha = 0.8; g.fillStyle = '#fee761'; g.fillRect(Math.round(x - 6), Math.round(y - 1), 12, 3); g.globalAlpha = 1; }
    }
    // Bienen: gelb-schwarz, flatternde Flügel, sauer mit rotem Stachel
    if (w.bees && w.bees.length) {
      const mad = h && h.beeMad > w.t;
      for (const bee of w.bees) {
        const x = Math.round(bee.x / PX - cx), y = Math.round((bee.y - bee.z) / PX - cy);
        b.fillStyle = '#181425'; b.fillRect(x - 2, y - 1, 5, 3);
        b.fillStyle = '#fee761'; b.fillRect(x - 1, y, 3, 1); b.fillStyle = '#181425'; b.fillRect(x, y, 1, 1);
        if (mad) { b.fillStyle = '#e43b44'; b.fillRect(bee.fx > 0 ? x - 3 : x + 3, y, 1, 1); }
        if (Math.floor(t * 30 + bee.ph * 3) % 2) { g.globalAlpha = 0.8; g.fillStyle = '#ffffff'; g.fillRect(x - 1, y - 2, 1, 1); g.fillRect(x + 1, y - 2, 1, 1); g.globalAlpha = 1; }
      }
    }
    if (!h || !h.alive) return;
    // Sparschwein über dem Kopf: wird mit jeder Münze grösser
    if (has(h, 'sparschwein')) {
      const p = (A.Game.run && A.Game.run.piggy) || { n: 0 }, spr = A.Art.sprite('piggy'), s = 1 + p.n / PIG_MAX * 0.35;
      const bounce = h.pigT != null && w.t - h.pigT < 0.25 ? Math.sin((w.t - h.pigT) / 0.25 * Math.PI) * 3 : 0;
      const x = h.x / PX - cx, y = h.y / PX - cy + 7 - 24 * (h.legBig ? 1.3 : 1) - bounce;

      const spr = A.Art.sprite('i_troete'), x = h.x / PX - cx + h.fx * 8, y = h.y / PX - cy - 6;
      dr.blit(spr, x, y, h.fx < 0, { sx: 0.75, sy: 0.75 });
    }
  }
  function lights(w, Lt) {
    const c = w.cloud;
    if (c) Lt(c.x, c.y - CLOUD_Z, c.flash > 0 ? 60 : 24, c.flash > 0 ? '#fee761' : '#7fd8ff', c.flash > 0 ? 0.8 : 0.25);
    for (const o of w.wild || []) if (o.kind === 'bubble' && !o.done) Lt(o.x, o.y - (o.m ? 30 : o.z), o.m ? 30 : 14, '#9be8ff', 0.3);
  }

  return { bind, has, tick, step, onAttack, onKill, onHurt, onCoin, onRoomStart, drawSlip, drawAlly, drawGround, drawTop, lights };
})();

<script>
// Der Abstieg – Vergleich: Was ändert sich am Helden, wenn er ein Stück anlegt?
// Rechnet die Heldenwerte (game.js derived) einmal wie jetzt und einmal mit dem neuen Stück am Platz, also mit Element-Boni (gear.js),
// Kräften, Trophäen, Legenden (legends.js) und Kombos (combos.js), und fällt ein Urteil: besser, schlechter, anders (Vor- und Nachteile) oder gleich.
// Punkte sind grob «Prozent Stärke»: mehr Schaden zählt so viel wie mehr Leben, Gold und Erfahrung zählen wenig.
// ui.js zeigt das Ergebnis an; hier wird nichts verändert oder gespeichert.
'use strict';
window.A = window.A || {};

A.Compare = (function () {
  const L = (de, en) => (A.LANG === 'de' ? de : en);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lnPts = (a, b) => 100 * Math.log(Math.max(1e-6, b) / Math.max(1e-6, a));   // Unterschied in Prozent (in beide Richtungen gleich gross)
  const rate = (spd) => clamp(1.05 - spd * 0.03, 0.32, 1.05);   // Sekunden zwischen zwei Angriffen (world.js)
  const MAGIC = { weber: true, rufer: true };   // diese Klassen kämpfen mit Zauberkraft, die anderen mit Angriff (Braumeister: mit dem höheren Wert)

  // Werte, die ein Stück ändern kann. pts: Punkte aus altem und neuem Wert, w: Punkte je Einheit, pct: mit Prozentzeichen
  const ROWS = [
    { k: 'maxHp', name: () => A.t(A.UI.hp), pts: (a, b) => lnPts(a, b) },
    { k: 'atk', name: () => A.t(A.UI.derived.atk), dmg: true },
    { k: 'mag', name: () => A.t(A.UI.derived.mag), dmg: true },
    { k: 'def', name: () => A.t(A.UI.derived.def), pts: (a, b) => lnPts(1 + 0.04 * Math.max(0, a), 1 + 0.04 * Math.max(0, b)) },
    { k: 'spd', name: () => A.t(A.UI.derived.spd), pts: (a, b) => 0.5 * lnPts(1 / rate(a), 1 / rate(b)) + 0.25 * lnPts(150 + 4 * a, 150 + 4 * b) },
    { k: 'crit', name: () => A.t(A.UI.derived.crit), pct: true, pts: (a, b) => lnPts(1 + 0.75 * clamp(a, 0, 90) / 100, 1 + 0.75 * clamp(b, 0, 90) / 100) },
    { k: 'dodge', name: () => A.t(A.UI.derived.dodge), pct: true, pts: (a, b) => 100 * Math.log((1 - clamp(a, 0, 75) / 100) / (1 - clamp(b, 0, 75) / 100)) },
    { k: 'lifesteal', name: () => L('Lebensraub', 'Lifesteal'), pct: true, w: 1.2 },
    { k: 'regen', name: () => L('Erholung', 'Regeneration'), pct: true, w: 4 },
    { k: 'thorns', name: () => L('Dornen', 'Thorns'), pct: true, w: 0.12 },
    { k: 'poisonOnHit', name: () => L('Gift-Treffer', 'Poison hits'), w: 1 },
    { k: 'startShield', name: () => L('Start-Schild', 'Starting shield'), pct: true, w: 0.25 },
    { k: 'goldPct', name: () => L('Gold-Bonus', 'Gold bonus'), pct: true, w: 0.05 },
    { k: 'xpPct', name: () => L('Erfahrung', 'Experience'), pct: true, w: 0.08 },
    { k: 'luck', name: () => A.t(A.UI.stat.luck), w: 0.8 },
    { k: 'dropPct', name: () => L('Item-Chance', 'Item chance'), pct: true, w: 0.5 },
  ];
  // Element-Boni: Stufe 1 von Schatten und Stein steckt schon in den Werten (Volltreffer, Ausweichen, Leben, Rüstung)
  const elPts = (el, tier) => tier >= 3 ? 9 : tier === 2 ? 7 : el === 'schatten' || el === 'stein' ? 0 : el === 'blitz' ? 2 : 5;
  const PW_PTS = { goldmagnet: 2, glueckspilz: 3, phoenix: 10 };

  // Welche Plätze kommen in Frage? Schmuck hat zwei: ist einer frei, kommt das Stück dorthin (wie G.equip), sonst gibt es zwei Möglichkeiten
  function slots(it) {
    const g = A.Game.run.gear;
    if (it.slot !== 'trinket' && it.slot !== 'trinket2') return [it.slot];
    if (!g.trinket) return ['trinket'];
    if (!g.trinket2) return ['trinket2'];
    return ['trinket', 'trinket2'];
  }
  // Heldenwerte, wenn it am Platz slot steckt (nur kurz eingesetzt, danach ist alles wie vorher)
  function heroWith(it, slot) {
    const r = A.Game.run, keep = r.gear[slot];
    r.gear[slot] = it;
    try { return A.Game.derived(); } finally { r.gear[slot] = keep; }
  }
  const power = (cls, d) => MAGIC[cls] ? d.mag : cls === 'brau' ? Math.max(d.atk, d.mag) : d.atk;
  const union = (a, b) => Object.keys(Object.assign({}, a, b));

  // Was kommt dazu, was fällt weg: Element-Boni, Kräfte, Legenden, Trophäen, Kombos und die zweite Chance
  function effects(it, old, d0, d1, r) {
    const out = [];
    for (const el of Object.keys(A.ELEMENTS)) {
      const a = d0.gear.tier[el] || 0, b = d1.gear.tier[el] || 0, n = d1.gear.count[el] || 0;
      for (let i = a; i < b; i++) out.push({ kind: 'el', el, tier: i + 1, n, up: true, pts: elPts(el, i + 1) });
      for (let i = b; i < a; i++) out.push({ kind: 'el', el, tier: i + 1, n, up: false, pts: -elPts(el, i + 1) });
      if (a === b && b < 3 && it.el === el && !(old && old.el === el)) out.push({ kind: 'elnext', el, tier: b + 1, n, pts: 0 });   // kein neuer Bonus, aber ein Teil näher dran
    }

      const a = p0[id], b = p1[id], w = PW_PTS[id] || 6;
      if (a == null) out.push({ kind: 'pw', id, v: b, up: true, pts: w });
      else if (b == null) out.push({ kind: 'pw', id, v: a, up: false, pts: -w });
      else if (a !== b) { const up = P.low ? b < a : b > a; out.push({ kind: 'pw', id, v: b, from: a, up, pts: up ? 2 : -2 }); }

// Der Abstieg – Eingabe: Tasten am PC, Joystick und Knöpfe am Handy
'use strict';
window.A = window.A || {};

A.Input = (function () {
  const keys = {};
  const state = { mx: 0, my: 0, attack: false };
  const joy = { on: false, id: null, x0: 0, y0: 0, x: 0, y: 0 };
  let atkHeld = false, atkTouch = false, handlers = {};

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return; keys[e.code] = true;
    if (handlers.key) handlers.key(e.code, e);
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k of Object.keys(keys)) keys[k] = false; atkHeld = false; });

  function bindCanvas(el) {
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', (e) => {
      const r = el.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
      if (e.pointerType === 'mouse' || x > r.width / 2) { atkTouch = true; return; }
      if (joy.on) return;
      joy.on = true; joy.id = e.pointerId; joy.x0 = x; joy.y0 = y; joy.x = x; joy.y = y;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => { if (!joy.on || e.pointerId !== joy.id) return; const r = el.getBoundingClientRect(); joy.x = e.clientX - r.left; joy.y = e.clientY - r.top; });
    const end = (e) => { if (joy.on && e.pointerId === joy.id) { joy.on = false; } else atkTouch = false; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }

  function bindAttack(btn) { bindHold(btn, () => { atkHeld = true; }, () => { atkHeld = false; }); }

  function read() {
    let mx = 0, my = 0;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
    if (joy.on) { const dx = joy.x - joy.x0, dy = joy.y - joy.y0; const d = Math.hypot(dx, dy); const R = 48; if (d > 6) { const k = Math.min(1, d / R); mx = dx / d * k; my = dy / d * k; } }
    state.mx = mx; state.my = my;
    state.attack = atkHeld || atkTouch || !!(keys.Space || keys.KeyJ || keys.KeyK);
    return state;
  }

})();

  // ---------- Lager ----------
  // Wirkung als kurzer Text, z. B. «+20 % Leben · +50 Gold zum Start»
  function fxText(e) {
    const out = [], p = (v) => Math.round(v * 100);
    if (e.hpMul) out.push(L(`+${p(e.hpMul)} % Leben`, `+${p(e.hpMul)}% health`));
    if (e.dmgMul) out.push(L(`+${p(e.dmgMul)} % Angriff und Zauberkraft`, `+${p(e.dmgMul)}% attack and magic`));
    if (e.startGold) out.push(L(`+${e.startGold} Gold zum Start`, `+${e.startGold} starting gold`));
    if (e.startPotion) out.push(L(`+${e.startPotion} ${e.startPotion > 1 ? 'Tränke' : 'Trank'} zum Start`, `+${e.startPotion} starting potion${e.startPotion > 1 ? 's' : ''}`));
    if (e.potionHeal) out.push(L(`Tränke heilen ${p(e.potionHeal)} % mehr`, `Potions heal ${p(e.potionHeal)}% more`));
    if (e.extraStartSkill) out.push(L('Start mit einem Zauber mehr', 'Start with one more spell'));
    if (e.cdr) out.push(L(`Zauber laden ${p(e.cdr)} % schneller`, `Spells recharge ${p(e.cdr)}% faster`));
    if (e.talentSlots) out.push(L('Ein Platz mehr für passive Segen', 'One more slot for passive blessings'));
    if (e.gearW) out.push(e.gearW >= 2 ? L('Startwaffe selten (blau)', 'Rare starting weapon (blue)') : L('Startwaffe gut (grün)', 'Good starting weapon (green)'));
    if (e.gearA) out.push(L('Startrüstung gut (grün)', 'Good starting armor (green)'));
    if (e.gearHB) out.push(L('Guter Helm und gute Stiefel zum Start', 'Good helm and boots at the start'));
    if (e.shopOff) out.push(L(`Händler ${p(e.shopOff)} % billiger`, `Merchants ${p(e.shopOff)}% cheaper`));
    if (e.itemLuck) out.push(L(`Bessere Beute (+${e.itemLuck} Glück)`, `Better loot (+${e.itemLuck} luck)`));
    if (e.startBoon) out.push(e.startBoon > 1 ? L(`Start mit ${e.startBoon} Segen vom Schrein`, `Start with ${e.startBoon} shrine blessings`) : L('Start mit einem Segen vom Schrein', 'Start with a shrine blessing'));
    if (e.def) out.push(L(`+${e.def} Rüstung`, `+${e.def} armor`));
    if (e.crit) out.push(L(`+${e.crit} % Volltreffer`, `+${e.crit}% crit`));
    if (e.thorns) out.push(L(`Angreifer erleiden ${e.thorns} % zurück`, `Attackers take ${e.thorns}% back`));
    if (e.petStart) out.push(e.petStart > 1 ? L(`${e.petStart} Begleiter kommen von Anfang an mit`, `${e.petStart} pets join from the start`) : L('Ein Begleiter kommt von Anfang an mit', 'One pet joins from the start'));
    if (e.petDmg) out.push(L(`Begleiter +${p(e.petDmg)} % Schaden`, `Pets +${p(e.petDmg)}% damage`));
    if (e.petXp) out.push(L(`Begleiter gewinnen ${p(e.petXp)} % schneller Treue`, `Pets gain loyalty ${p(e.petXp)}% faster`));
    if (e.petSlots) out.push(L(`${1 + e.petSlots} Begleiter gleichzeitig`, `${1 + e.petSlots} pets at once`));
    return out.join(' · ');
  }
  const sumFx = (list, n, mul) => { const o = {}; for (let i = 0; i < n; i++) for (const k in list[i]) o[k] = (o[k] || 0) + list[i][k] * (mul || 1); return o; };
  // Was die nächste Stufe bringt, als neuer Gesamtwert (z. B. «+25 % Leben» statt «+5 %»)
  const nextFx = (b, lv) => { const all = sumFx(b.lv, lv + 1), o = {}; for (const k in b.lv[lv]) o[k] = all[k]; return o; };
  const FOLK_CLS = { mensch: 'klinge', fels: 'brau', schatten: 'weber', pilz: 'rufer', kobold: 'schuetze' };   // so stehen die Völker im Lager am Feuer
  const monImg = (id, box) => { const s = A.Art.monSprite(id, 0), k = Math.max(1, Math.floor(box / Math.max(s.w, s.h))); return `<img class="px" src="${s.url || (s.url = s.img.toDataURL())}" width="${s.w * k}" height="${s.h * k}" alt="">`; };

  // Erster Sieg über einen Weltenboss: der Wimpel kommt ins Lager
  function campNews() {
    const r = G.run, n = r && r.campNews; if (!n) return; r.campNews = null; G.save();
    const name = t(A.BOSSES[n.id].name), gold = n.st >= 2;
    // erst zeigen, wenn kein Fenster offen ist (nach dem Bosskampf kommt oft die Segen-Wahl)
    const say = () => { if (!dungeonEl.classList.contains('on')) return; if (overlay.classList.contains('on')) { setTimeout(say, 700); return; }
      A.FX.banner(gold ? L('Goldener Wimpel fürs Lager!', 'Golden pennant for the camp!') : L('Neuer Wimpel fürs Lager!', 'New pennant for the camp!'), `${name}: ${fxText(sumFx([A.BANNERS[n.id]], 1, n.st))} · +${n.sparks} ${t(U.meta)}`, '#c77dff', 3.4); S.level(); };
    setTimeout(say, 2600);
  }

  // Elite-Gegner mit Eigenschaften, die man noch nie gesehen hat: kurz vorstellen
  function eliteNews(list) {
    const ids = G.eliteSeen(list); if (!ids.length) return;

    setTimeout(() => {
      if (!dungeonEl.classList.contains('on') || overlay.classList.contains('on')) return;
      const sub = ids.length === 1 ? `${t(T(ids[0]).name)}: ${t(T(ids[0]).tip)}` : ids.map(id => t(T(id).name)).join(' · ');
      A.FX.banner(ids.length > 1 ? L('Neue Elite-Eigenschaften!', 'New elite traits!') : L('Neue Elite-Eigenschaft!', 'New elite trait!'), sub, T(ids[0]).col, 3);

  // Neue Seite im Elite-Buch (erst zeigen, wenn kein Fenster offen ist und «Raum gesäubert» vorbei ist)
  function bookNews(ids) {

      A.FX.banner(L('Neu im Elite-Buch!', 'New in the elite book!'), `${ids.map(id => t(A.ELITE_TRAITS[id].name)).join(' · ')} · +${ids.length * A.ELITE_BOOK_SPARKS} ${t(U.meta)}`, '#c77dff', 3); S.drop('epic'); };

  // ---------- Fortsetzen ----------
  function resume() { Portal.gameplayStart(); dungeon(false); }

  // ---------- Die Ebene (Echtzeit) ----------
  const input = A.Input;
  input.bindCanvas($('#arena'));
  let last = 0, hudT = 0;
  const perf = { n: 0, sum: 0 };
  function dungeon(fresh) {
    const r = G.run;
    if (r.over) { runOver(); return; }
    A.Scenes.hideTitle(); A.Scenes.stage(null);
    screen.style.display = 'none'; dungeonEl.classList.add('on'); document.body.classList.add('play'); hudUpdate();
    const hooks = {
      onItem: (it) => foundItem(it),
      onProp: (p) => useProp(p),
      onCleared: (room) => { if (room.type === 'boss') { Portal.happytime(); campNews(); } if (r.questJustDone) { r.questJustDone = false; setTimeout(() => A.FX.banner(t(U.questDone), r.quest ? t(r.quest.text) : '', '#63c74d', 2.4), 1300); } G.save(); setTimeout(pendingPicks, 400); },
      onDeath: () => { S.lose(); setTimeout(() => runOver(), 1100); },
      onLevel: () => { if (Wd.W) A.FX.ev('level', { h: Wd.W.hero, level: G.run.level }); hudUpdate(); },
      onElite: (list) => eliteNews(list),
      onBook: (ids) => bookNews(ids),
    };
    Wd.enter(r.floor, r.floorSeed, fresh ? null : r.rooms, hooks);
    r.rooms = Wd.saveRooms();
    buildControls(); pads(); fadeIn();
    S.music(A.Draw.themeOf(r.floor));
    A.FX.banner(t(U.floor) + ' ' + r.floor, A.worldName(r.floor), '#fee761', 2.6);
    if (fresh && r.floor === 1) { const coarse = matchMedia('(pointer: coarse)').matches; Wd.W.hint = coarse ? L('Links laufen, rechts schlagen', 'Left: move, right: attack') : L('WASD laufen · Leertaste schlagen · 1-4 Zauber', 'WASD move · Space attack · 1-4 spells'); setTimeout(() => { if (Wd.W && !Wd.W.active) Wd.W.hint = ''; }, 7000); }
    if (!last) { last = performance.now(); requestAnimationFrame(loop); }
    setTimeout(pendingPicks, 900);
  }
  function loop(now) {
    requestAnimationFrame(loop);
    const raw = Math.max(0, (now - last) / 1000); const dt = Math.min(0.05, raw); last = now;
    if (!dungeonEl.classList.contains('on') || !Wd.W) return;
    const inp = input.read();
    const sdt = A.FX.simDt(dt);
    if (sdt > 0) Wd.step(sdt, inp);
    A.FX.update(sdt);
    if (G.run) G.run.rooms = Wd.saveRooms();
    draw.draw(Wd.W, dt);
    controlsTick();
    hudT += dt; if (hudT > 0.1) { hudT = 0; hudUpdate(); }
    joyHint.classList.toggle('hide', !!input.joy.on);
    // Bildrate beobachten: kommt das Gerät nicht mit, wird die Darstellung einfacher (weniger Licht-Feinheiten, weniger Teilchen)
    if (draw.quality === 'hi' && !Wd.W.paused && raw < 0.25) {
      perf.n++; perf.sum += raw;
      if (perf.n >= 120) { if (perf.sum / perf.n > 0.026) { draw.quality = 'lo'; A.FX.low = true; } perf.n = 0; perf.sum = 0; }
    }
  }
  // Freie Fläche fürs Bild: oben die Anzeige, unten die Knöpfe, wenn sie die Bildmitte verdecken (Handy hochkant)
  function pads() {
    draw.topPad = hud.offsetHeight || 60;
    const c = $('#controls').getBoundingClientRect();
    draw.botPad = c.height && c.left < innerWidth * 0.62 ? Math.max(0, innerHeight - c.top) : 0;
  }
  window.addEventListener('resize', () => { if (document.body.classList.contains('play')) pads(); });
  // Knöpfe am Rand
  let ctl = null;
  function buildControls() {
    const r = G.run;
    const sk = r.active.filter(Boolean);
    $('#controls').innerHTML = `<div id="btnGrid">
      ${sk.map((id, i) => `<button class="cbtn sk" data-sk="${i}" style="grid-column:${4 - sk.length + i + 1 > 4 ? 4 : 4 - sk.length + i + 1}" aria-label="${esc(A.Boons.skName(id))}"><span class="ring"></span>${skIcon(id, 36)}<span class="key">${i + 1}</span></button>`).join('')}
      <button class="cbtn use" id="bUse" style="display:none"></button>
      <button class="cbtn pot" id="bPotion" aria-label="${esc(t(U.potion))}">${ic('potion', 33)}<span class="n"></span><span class="key">Q</span></button>
      <button class="cbtn atk" id="bAtk" aria-label="${L('Schlagen', 'Attack')}">${ic(WEAPON_ICON[r.cls] || 'i_schwert', 54)}<span class="key">${L('Leertaste', 'Space')}</span></button>
    </div>`;
    ctl = { atk: $('#bAtk'), use: $('#bUse'), pot: $('#bPotion'), sk: Array.from(document.querySelectorAll('#controls .sk')), useKind: null, cd: [] };
    input.bindAttack(ctl.atk);
    ctl.sk.forEach(b => b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (Wd.useSkill(+b.dataset.sk)) S.click(); }));
    ctl.pot.addEventListener('pointerdown', (e) => { e.preventDefault(); if (Wd.usePotion()) hudUpdate(); });
    ctl.use.addEventListener('pointerdown', (e) => { e.preventDefault(); Wd.interact(); });
  }
  function controlsTick() {
    if (!ctl || !Wd.W) return;
    const h = Wd.W.hero, r = G.run;
    ctl.sk.forEach((b, i) => {
      const id = h.skills[i]; if (!id) return;
      const cd = Math.max(0, (h.cds[id] || 0) - Wd.W.t); const tot = A.Boons.cd(id); const cold = cd > 0;
      if (ctl.cd[i] && !cold) { b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready'); }
      if (ctl.cd[i] !== cold) { ctl.cd[i] = cold; b.classList.toggle('cold', cold); }
      const p = (cd / tot * 100).toFixed(1) + '%'; if (b._p !== p) { b._p = p; b.firstChild.style.setProperty('--p', p); }
    });
    const n = String(r.potions); const nEl = ctl.pot.querySelector('.n'); if (nEl.textContent !== n) { nEl.textContent = n; ctl.pot.classList.toggle('cold', r.potions <= 0); }
    const k = Wd.W.near ? Wd.W.near.kind : '';
    if (ctl.useKind !== k) { ctl.useKind = k; ctl.use.style.display = k ? '' : 'none'; if (k) ctl.use.innerHTML = ic(PROP_ICON[k] || 'u_hand', 33) + '<span class="key">E</span>'; }
  }
  input.onKey = (code, e) => {
    if (!dungeonEl.classList.contains('on')) return;
    if (overlay.classList.contains('on')) { if (code === 'Escape' || code === 'KeyI' || code === 'Tab') { const b = overlay.querySelector('[data-esc]') || $('#bClose'); if (b) b.click(); e.preventDefault(); } return; }
    if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3' || code === 'Digit4') { if (Wd.useSkill(+code.slice(-1) - 1)) S.click(); }
    if (code === 'KeyQ') { if (Wd.usePotion()) hudUpdate(); }
    if (code === 'KeyE' || code === 'Enter') Wd.interact();
    if (code === 'KeyI' || code === 'Tab' || code === 'Escape') { e.preventDefault(); S.click(); showSheet(); }
    if (code === 'Space') e.preventDefault();
  };
  // ---------- Vergleich: ein Stück gegen das angelegte (Rechnung in compare.js) ----------
  // Karte für die Gegenüberstellung: schmal, damit zwei nebeneinander aufs Handy passen
  function cmpCard(it, tag, isNew) {
    const P = it.power && A.POWERS[it.power.id];
    const lines = G.itemLines(it).map(l => l.charAt(0) === '★' ? '★ ' + L('Trophäen-Kraft', 'Trophy power') : l);
    return `<div class="ccard ${isNew ? 'new' : ''} ${it.legend ? 'leg' : ''}" style="--rc:${rarCol(it.rarity)}"><div class="ctag">${tag}</div>
      <div class="chead">${itIcon(it, 36)}<div class="cmeta">${t(U.slot[it.slot === 'trinket2' ? 'trinket' : it.slot])}<br>${t(U.rarity[it.rarity])}</div></div>
      <div class="cname">${esc(G.itemName(it))}</div>${it.el ? `<div class="cel">${elBadge(it.el)}</div>` : ''}
      <div class="clines">${lines.map(l => `<div>${esc(l)}</div>`).join('') || `<div>${L('keine Werte', 'no stats')}</div>`}</div>
      ${P ? `<div class="cpw">${ic('u_spark', 12)}<span>${esc(t(P.name))}</span></div>` : ''}${it.legend ? `<div class="clg">${ic('u_star', 12)}<span>${L('Legende', 'Legend')}</span></div>` : ''}
    </div>`;
  }
  function cmpEmpty(slot) {
    return `<div class="ccard empty"><div class="ctag">${L('Angelegt', 'Equipped')}</div><div class="chead">${ic(SLOT_ICON[slot], 36, 'empty')}<div class="cmeta">${t(U.slot[slot === 'trinket2' ? 'trinket' : slot])}<br>${L('frei', 'free')}</div></div>
      <div class="cname">${L('Nichts', 'Nothing')}</div><div class="clines">${L('Der Platz ist frei.', 'The slot is free.')}</div></div>`;
  }
  // Zeile «Angriff 34 ▸ 41 +7»: grün mehr, rot weniger, grau, wenn der Wert für die Klasse kaum zählt
  function cmpRow(x) {
    const f = (v) => v + (x.pct ? ' %' : '');
    return `<div class="dr ${x.muted ? 'mute' : x.diff > 0 ? 'pos' : 'neg'}"><span class="dn">${esc(x.name)}${x.muted ? `<i>${L('nützt dir kaum', 'barely helps you')}</i>` : ''}</span><span class="dv">${f(x.a)}<i class="ar"></i><b>${f(x.b)}</b></span><span class="dd">${x.diff > 0 ? '+' : '−'}${f(Math.abs(x.diff))}</span></div>`;
  }
  // Was kommt dazu (grün), was fällt weg (rot): Element-Bonus, Kraft, Legende, Trophäe, zweite Chance; grau: ein Teil näher am nächsten Element-Bonus
  function cmpFx(x) {
    let icon = 'u_spark', html = '';
    if (x.kind === 'el' || x.kind === 'elnext') {
      const E = A.ELEMENTS[x.el], head = `<b style="color:${E.col}">${esc(t(E.name))} ${x.n}/6:</b> `; icon = E.icon;
      html = head + (x.kind === 'elnext' ? L(`Bei ${A.EL_TIERS[x.tier - 1]} Teilen`, `At ${A.EL_TIERS[x.tier - 1]} pieces`) : x.up ? L('Neuer Bonus', 'New bonus') : L('Bonus weg', 'Bonus lost')) + ': ' + esc(t(E.tiers[x.tier - 1]));
    } else if (x.kind === 'pw') {
      const nm = esc(t(A.POWERS[x.id].name)), txt = esc(A.Gear.powerText({ id: x.id, v: x.v }));
      html = x.from != null ? `<b>${nm} ${x.up ? L('stärker', 'stronger') : L('schwächer', 'weaker')}:</b> ${txt} (${L('bisher', 'before')} ${x.from})` : `<b>${x.up ? L('Neue Kraft', 'New power') : L('Kraft weg', 'Power lost')}: ${nm}.</b> ${txt}`;
    } else if (x.kind === 'leg') {
      const Lg = A.LEGENDS[x.id]; icon = 'u_star';
      html = `<b>${x.up ? L('Legende', 'Legend') : L('Legende weg', 'Legend lost')}: ${esc(t(Lg.name))}.</b> ${esc(t(Lg.text))}`;
    } else if (x.kind === 'tro') {
      const T = Object.values(A.TROPHIES).find(q => q.power === x.key); icon = 'u_star';
      html = `<b>${x.up ? L('Trophäen-Kraft', 'Trophy power') : L('Trophäen-Kraft weg', 'Trophy power lost')}:</b> ${esc(t(T.text))}`;
    } else if (x.kind === 'revive') {
      icon = 'u_heart';
      html = `<b>${x.up ? L('Zweite Chance', 'Second chance') : L('Zweite Chance weg', 'Second chance lost')}:</b> ${L('Einmal pro Durchlauf überleben', 'Survive once per run')}${x.used ? L(' (schon verbraucht)', ' (already used)') : ''}`;
    } else if (x.kind === 'combo' || x.kind === 'comboready') {   // Kombo (combos.js): erwachte wirkt wieder oder ruht, sonst bereit bis zum nächsten Schrein
      const Cb = A.COMBOS[x.id], head = x.kind === 'combo' ? (x.up ? L('Kombo wirkt wieder', 'Combo works again') : L('Kombo ruht', 'Combo rests')) : x.up ? L('Kombo bereit', 'Combo ready') : L('Kombo-Teil weg', 'Combo piece lost');
      html = `<b>${head}: ${esc(t(Cb.name))}.</b> ${x.kind === 'comboready' && x.up ? L('Erwacht am nächsten Schrein. ', 'Awakens at the next shrine. ') : ''}${esc(t(Cb.text))}`;
      return `<div class="eld cb ${x.up ? 'up' : 'down'}">${cbIcon(x.id, 12)}<span>${html}</span></div>`;
    }
    return `<div class="eld ${x.kind === 'elnext' ? 'next' : x.up ? 'up' : 'down'} ${x.kind === 'leg' ? 'leg' : ''}">${ic(icon, 14)}<span>${html}</span></div>`;
  }
  // Tipp: besser oder unterm Strich eher stärker: anlegen (eine Legende auch bei Geschmackssache: ausprobieren lohnt sich, das alte Stück bleibt im Beutel);
  // sonst anders: behalten; schlechter oder gleich: verkaufen (Legenden behalten)
  function cmpTip(c) {
    if (c.verdict === 'better' || (c.verdict === 'mixed' && (c.lean === 'up' || (c.lean === 'even' && c.it.legend)))) return 'equip';
    return c.verdict === 'mixed' || c.it.legend ? 'keep' : 'sell';
  }
  // Vergleichsfenster. o.ctx: 'found' (gerade aufgehoben), 'bag' (liegt im Beutel) oder 'shop' (beim Händler, o.idx und o.price);
  // o.back: zurück zum Fenster davor; o.slot: welcher Schmuck weichen soll; o.lg: Eintrag in der Legenden-Sammlung (beim Fund)
  function compareView(it, o) {
    const r = G.run, list = A.Compare.all(it), c = list.find(x => x.slot === o.slot) || list[0], tip = cmpTip(c);
    const found = o.ctx === 'found', inShop = o.ctx === 'shop';
    const head = found ? `<div class="foundhead"><div class="bigicon ${it.legend ? 'legicon' : ''}" style="filter:drop-shadow(0 0 14px ${rarCol(it.rarity)})">${itIcon(it, 54)}</div><h2 class="${it.legend ? 'goldc' : ''}">${it.legend ? L('Eine Legende!', 'A legend!') : L('Gefunden', 'Found')}</h2></div>${legNewHtml(o.lg)}`
      : `<h2 class="mid">${L('Vergleich', 'Comparison')}</h2>`;
    const pick = list.length > 1 ? `<div class="cmppick"><div class="mini">${L('Beide Schmuck-Plätze sind belegt. Welcher Schmuck soll weichen?', 'Both trinket slots are taken. Which trinket should go?')}</div>${list.map(x => `<button data-slot="${x.slot}" class="${x === c ? 'on' : ''}">${itIcon(x.old, 22)}<span>${esc(G.itemName(x.old))}</span><span class="vchip ${x.verdict}">${t(VERD[x.verdict])}</span></button>`).join('')}</div>` : '';
    const tag = inShop ? L('Zu kaufen', 'For sale') : o.ctx === 'bag' ? L('Im Beutel', 'In your bag') : L('Neu', 'New');
    const cards = `<div class="cmpcards">${cmpCard(it, tag, true)}${c.old ? cmpCard(c.old, L('Angelegt', 'Equipped')) : cmpEmpty(c.slot)}</div>`;
    const lean = c.lean === 'up' ? L(' Unterm Strich eher stärker.', ' Overall rather stronger.') : c.lean === 'down' ? L(' Unterm Strich eher schwächer.', ' Overall rather weaker.') : c.lean === 'even' ? L(' Geschmackssache.', ' A matter of taste.') : '';
    const verdict = `<div class="verdict ${c.verdict}"><b>${t(VERD[c.verdict])}</b><span>${esc(c.why + lean)}</span></div>`;
    const changes = `<div class="drows">${c.rows.map(cmpRow).join('')}</div>${c.fx.map(cmpFx).join('')}`;
    // Knöpfe: immer in derselben Reihenfolge, der Tipp leuchtet golden
    const sub = (h) => `<span class="bs">${h}</span>`;
    const sold = (x) => { const w = G.wouldSell(x); return w ? ' ' + L(`Beutel voll: ${esc(G.itemName(w))} wird verkauft.`, `Bag full: ${esc(G.itemName(w))} gets sold.`) : ''; };
    const eqSub = c.old ? L(`${esc(G.itemName(c.old))} kommt in den Beutel.`, `${esc(G.itemName(c.old))} goes to your bag.`) + (o.ctx === 'bag' ? '' : sold(c.old)) : L('Der Platz ist frei.', 'The slot is free.');
