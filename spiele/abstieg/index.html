<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Der Abstieg – Dungeon-Action: Wähle Rasse und Klasse, kämpfe dich Raum für Raum tiefer, sammle verrückte Items, stirb, komm tiefer.">
<meta name="theme-color" content="#181425">
<title>Der Abstieg</title>
<style>
  /* Schriften: Pixelify Sans (Copyright 2021 The Pixelify Sans Project Authors, https://github.com/eifetx/Pixelify-Sans) und Jacquard 24 (Copyright 2023 The Soft Type Project Authors, https://github.com/scfried/soft-type-jacquard), beide unter der SIL Open Font License 1.1 (https://openfontlicense.org), Lizenztext in fonts/OFL-*.txt */
  @font-face { font-family: 'Pixelify Sans'; src: url(fonts/pixelify.woff2) format('woff2'); font-weight: 400 700; font-display: block; }
  @font-face { font-family: 'Jacquard 24'; src: url(fonts/jacquard24.woff2) format('woff2'); font-display: block; }
  :root {
    --ink: #181425; --night: #1d1a2e; --panel: #262b44; --panel2: #2e3452; --line: #3a4466; --steel: #5a6988; --mist: #8b9bb4; --pale: #c0cbdc;
    --text: #ead4aa; --muted: #8b9bb4; --gold: #feae34; --gold2: #fee761; --orange: #f77622; --rust: #be4a2f; --red: #e43b44; --dred: #a22633;
    --green: #63c74d; --cyan: #2ce8f5; --blue: #0099db; --spark: #c77dff;
    --ui: 'Pixelify Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --deco: 'Jacquard 24', 'Pixelify Sans', serif;
    --notch: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    --notch2: polygon(6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px), 0 6px, 3px 6px, 3px 3px, 6px 3px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
  body { user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; }
  img.px { image-rendering: pixelated; image-rendering: crisp-edges; vertical-align: middle; flex: none; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  body.play #bg { display: none; }
  #app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; z-index: 1; }
  body.play #app { max-width: none; }

  /* ---------- Anzeige oben (Held, Leben, Gold, Tränke, Ebene) ---------- */
  #hud { display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 6; align-items: center; gap: 7px; padding: calc(7px + env(safe-area-inset-top)) 10px 16px; background: linear-gradient(rgba(24,20,37,0.92) 0%, rgba(24,20,37,0.7) 62%, rgba(24,20,37,0) 100%); pointer-events: none; }
  body.play #hud { max-width: 620px; margin: 0 auto; }
  #hud.on { display: flex; }
  #hud > * { pointer-events: auto; }
  #heroBtn { position: relative; width: 46px; height: 46px; flex: none; border: 3px solid var(--ink); clip-path: var(--notch); background: radial-gradient(circle at 50% 30%, #4a557a, #262b44 75%); box-shadow: inset 0 0 0 2px var(--steel), inset 0 -4px 0 2px rgba(0,0,0,0.3); cursor: pointer; padding: 0; display: grid; place-items: center; overflow: hidden; }
  #heroBtn img { width: 36px; height: 26px; margin-top: 8px; }
  #heroBtn .lv { position: absolute; left: 0; bottom: 0; min-width: 18px; padding: 1px 3px 2px; background: var(--ink); color: var(--gold2); font-size: 12px; font-weight: 700; line-height: 1; }
  #heroBtn .plus { display: none; position: absolute; right: 1px; top: 1px; width: 15px; height: 15px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 700; line-height: 14px; text-align: center; }
  #heroBtn.pts { box-shadow: inset 0 0 0 2px var(--gold), inset 0 -4px 0 2px rgba(0,0,0,0.3); animation: ptsPulse 1s steps(2) infinite; }
  #heroBtn.pts .plus { display: block; }
  @keyframes ptsPulse { 50% { background: radial-gradient(circle at 50% 30%, #6a5a3a, #3e2731 75%); } }
  #bars { flex: 1; min-width: 70px; display: flex; flex-direction: column; gap: 4px; }
  #hpbar { position: relative; height: 18px; background: var(--ink); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--steel); overflow: hidden; }
  #hpbar b, #hpbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; display: block; }
  #hpbar b { background: #f6757a; transition: width 0.6s 0.25s; }
  #hpbar i { background: linear-gradient(#f6757a 0 3px, #e43b44 3px 11px, #a22633 11px); transition: width 0.12s; }
  #hpbar.low i { animation: lowHp 0.6s steps(2) infinite; }
  @keyframes lowHp { 50% { filter: brightness(1.5); } }
  #hudGold.bump, #hudPot.bump { animation: hudBump 0.25s ease-out; }
  @keyframes hudBump { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.18); filter: brightness(1.6); } 100% { transform: scale(1); filter: brightness(1); } }
  #hptext { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; line-height: 1; color: #fff; text-shadow: 1px 0 var(--ink), -1px 0 var(--ink), 0 1px var(--ink), 0 -1px var(--ink); }
  #xpbar { height: 6px; background: var(--ink); box-shadow: 0 0 0 1px #3a4466; }
  #xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(#e0a4ff 0 2px, #9b55d6 2px); transition: width 0.3s; }
  .pill { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 7px 0 5px; background: rgba(24,20,37,0.85); border: 2px solid var(--line); clip-path: var(--notch); font-size: 15px; font-weight: 700; white-space: nowrap; line-height: 1; }
  .pill.gold { color: var(--gold2); }
  .pill.bump { animation: bump 0.25s; }
  @keyframes bump { 40% { transform: scale(1.18); } }

  /* ---------- Menüs ---------- */
  #screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom)); position: relative; }
  h1, h2 { font-family: var(--deco); font-weight: 400; color: var(--gold2); margin: 0; line-height: 1; letter-spacing: 1px; }
  h2 { font-size: 34px; margin: 0 0 10px; text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink), 0 4px var(--ink), 0 0 14px rgba(247,118,34,0.35); display: flex; align-items: center; gap: 10px; }
  h3 { font-size: 15px; font-weight: 700; color: var(--mist); text-transform: uppercase; letter-spacing: 2px; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
  h3::after { content: ''; flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 9px); }
  .sub { color: var(--mist); font-size: 15px; margin-bottom: 14px; line-height: 1.35; }
  .center { text-align: center; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 9px; padding: 12px 14px 14px; border: 3px solid var(--ink); clip-path: var(--notch); background: #3a4466; color: var(--text); font-family: var(--ui); font-size: 18px; font-weight: 700; line-height: 1.1; letter-spacing: 0.5px; text-shadow: 0 2px 0 rgba(0,0,0,0.45); box-shadow: inset 0 -4px 0 #262b44, inset 0 3px 0 #5a6988; cursor: pointer; text-align: center; }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 #262b44, inset 0 3px 0 #262b44; }
  .btn.primary { background: var(--gold); color: #3e2731; text-shadow: 0 1px 0 rgba(255,255,255,0.4); box-shadow: inset 0 -4px 0 #be4a2f, inset 0 3px 0 #fee761; }
  .btn.primary:active:not(:disabled) { box-shadow: inset 0 -2px 0 #be4a2f, inset 0 3px 0 #be4a2f; }
  .btn.danger { background: #a22633; box-shadow: inset 0 -4px 0 #5a1420, inset 0 3px 0 #e43b44; }
  .btn.small { display: inline-flex; width: auto; padding: 7px 11px 9px; font-size: 14px; margin: 4px 4px 0 0; }
  .btn:disabled { filter: grayscale(0.85) brightness(0.65); cursor: default; }
  .sp { display: inline-flex; align-items: center; gap: 4px; color: var(--spark); font-weight: 700; }
  .spark { color: var(--spark); font-weight: 700; }
  .primary .sp { color: #3e2731; }
  .primary img.coin { background: #3e2731; border-radius: 50%; box-shadow: 0 0 0 1px #3e2731; }
  .goldc img.px, .sp img.px { margin-right: 1px; }
  h2.mid { justify-content: center; text-align: center; }
  .link { display: inline-block; margin-top: 14px; background: none; border: 0; padding: 4px 8px; color: var(--steel); font-family: var(--ui); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  img.px.empty { opacity: 0.3; filter: grayscale(1); }
  .sheethead { display: flex; align-items: center; gap: 12px; margin: -4px 0 12px; }
  .sheethead img { background: radial-gradient(circle, #3a4466, transparent 70%); }
  .sheethead .nm { font-family: var(--deco); font-size: 30px; line-height: 1; color: var(--gold2); text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink); }
  .goldc { color: var(--gold2); font-weight: 700; }
  .card { position: relative; background: linear-gradient(#2a2f4a, #242840); border: 3px solid var(--ink); clip-path: var(--notch); box-shadow: inset 0 0 0 2px #333b5c, inset 0 3px 0 2px rgba(255,255,255,0.05); padding: 11px 13px; margin-bottom: 8px; }
  .card.locked { filter: saturate(0.3) brightness(0.75); }
  .card .ttl { font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .ttl > span { display: flex; align-items: center; gap: 8px; }
  .card .txt { color: var(--mist); font-size: 14px; margin-top: 4px; line-height: 1.3; }
  .mini { font-size: 13px; color: var(--mist); line-height: 1.35; }
  .msg { background: rgba(24,20,37,0.6); border-left: 4px solid var(--steel); padding: 11px 13px; margin: 10px 0; font-size: 16px; line-height: 1.4; }
  .q { display: flex; align-items: center; gap: 8px; background: rgba(254,174,52,0.08); border: 2px dashed rgba(254,174,52,0.45); padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }

  /* Gegenstände */
  .item { --rc: #c0cbdc; position: relative; display: flex; gap: 11px; align-items: center; background: #252a42; background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 13%, #262b44) 0%, #242840 60%); border: 3px solid var(--ink); clip-path: var(--notch); box-shadow: inset 3px 0 0 var(--rc), inset 0 0 0 2px #333b5c; padding: 9px 10px 9px 12px; margin-bottom: 8px; }
  .item .ic { width: 50px; height: 50px; flex: none; display: grid; place-items: center; background: #181425; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 35%, #181425) 0%, #181425 75%); border: 2px solid color-mix(in srgb, var(--rc) 60%, #181425); }
  .item .ic.empty { opacity: 0.35; filter: grayscale(1); }
  .item .bd { flex: 1; min-width: 0; }
  .item .nm { font-weight: 700; font-size: 16px; color: var(--rc); line-height: 1.15; }
  .item .ln { color: var(--pale); font-size: 13.5px; margin-top: 2px; line-height: 1.3; }
  .item .fl { color: #c28569; font-size: 13px; font-style: italic; margin-top: 3px; line-height: 1.3; }
  .item .act { display: flex; flex-direction: column; gap: 5px; justify-content: center; }
  .item .act button { border: 3px solid var(--ink); clip-path: var(--notch); padding: 6px 9px 8px; font-weight: 700; font-size: 14px; background: #3a4466; box-shadow: inset 0 -3px 0 #262b44, inset 0 2px 0 #5a6988; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; justify-content: center; }
  .item .act button.primary { background: var(--gold); color: #3e2731; box-shadow: inset 0 -3px 0 #be4a2f, inset 0 2px 0 #fee761; }
  .item .act button:disabled { filter: grayscale(0.85) brightness(0.65); cursor: default; }
  .slotlbl { font-size: 12px; color: var(--mist); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .up, .down { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .up::before, .down::before { content: ''; border: 5px solid transparent; }
  .up::before { border-bottom: 7px solid currentColor; border-top-width: 0; }
  .down::before { border-top: 7px solid currentColor; border-bottom-width: 0; }

  /* Heldenblatt */
  .stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 2px solid rgba(58,68,102,0.6); font-size: 17px; }
  .stat > span { display: flex; align-items: center; gap: 9px; }
  .stat b { min-width: 30px; text-align: right; font-size: 19px; color: #fff; }
  .stat button { border: 3px solid var(--ink); clip-path: var(--notch); width: 36px; height: 32px; font-weight: 700; font-size: 20px; line-height: 1; background: var(--gold); color: #3e2731; box-shadow: inset 0 -3px 0 #be4a2f, inset 0 2px 0 #fee761; cursor: pointer; margin-left: 8px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px; font-size: 14px; color: var(--mist); }
  .kv span { display: flex; justify-content: space-between; gap: 6px; }
  .kv b { color: var(--text); }
  .skill { display: flex; align-items: center; gap: 11px; background: linear-gradient(#2a2f4a, #242840); border: 3px solid var(--ink); clip-path: var(--notch); box-shadow: inset 0 0 0 2px #333b5c; padding: 8px 10px; margin-bottom: 7px; cursor: pointer; }
  .skill.on { box-shadow: inset 0 0 0 2px var(--gold); background: linear-gradient(#3b3550, #2c2740); }
  .skill .si { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: radial-gradient(circle, #1f5a8a, #181425 75%); border: 2px solid #124e89; border-radius: 50%; }
  .skill.on .si { border-color: var(--gold); }
  .skill .nm { font-weight: 700; font-size: 16px; }
  .skill .ds { color: var(--mist); font-size: 13.5px; line-height: 1.3; margin-top: 2px; }
  .skill .cd { margin-left: auto; font-size: 13px; color: var(--mist); white-space: nowrap; }
  .tabs { display: flex; gap: 5px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 3px solid var(--ink); clip-path: var(--notch); padding: 8px 4px 10px; font-weight: 700; font-size: 15px; background: #262b44; color: var(--mist); box-shadow: inset 0 -3px 0 #1d1a2e; cursor: pointer; }
  .tabs button.on { background: #3a4466; color: var(--gold2); box-shadow: inset 0 3px 0 #5a6988, inset 0 -3px 0 #262b44; }

  /* ---------- Spielfeld und Knöpfe ---------- */
  #dungeon { display: none; flex: 1; position: relative; overflow: hidden; background: #0e0c16; }
  #dungeon.on { display: block; }
  #fade { position: fixed; inset: 0; background: #0e0c16; opacity: 0; pointer-events: none; z-index: 50; }
  #arena { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; z-index: 1; }
  #arena3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #dungeon.d3 #arena3d { display: block; }
  #dungeon.d3 #arena { image-rendering: auto; }
  .iconbtn.look { width: auto; padding: 0 10px; font-weight: 700; font-size: 15px; color: var(--mist); letter-spacing: 0.5px; }
  .iconbtn.look b { color: var(--gold2); margin-left: 5px; }
  #controls { position: absolute; right: calc(12px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); pointer-events: none; z-index: 4; }
  #btnGrid { display: grid; grid-template-columns: repeat(4, 58px); grid-template-rows: 58px 88px; gap: 9px; justify-items: center; align-items: end; }
  .cbtn { pointer-events: auto; position: relative; width: 58px; height: 58px; border: 3px solid var(--ink); border-radius: 50%; color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    background: radial-gradient(circle at 50% 32%, #4a557a 0%, #262b44 72%); box-shadow: inset 0 -5px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.18), 0 3px 0 rgba(0,0,0,0.45); }
  .cbtn:active { transform: translateY(2px); }
  .cbtn img.px { position: relative; z-index: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.45)); }
  .cbtn.sk { grid-row: 1; }
  .cbtn.pot { grid-column: 2; grid-row: 2; }
  .cbtn.atk { width: 88px; height: 88px; grid-column: 3 / 5; grid-row: 2; justify-self: end; background: radial-gradient(circle at 50% 30%, #fee761 0%, #feae34 46%, #be4a2f 100%); box-shadow: inset 0 -6px 0 rgba(115,30,20,0.55), inset 0 4px 0 rgba(255,255,255,0.45), 0 4px 0 rgba(0,0,0,0.5); }
  .cbtn.sk { background: radial-gradient(circle at 50% 30%, #2ce8f5 0%, #0099db 45%, #124e89 100%); }
  .cbtn.pot { background: radial-gradient(circle at 50% 30%, #f6757a 0%, #e43b44 45%, #a22633 100%); }
  .cbtn.use { grid-column: 1; grid-row: 2; background: radial-gradient(circle at 50% 30%, #a2e05a 0%, #63c74d 45%, #265c42 100%); animation: usePulse 0.9s ease-in-out infinite; }
  @keyframes usePulse { 50% { box-shadow: inset 0 -5px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.18), 0 3px 0 rgba(0,0,0,0.45), 0 0 0 4px rgba(99,199,77,0.45); } }
  .cbtn .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(24,20,37,0.78) var(--p, 0%), transparent 0); pointer-events: none; z-index: 2; }
  .cbtn.cold img.px { filter: grayscale(0.7) brightness(0.8); }
  .cbtn.ready { animation: ready 0.35s ease-out; }
  @keyframes ready { 0% { box-shadow: 0 0 0 0 rgba(254,231,97,0.9); } 100% { box-shadow: 0 0 0 12px rgba(254,231,97,0); } }
  .cbtn .n { position: absolute; right: 4px; bottom: 2px; z-index: 3; font-size: 15px; font-weight: 700; text-shadow: 1px 0 var(--ink), -1px 0 var(--ink), 0 1px var(--ink), 0 -1px var(--ink); }
  .cbtn .key { position: absolute; top: 3px; left: 0; right: 0; z-index: 3; text-align: center; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.75); text-shadow: 0 1px 0 var(--ink); }
  .cbtn.atk .key { top: auto; bottom: 6px; color: rgba(62,39,49,0.8); text-shadow: none; }
  @media (pointer: coarse) { .cbtn .key { display: none; } }
  @media (max-width: 360px) { #btnGrid { grid-template-columns: repeat(4, 50px); grid-template-rows: 50px 78px; gap: 7px; } .cbtn { width: 50px; height: 50px; } .cbtn.atk { width: 78px; height: 78px; } }
  #joyHint { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; border: 3px solid rgba(192,203,220,0.16); background: radial-gradient(circle, rgba(192,203,220,0.12) 0 20px, transparent 21px); pointer-events: none; transition: opacity 0.2s; z-index: 3; }
  #joyHint.hide { opacity: 0; }
  @media (pointer: fine) { #joyHint { display: none; } }

  /* ---------- Fenster über dem Spiel ---------- */
  #overlay { display: none; position: absolute; inset: 0; background: rgba(14,12,22,0.82); z-index: 10; padding: calc(64px + env(safe-area-inset-top)) 12px 16px; overflow-y: auto; }
  #overlay.on { display: block; }
  body:not(.play) #overlay { padding-top: 16px; }
  .ovbox { position: relative; max-width: 500px; margin: 4px auto 16px; background: linear-gradient(#2b3150, #22263d 40%); border: 3px solid var(--ink); clip-path: var(--notch2); box-shadow: inset 0 0 0 3px #46507a, inset 0 0 0 5px var(--ink), inset 0 8px 0 5px rgba(255,255,255,0.04); padding: 18px 16px 16px; animation: pop 0.2s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(0.88); opacity: 0; } }
  .bigicon { display: flex; justify-content: center; margin: 4px 0 10px; filter: drop-shadow(0 0 14px rgba(254,174,52,0.35)); }
  .big { font-family: var(--deco); font-size: 54px; line-height: 1; display: flex; justify-content: center; margin-top: 6px; }
  .big .sp { gap: 8px; }
  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .chip { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; padding: 14px 2px 6px; border: 3px solid var(--ink); clip-path: var(--notch); background: linear-gradient(#2e3452, #22263d); box-shadow: inset 0 0 0 2px #3a4466; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--pale); text-align: center; line-height: 1.05; }
  .chip.sel { background: linear-gradient(#5a4a30, #3e2f2a); box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold2); }
  .chip.locked { filter: grayscale(0.9) brightness(0.6); }

  .logo { position: relative; margin-bottom: 4px; display: flex; flex-direction: column; align-items: center; }
  .logo .pre { font-family: var(--deco); font-size: clamp(30px, 9vw, 50px); line-height: 0.9; color: #c0cbdc; filter: drop-shadow(2px 0 0 #181425) drop-shadow(-2px 0 0 #181425) drop-shadow(0 2px 0 #181425) drop-shadow(0 -2px 0 #181425) drop-shadow(0 3px 0 #262b44); margin-bottom: -4px; }
  .logo h1 { font-size: clamp(66px, 22vw, 124px); letter-spacing: 2px; line-height: 0.95; color: transparent; background: linear-gradient(#fff6c8 0%, #fee761 30%, #feae34 62%, #f77622 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(3px 0 0 #181425) drop-shadow(-3px 0 0 #181425) drop-shadow(0 3px 0 #181425) drop-shadow(0 -3px 0 #181425) drop-shadow(0 5px 0 #3e2731) drop-shadow(0 0 22px rgba(247,118,34,0.55)); }
  .tag { font-size: 16px; color: var(--pale); margin: 6px 0 0; text-shadow: 0 2px 0 var(--ink); max-width: 320px; line-height: 1.35; }
  .menu { width: 100%; max-width: 340px; margin-top: auto; padding-top: 24px; }
  .stats { margin-top: 12px; font-size: 13px; color: var(--mist); text-shadow: 0 2px 0 var(--ink); }
  .topbar { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; display: flex; gap: 6px; }
  .iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 3px solid var(--ink); clip-path: var(--notch); background: rgba(38,43,68,0.85); box-shadow: inset 0 -3px 0 #1d1a2e, inset 0 2px 0 #5a6988; cursor: pointer; padding: 0; }
  .howto { margin-top: 12px; font-size: 13px; color: var(--mist); line-height: 1.4; max-width: 360px; text-shadow: 0 2px 0 var(--ink); }
  @media (pointer: coarse) { .howto.pc { display: none; } }
  .upg { display: flex; gap: 12px; align-items: center; }
