<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Der Abstieg – 18 Ebenen tief. Wähle Rasse und Klasse, sammle verrückte Items, stirb, komm tiefer.">
<title>Der Abstieg</title>
<style>
  :root { --bg: #140f19; --panel: #1f1727; --card: #2b2136; --card2: #362a44; --line: rgba(255,255,255,0.08); --text: #f1e9dc; --muted: #a596b8; --gold: #f5c542; --hp: #6fdc7a; --bad: #ff5f5f; --blue: #57a6ff; --spark: #b07cd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  #app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
  #hud { display: none; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  #hud.on { display: flex; }
  #hud .pill { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.06); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
  #hpwrap { flex: 1; min-width: 60px; }
  #hpbar { height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; }
  #hpbar i { display: block; height: 100%; background: var(--hp); width: 100%; transition: width 0.3s; }
  #hptext { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
  #heroBtn { border: 0; background: var(--card2); border-radius: 10px; padding: 5px 9px; font-weight: 800; cursor: pointer; }
  #heroBtn.pts { background: var(--gold); color: #3a2a00; }
  #screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: 1px; }
  h2 { font-size: 20px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px 14px; font-weight: 800; font-size: 16px; background: var(--card2); cursor: pointer; margin-top: 8px; text-align: center; }
  .btn.primary { background: var(--gold); color: #3a2a00; }
  .btn.danger { background: #5a2a2a; }
  .btn.small { display: inline-block; width: auto; padding: 8px 12px; font-size: 13px; margin: 4px 4px 0 0; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .card { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .card.sel { outline: 2px solid var(--gold); }
  .card.locked { opacity: 0.5; }
  .card.click { cursor: pointer; }
  .card .ttl { font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .txt { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { background: var(--card); border-radius: 16px; padding: 16px 10px; text-align: center; cursor: pointer; border: 2px solid transparent; }
  .choice:active { border-color: var(--gold); }
  .choice .ico { font-size: 34px; }
  .choice .lbl { font-weight: 800; margin-top: 6px; }
  .choice .txt { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item { display: flex; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #888; }
  .item .nm { font-weight: 800; }
  .item .ln { color: var(--muted); font-size: 12.5px; }
  .item .fl { color: #d8c8a0; font-size: 12px; font-style: italic; margin-top: 3px; }
  .item .act { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .item .act button { border: 0; border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 13px; background: var(--card2); cursor: pointer; white-space: nowrap; }
  .item .act button.primary { background: var(--gold); color: #3a2a00; }
  .item.cmp { border-left-width: 4px; }
  .slotlbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .stat b { min-width: 30px; text-align: right; }
  .stat button { border: 0; border-radius: 8px; width: 34px; height: 30px; font-weight: 900; background: var(--gold); color: #3a2a00; cursor: pointer; margin-left: 8px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .kv b { color: var(--text); }
  .skill { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; border: 2px solid transparent; }
  .skill.on { border-color: var(--gold); }
  .skill .nm { font-weight: 800; font-size: 14px; }
  .skill .ds { color: var(--muted); font-size: 12px; }
  .skill .cd { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; border: 0; border-radius: 10px; padding: 8px; font-weight: 800; background: transparent; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: var(--card2); color: var(--text); }
  .toggle { display: flex; background: var(--card); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .toggle button { flex: 1; border: 0; padding: 9px; font-weight: 800; background: transparent; color: var(--muted); cursor: pointer; }
  .toggle button.on { background: var(--card2); color: var(--text); }
  #combat { display: none; position: absolute; inset: 0; background: var(--bg); flex-direction: column; z-index: 5; }
  #combat.on { display: flex; }
  #arena { flex: 1; width: 100%; display: block; }
  #cbar { display: flex; gap: 6px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); align-items: center; }
  #cbar .sp { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 800; background: var(--card); cursor: pointer; }
  #cbar .sp.on { background: var(--gold); color: #3a2a00; }
  #cbar .log { flex: 1; font-size: 12px; color: var(--muted); text-align: right; }
  #overlay { display: none; position: absolute; inset: 0; background: rgba(10,6,14,0.85); z-index: 10; padding: 16px; overflow-y: auto; }
  #overlay.on { display: block; }
  .ovbox { max-width: 520px; margin: 20px auto; background: var(--panel); border-radius: 18px; padding: 16px; }
  .center { text-align: center; }
  .big { font-size: 40px; font-weight: 900; }
  .spark { color: var(--spark); font-weight: 800; }
  .goldc { color: var(--gold); font-weight: 800; }
  .q { background: rgba(245,197,66,0.08); border: 1px dashed rgba(245,197,66,0.4); border-radius: 12px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  .q.done { border-style: solid; color: var(--hp); border-color: var(--hp); }
  .msg { background: var(--card); border-radius: 12px; padding: 12px; margin: 10px 0; font-size: 15px; }
  .mini { font-size: 12px; color: var(--muted); }
  .rar-common { border-left-color: #b8b8b8; } .rar-good { border-left-color: #6fdc7a; } .rar-rare { border-left-color: #57a6ff; } .rar-epic { border-left-color: #c77dff; } .rar-legendary { border-left-color: #f5c542; } .rar-cursed { border-left-color: #ff5f5f; }
  .rc-common { color: #b8b8b8; } .rc-good { color: #6fdc7a; } .rc-rare { color: #57a6ff; } .rc-epic { color: #c77dff; } .rc-legendary { color: #f5c542; } .rc-cursed { color: #ff5f5f; }
  .enemy { display: inline-block; background: var(--card); border-radius: 10px; padding: 6px 10px; margin: 0 6px 6px 0; font-size: 13px; }
  .enemy b { display: block; }
  .pointsBadge { background: var(--gold); color: #3a2a00; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 900; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill" id="hudFloor"></div>
    <div id="hpwrap"><div id="hpbar"><i></i></div><div id="hptext"></div></div>
    <div class="pill" id="hudGold">🪙 0</div>
    <div class="pill" id="hudPot">🧪 0</div>
    <button id="heroBtn"></button>
  </div>
  <div id="screen"></div>
  <div id="combat">
    <canvas id="arena"></canvas>
    <div id="cbar"><button class="sp on" data-sp="1">1×</button><button class="sp" data-sp="2">2×</button><button class="sp" data-sp="3">3×</button><div class="log" id="clog"></div></div>
  </div>
  <div id="overlay"></div>
</div>
<script src="js/rng.js"></script>
<script src="js/data.js"></script>
<script src="js/combat.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
