<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Zwergen-Mine – grabe immer tiefer, heuere Zwerge an und finde Schätze.">
<title>Zwergen-Mine</title>
<style>
  :root {
    --bg: #15111c; --panel: #221b2d; --card: #2e2540; --card-hi: #3a2f52;
    --text: #f3ead8; --muted: #a99bbd; --gold: #f5c542; --gem: #57d2ff; --ok: #6fdc7a; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
  #hud { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; background: linear-gradient(#1d1726, #15111c); z-index: 2; }
  .pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .pill svg { width: 20px; height: 20px; flex: none; }
  #gold { color: var(--gold); }
  #gems { color: var(--gem); }
  #depthPill { margin-left: auto; }
  #dps { font-size: 12px; color: var(--muted); font-weight: 600; }
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #bossBtn { position: absolute; left: 12px; top: 12px; display: none; background: #8b2d2d; color: #fff; border: 0; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 15px; box-shadow: 0 0 0 0 rgba(255,107,107,0.7); animation: pulse 1.4s infinite; cursor: pointer; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,107,0.6); } 70% { box-shadow: 0 0 0 12px rgba(255,107,107,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); } }
  #panel { flex: 0 0 auto; background: var(--panel); border-radius: 18px 18px 0 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); z-index: 2; }
  #tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 4px; border-radius: 12px; background: transparent; color: var(--muted); border: 0; font-weight: 700; font-size: 14px; cursor: pointer; position: relative; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { background: var(--card); color: var(--text); }
  .tab .dot { position: absolute; top: 5px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: none; }
  .tab .dot.show { display: block; }
  #list { display: flex; flex-direction: column; gap: 6px; height: 34vh; max-height: 300px; min-height: 170px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }
  .card { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 8px 8px 8px 10px; }
  .card.locked { opacity: 0.45; }
  .ico { width: 44px; height: 44px; flex: none; border-radius: 10px; background: rgba(0,0,0,0.25); display: grid; place-items: center; }
  .ico canvas { width: 40px; height: 40px; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 800; font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
  .lvl { color: var(--muted); font-size: 12px; font-weight: 700; }
  .eff { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .eff b { color: var(--ok); font-weight: 700; }
  .bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; }
  .buy { flex: none; min-width: 84px; border: 0; border-radius: 12px; padding: 9px 8px; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #4a3f60; color: var(--muted); cursor: pointer; }
  .buy svg { width: 16px; height: 16px; }
  .buy.can { background: var(--gold); color: #3a2a00; }
  .buy.gemcan { background: var(--gem); color: #003449; }
  .buy:active.can, .buy:active.gemcan { transform: scale(0.96); }
  #toast { position: absolute; left: 50%; top: 18%; transform: translate(-50%, 0); background: rgba(20,15,30,0.92); border: 2px solid var(--gold); border-radius: 16px; padding: 14px 18px; text-align: center; display: none; z-index: 5; min-width: 220px; }
  #toast .big { font-size: 26px; font-weight: 900; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 8px; }
  #toast .big svg { width: 28px; height: 28px; }
  #toast .small { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #toast button { margin-top: 10px; border: 0; border-radius: 12px; padding: 9px 18px; font-weight: 800; background: var(--gold); color: #3a2a00; font-size: 15px; cursor: pointer; }
  #soundBtn { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); display: grid; place-items: center; cursor: pointer; }
  #soundBtn svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f5c542"/><circle cx="12" cy="12" r="6" fill="none" stroke="#c9961b" stroke-width="2"/></svg><span id="gold">0</span></div>
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z" fill="#57d2ff"/><path d="M2 10h20M8 4l4 6 4-6M12 10v11" stroke="#1d8db6" stroke-width="1.4" fill="none"/></svg><span id="gems">0</span></div>
    <div class="pill" id="depthPill"><svg viewBox="0 0 24 24"><path d="M12 3v14M6 11l6 6 6-6" stroke="#f3ead8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke="#a99bbd" stroke-width="2.4" stroke-linecap="round"/></svg><span id="depth">1</span></div>
  </div>
  <div id="stage">
    <canvas id="scene"></canvas>
    <button id="bossBtn"></button>
    <button id="soundBtn" aria-label="Ton"></button>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <div id="tabs">
      <button class="tab on" data-tab="pick"><svg viewBox="0 0 24 24"><path d="M3 9c4-5 13-6 18-2-5-1-9 0-12 3z" fill="#c0c7d2"/><path d="M10 9l9 12" stroke="#a0703a" stroke-width="3" stroke-linecap="round"/></svg><span id="tPick"></span><i class="dot"></i></button>
      <button class="tab" data-tab="dwarf"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5" fill="#f0c9a0"/><path d="M6 8a6 6 0 0 1 12 0z" fill="#e0a83a"/><path d="M8 11c0 6 4 10 4 10s4-4 4-10z" fill="#d8d0c4"/></svg><span id="tDwarf"></span><i class="dot"></i></button>
      <button class="tab" data-tab="gem"><svg viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z" fill="#57d2ff"/></svg><span id="tGem"></span><i class="dot"></i></button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
'use strict';

// ---------- Portal-Anbindung (Platzhalter) ----------
// Beim Einreichen auf ein Portal wird dieses Objekt durch die Portal-Schnittstelle ersetzt.
const Portal = window.ZwergenMinePortal || {
  gameplayStart() {}, gameplayStop() {}, happytime() {},
  showRewardedAd(onReward) { onReward(); },   // freiwillige Werbung gegen Belohnung
};

// ---------- Texte (Deutsch / Englisch) ----------
const DE = (navigator.language || 'de').toLowerCase().startsWith('de');
const T = DE ? {
  pick: 'Hacke', dwarf: 'Zwerge', gem: 'Steine', perTap: 'pro Tipp', perSec: 'pro Sek.',
  pickName: 'Spitzhacke', boss: 'Boss', retry: 'Boss nochmal', welcome: 'Willkommen zurück!', away: 'Deine Zwerge haben gegraben',
  collect: 'Einsammeln', double: '×2 mit Werbung', newLayer: 'Neue Schicht', unlock: 'ab Tiefe', bossWin: 'Boss besiegt!',
  gemPower: 'Zwergenkraft', gemGold: 'Goldgier', gemCrit: 'Glückstreffer', gemOffline: 'Nachtschicht', gemChest: 'Schatzspürer',
  gemPowerE: 'alles Graben', gemGoldE: 'mehr Gold', gemCritE: 'Volltreffer-Chance', gemOfflineE: 'Gold wenn du weg bist', gemChestE: 'Truhen öfter',
  chestGold: 'Schatztruhe!', chestRage: 'Zwergenwut! ×3', milestone: 'Meilenstein: ×2',
} : {
  pick: 'Pickaxe', dwarf: 'Dwarves', gem: 'Gems', perTap: 'per tap', perSec: 'per sec',
  pickName: 'Pickaxe', boss: 'Boss', retry: 'Retry boss', welcome: 'Welcome back!', away: 'Your dwarves kept digging',
  collect: 'Collect', double: '×2 with ad', newLayer: 'New layer', unlock: 'from depth', bossWin: 'Boss defeated!',
  gemPower: 'Dwarf Power', gemGold: 'Gold Greed', gemCrit: 'Lucky Strike', gemOffline: 'Night Shift', gemChest: 'Treasure Sense',
  gemPowerE: 'all digging', gemGoldE: 'more gold', gemCritE: 'critical chance', gemOfflineE: 'gold while away', gemChestE: 'chests more often',
  chestGold: 'Treasure chest!', chestRage: 'Dwarf rage! ×3', milestone: 'Milestone: ×2',
};
const DWARF_NAMES = DE
  ? ['Gräber', 'Steinbeisser', 'Sprengmeister', 'Bohrmeister', 'Dampfbohrer', 'Erzkönig']
  : ['Digger', 'Rockbiter', 'Blaster', 'Drill Master', 'Steam Drill', 'Ore King'];

// ---------- Spielformeln ----------
// FORMELN_START (wird vom Balancing-Test gelesen)
const LAYERS = [
  { rock: '#7a5a3c', dark: '#4d3622', ore: '#b08856', bg: '#2a1f17' },  // Erde
  { rock: '#7d7d86', dark: '#4e4e57', ore: '#c9c9d2', bg: '#1f1f26' },  // Stein
  { rock: '#3e3a40', dark: '#232026', ore: '#111', bg: '#151317' },     // Kohle
  { rock: '#80604a', dark: '#523a2a', ore: '#e07b3c', bg: '#24180f' },  // Kupfer
  { rock: '#6b6f78', dark: '#41444b', ore: '#c76b4a', bg: '#1b1d22' },  // Eisen
  { rock: '#5d6577', dark: '#383f4e', ore: '#e8eef8', bg: '#161a24' },  // Silber
  { rock: '#6e5a3a', dark: '#453720', ore: '#ffd447', bg: '#211a0d' },  // Gold
  { rock: '#3d4e72', dark: '#243150', ore: '#7fe7ff', bg: '#0f1626' },  // Kristall
  { rock: '#5a2f2f', dark: '#341818', ore: '#ff8a3d', bg: '#1f0c0c' },  // Lava
  { rock: '#4a3a6e', dark: '#2a1f45', ore: '#e07bff', bg: '#140d22' },  // Tiefe
];
const DWARVES = [
  { dps: 1,      cost: 12,      unlock: 1,  hat: '#d94f3d' },
  { dps: 7,      cost: 120,     unlock: 4,  hat: '#3d8bd9' },
  { dps: 45,     cost: 1300,    unlock: 11, hat: '#3dbd5a' },
  { dps: 300,    cost: 16000,   unlock: 21, hat: '#e0a83a' },
  { dps: 2200,   cost: 220000,  unlock: 31, hat: '#9b59d9' },
  { dps: 18000,  cost: 3600000, unlock: 45, hat: '#e8e8e8' },
];
const GEM_UPS = [
  { key: 'power',   base: 2,  grow: 1.35, max: 999 },
  { key: 'gold',    base: 2,  grow: 1.35, max: 999 },
  { key: 'crit',    base: 3,  grow: 1.6,  max: 20 },
  { key: 'offline', base: 3,  grow: 1.5,  max: 10 },
  { key: 'chest',   base: 4,  grow: 1.7,  max: 8 },
];
const F = {
  isBoss: (d) => d % 10 === 0,
  layerOf: (d) => Math.floor((d - 1) / 10) % LAYERS.length,
  rockHp: (d) => Math.ceil(8 * Math.pow(1.21, d - 1) * (d % 10 === 0 ? 7 : 1)),
  rockGold: (d, s) => Math.ceil(4 * Math.pow(1.2, d - 1) * (d % 10 === 0 ? 5 : 1) * (1 + 0.25 * s.gu.gold)),
  bossGems: (d) => 1 + Math.floor(d / 20),
  bossTime: 30,
  powerMult: (s) => 1 + 0.2 * s.gu.power,
  pickCost: (L) => Math.ceil(10 * Math.pow(1.19, L)),
  pickDmg: (L, s) => Math.max(1, Math.floor((1 + L) * Math.pow(1.09, L))) * F.powerMult(s),
  milestoneMult: (n) => Math.pow(2, [10, 25, 50, 100, 150, 200].filter(m => n >= m).length),
  dwarfCost: (i, n) => Math.ceil(DWARVES[i].cost * Math.pow(1.15, n)),
  dwarfDps: (i, n, s) => DWARVES[i].dps * n * F.milestoneMult(n) * F.powerMult(s),
  totalDps: (s) => DWARVES.reduce((a, _, i) => a + F.dwarfDps(i, s.dw[i], s), 0),
  critChance: (s) => 0.04 + 0.02 * s.gu.crit,
  critMult: 5,
  gemCost: (k, L) => { const g = GEM_UPS.find(u => u.key === k); return Math.ceil(g.base * Math.pow(g.grow, L)); },
  offlineRate: (s) => 0.25 + 0.075 * s.gu.offline,
  offlineMaxSec: 8 * 3600,
  chestEvery: (s) => Math.max(18, 60 - 5 * s.gu.chest),
};
// FORMELN_ENDE

// ---------- Spielstand ----------
const SAVE_KEY = 'zwergenmine.v1';
function freshState() {
  return { gold: 0, gems: 0, depth: 1, maxDepth: 1, farm: false, pick: 0, dw: DWARVES.map(() => 0),
    gu: { power: 0, gold: 0, crit: 0, offline: 0, chest: 0 }, hp: 0, sound: true, saved: Date.now(), taps: 0 };
}
let S = freshState();
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const f = freshState();
    S = Object.assign(f, d, { gu: Object.assign(f.gu, d.gu || {}), dw: DWARVES.map((_, i) => (d.dw && d.dw[i]) || 0) });
    return d.saved || null;
  } catch (e) { return null; }
}
function save() { S.saved = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- Zahlen schön schreiben ----------
const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  let i = 0; while (n >= 1000 && i < SUFFIX.length - 1) { n /= 1000; i++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + SUFFIX[i];
}

// ---------- Ton ----------
let actx = null;
function beep(f, d, type, v) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.04, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}
const sfx = {
  hit: () => beep(140 + Math.random() * 40, 0.05, 'square', 0.03),
  crit: () => { beep(600, 0.06, 'square', 0.04); beep(900, 0.08, 'triangle', 0.04); },
  brk: () => { beep(90, 0.15, 'sawtooth', 0.05); setTimeout(() => beep(520, 0.08, 'triangle', 0.04), 40); },
  buy: () => { beep(660, 0.06, 'triangle', 0.05); setTimeout(() => beep(990, 0.08, 'triangle', 0.05), 50); },
  boss: () => { [330, 440, 550, 660, 880].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.05), i * 70)); },
  chest: () => { [520, 780, 1040].forEach((f, i) => setTimeout(() => beep(f, 0.1, 'sine', 0.06), i * 60)); },
};

// ---------- Szene ----------
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resize).observe(cv);

let hpMax = 1;
let shake = 0, hitFlash = 0, bossTimer = 0, bossActive = false, rage = 0;
let floats = [], chips = [], coins = [], banner = null, chest = null, chestTimer = 25;
let swingT = 0, rockSeed = 1, layerShown = -1;

function rockCenter() { return { x: CW / 2, y: CH * 0.52, r: Math.min(CW * 0.27, CH * 0.3) * (bossActive ? 1.15 : 1) }; }

function spawnRock() {
  bossActive = F.isBoss(S.depth) && !S.farm;
  hpMax = F.rockHp(S.depth);
  S.hp = hpMax;
  bossTimer = F.bossTime;
  rockSeed = (S.depth * 9301 + 49297) % 233280;
  const L = F.layerOf(S.depth);
  if (L !== layerShown) {
    if (layerShown !== -1) banner = { text: T.newLayer, sub: S.depth, life: 2.2, color: LAYERS[L].ore };
    layerShown = L;
  }
  updateBossBtn();
}

function damage(amount, fromTap, x, y) {
  if (S.hp <= 0) return;
  let crit = false;
  if (fromTap && Math.random() < F.critChance(S)) { amount *= F.critMult; crit = true; }
  S.hp -= amount;
  if (fromTap) {
    shake = Math.min(1, shake + (crit ? 0.6 : 0.25)); hitFlash = 1;
    const c = rockCenter();
    floats.push({ x: (x ?? c.x) + (Math.random() - 0.5) * 30, y: (y ?? c.y) - 20, text: fmt(amount), life: 1, crit });
    const col = LAYERS[F.layerOf(S.depth)];
    for (let i = 0; i < (crit ? 10 : 4); i++) chips.push(chip(x ?? c.x, y ?? c.y, Math.random() < 0.35 ? col.ore : col.rock));
    crit ? sfx.crit() : sfx.hit();
  }
  if (S.hp <= 0) breakRock();
}

function chip(x, y, color) {
  const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
  return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, life: 1, color, size: 2 + Math.random() * 4, rot: Math.random() * 6 };
}

function breakRock() {
  const c = rockCenter();
  const gold = F.rockGold(S.depth, S);
  S.gold += gold;
  for (let i = 0; i < 26; i++) chips.push(chip(c.x + (Math.random() - 0.5) * c.r, c.y + (Math.random() - 0.5) * c.r, LAYERS[F.layerOf(S.depth)][Math.random() < 0.4 ? 'ore' : 'rock']));
  const n = Math.min(10, 3 + Math.floor(Math.log10(gold + 1) * 2));
  for (let i = 0; i < n; i++) coins.push({ x: c.x + (Math.random() - 0.5) * c.r, y: c.y + (Math.random() - 0.5) * c.r * 0.6, t: -i * 0.04, sx: 0, sy: 0 });
  floats.push({ x: c.x, y: c.y - c.r - 10, text: '+' + fmt(gold), life: 1.3, gold: true });
  sfx.brk();
  if (bossActive) {
    const g = F.bossGems(S.depth);
    S.gems += g;
    banner = { text: T.bossWin, sub: '+' + g, gem: true, life: 2.4, color: '#57d2ff' };
    sfx.boss(); Portal.happytime();
    shake = 1;
  }
  if (!S.farm) {
    S.depth++;
    if (S.depth > S.maxDepth) S.maxDepth = S.depth;
  }
  spawnRock();
  refreshPanel(true);
}

function failBoss() {
  S.farm = true;
  S.depth = Math.max(1, S.depth - 1);
  banner = { text: '⏱', sub: '', life: 1.6, color: '#ff6b6b' };
  spawnRock();
}

function retryBoss() {
  if (!S.farm) return;
  S.farm = false;
  S.depth = S.maxDepth;
  spawnRock();
}

// ---------- Eingabe ----------
let lastTap = 0;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (chest && Math.hypot(x - chest.x, y - chest.y) < 40) { openChest(); return; }
  const now = performance.now();
  if (now - lastTap < 40) return;
  lastTap = now;
  S.taps++;
  swingT = 1;
  damage(F.pickDmg(S.pick, S) * (rage > 0 ? 3 : 1), true, x, y);
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault(); const c = rockCenter(); swingT = 1; S.taps++;
    damage(F.pickDmg(S.pick, S) * (rage > 0 ? 3 : 1), true, c.x, c.y);
  }
});

// ---------- Truhe ----------
function spawnChest() {
  const left = Math.random() < 0.5;
  chest = { x: left ? CW * 0.15 : CW * 0.85, y: CH * (0.25 + Math.random() * 0.45), life: 9, bob: 0 };
}
function openChest() {
  if (!chest) return;
  const kind = Math.random() < 0.6 ? 'gold' : 'rage';
  if (kind === 'gold') {
    const amount = Math.max(F.rockGold(S.depth, S) * 6, (F.totalDps(S) + F.pickDmg(S.pick, S) * 3) * 25 * F.rockGold(S.depth, S) / F.rockHp(S.depth));
    S.gold += Math.ceil(amount);
    banner = { text: T.chestGold, sub: '+' + fmt(amount), life: 2, color: '#f5c542', coin: true };
    for (let i = 0; i < 10; i++) coins.push({ x: chest.x, y: chest.y, t: -i * 0.03, sx: 0, sy: 0 });
  } else {
    rage = 15;
    banner = { text: T.chestRage, sub: '15s', life: 2, color: '#ff8a3d' };
  }
  for (let i = 0; i < 16; i++) chips.push(chip(chest.x, chest.y, '#f5c542'));
  sfx.chest();
  chest = null;
  chestTimer = F.chestEvery(S) * (0.7 + Math.random() * 0.6);
  refreshPanel(true);
}

// ---------- Zeichnen ----------
function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function drawRock(t) {
  const c = rockCenter();
  const L = LAYERS[F.layerOf(S.depth)];
  const sx = (Math.random() - 0.5) * shake * 10, sy = (Math.random() - 0.5) * shake * 10;
  const R = rng(rockSeed);
  const pts = [];
  const N = 11;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + R() * 0.2;
    const rr = c.r * (0.82 + R() * 0.22);
    pts.push([c.x + sx + Math.cos(a) * rr, c.y + sy + Math.sin(a) * rr * 0.92]);
  }
  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(c.x, c.y + c.r * 0.95, c.r * 0.9, c.r * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  // Körper
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  const g = ctx.createRadialGradient(c.x - c.r * 0.3, c.y - c.r * 0.4, c.r * 0.1, c.x, c.y, c.r * 1.1);
  g.addColorStop(0, shade(L.rock, 30)); g.addColorStop(1, L.dark);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
  ctx.save(); ctx.clip();
  // Erz-Adern
  for (let i = 0; i < 9; i++) {
    const ox = c.x + sx + (R() - 0.5) * c.r * 1.5, oy = c.y + sy + (R() - 0.5) * c.r * 1.4, s = 4 + R() * 8;
    ctx.fillStyle = L.ore;
    ctx.beginPath(); ctx.moveTo(ox, oy - s); ctx.lineTo(ox + s * 0.8, oy); ctx.lineTo(ox, oy + s * 0.7); ctx.lineTo(ox - s * 0.9, oy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(ox - s * 0.3, oy - s * 0.5, s * 0.25, s * 0.25);
  }
  // Risse je nach Schaden
  const dmg = 1 - Math.max(0, S.hp) / hpMax;
  const cracks = Math.floor(dmg * 7);
  ctx.strokeStyle = 'rgba(10,6,4,0.7)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const CR = rng(rockSeed + 7);
  for (let i = 0; i < cracks; i++) {
    let x = c.x + sx + (CR() - 0.5) * c.r * 0.6, y = c.y + sy + (CR() - 0.5) * c.r * 0.6;
    ctx.beginPath(); ctx.moveTo(x, y);
    const a0 = CR() * Math.PI * 2;
    for (let k = 0; k < 4; k++) { const a = a0 + (CR() - 0.5) * 1.2; x += Math.cos(a) * c.r * 0.22; y += Math.sin(a) * c.r * 0.22; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // Treffer-Aufblitzen
  if (hitFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${hitFlash * 0.18})`; ctx.fillRect(0, 0, CW, CH); }
  ctx.restore();
  // Boss-Gesicht
  if (bossActive) {
    const ex = c.r * 0.28, ey = -c.r * 0.12;
    ctx.fillStyle = '#ffdf6b';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(c.x + sx + s * ex, c.y + sy + ey, c.r * 0.1, c.r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#1a0e08'; ctx.lineWidth = 5;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(c.x + sx + s * ex * 1.6, c.y + sy + ey - c.r * 0.14); ctx.lineTo(c.x + sx + s * ex * 0.5, c.y + sy + ey - c.r * 0.06); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(c.x + sx, c.y + sy + c.r * 0.32, c.r * 0.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  // Lebensbalken
  const bw = Math.min(CW * 0.6, 260), bx = CW / 2 - bw / 2, by = c.y + c.r * 1.12 + 6;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(bx, by, bw, 12, 6); ctx.fill();
  ctx.fillStyle = bossActive ? '#ff6b6b' : '#6fdc7a'; roundRect(bx, by, Math.max(0, S.hp / hpMax) * bw, 12, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fmt(Math.max(0, S.hp)) + ' / ' + fmt(hpMax), CW / 2, by + 6.5);
  if (bossActive) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(bx, by + 16, bw, 6, 3); ctx.fill();
    ctx.fillStyle = bossTimer < 8 ? '#ff6b6b' : '#f5c542'; roundRect(bx, by + 16, (bossTimer / F.bossTime) * bw, 6, 3); ctx.fill();
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) + amt), g = Math.min(255, ((n >> 8) & 255) + amt), b = Math.min(255, (n & 255) + amt);
  return `rgb(${r},${g},${b})`;
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawBackground(t) {
  const L = LAYERS[F.layerOf(S.depth)];
  ctx.fillStyle = L.bg; ctx.fillRect(0, 0, CW, CH);
  // Stollenwände
  const R = rng(F.layerOf(S.depth) * 31 + 3);
  for (let i = 0; i < 26; i++) {
    const x = R() * CW, y = R() * CH, s = 10 + R() * 26;
    ctx.fillStyle = `rgba(255,255,255,${0.02 + R() * 0.03})`;
    ctx.beginPath(); ctx.ellipse(x, y, s, s * 0.6, R() * 3, 0, Math.PI * 2); ctx.fill();
  }
  // Stützbalken
  ctx.fillStyle = '#5a3d22';
  ctx.fillRect(CW * 0.06, 0, 12, CH); ctx.fillRect(CW * 0.94 - 12, 0, 12, CH);
  ctx.fillRect(CW * 0.06, CH * 0.08, CW * 0.88, 12);
  // Laternen
  for (const lx of [CW * 0.06 + 6, CW * 0.94 - 6]) {
    const flick = 0.85 + Math.sin(t * 9 + lx) * 0.08;
    const lg = ctx.createRadialGradient(lx, CH * 0.2, 2, lx, CH * 0.2, 90);
    lg.addColorStop(0, `rgba(255,190,90,${0.35 * flick})`); lg.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = lg; ctx.fillRect(lx - 90, CH * 0.2 - 90, 180, 180);
    ctx.fillStyle = '#ffcf6b'; ctx.beginPath(); ctx.arc(lx, CH * 0.2, 5, 0, Math.PI * 2); ctx.fill();
  }
  // Tiefen-Anzeige als Lineal rechts
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.font = '700 11px system-ui, sans-serif'; ctx.textAlign = 'right';
}

function drawDwarf(x, y, s, hat, phase, flip) {
  ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
  // Beine
  ctx.fillStyle = '#3b2b20'; ctx.fillRect(-7, 10, 6, 8); ctx.fillRect(2, 10, 6, 8);
  // Körper
  ctx.fillStyle = '#6a4a8a'; roundRect(-10, -4, 20, 16, 5); ctx.fill();
  // Kopf
  ctx.fillStyle = '#f0c9a0'; ctx.beginPath(); ctx.arc(0, -10, 8, 0, Math.PI * 2); ctx.fill();
  // Bart
  ctx.fillStyle = '#d8cfc2'; ctx.beginPath(); ctx.moveTo(-8, -9); ctx.quadraticCurveTo(0, 12, 8, -9); ctx.closePath(); ctx.fill();
  // Nase
  ctx.fillStyle = '#e0a07a'; ctx.beginPath(); ctx.arc(2, -9, 2.6, 0, Math.PI * 2); ctx.fill();
  // Auge
  ctx.fillStyle = '#222'; ctx.fillRect(3, -14, 2, 2);
  // Helm
  ctx.fillStyle = hat; ctx.beginPath(); ctx.arc(0, -13, 8.5, Math.PI, 0); ctx.fill(); ctx.fillRect(-10, -14, 20, 3);
  ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(5, -17, 2.2, 0, Math.PI * 2); ctx.fill();
  // Hacke (schwingt)
  const a = -1.2 + Math.max(0, Math.sin(phase)) * 1.9;
  ctx.save(); ctx.translate(8, 0); ctx.rotate(a);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-1.5, -16, 3, 18);
  ctx.fillStyle = '#c7ccd6'; ctx.beginPath(); ctx.moveTo(-9, -16); ctx.quadraticCurveTo(0, -22, 10, -15); ctx.quadraticCurveTo(0, -18, -9, -16); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawDwarves(t) {
  const c = rockCenter();
  const owned = [];
  DWARVES.forEach((d, i) => { if (S.dw[i] > 0) owned.push(i); });
  const spots = [];
  owned.forEach((i) => { const n = Math.min(3, Math.ceil(S.dw[i] / 10)); for (let k = 0; k < n; k++) spots.push(i); });
  const show = spots.slice(0, 10);
  show.forEach((type, idx) => {
    const side = idx % 2 === 0 ? -1 : 1;
    const row = Math.floor(idx / 2);
    const x = c.x + side * (c.r + 18 + row * 10);
    const y = c.y + c.r * 0.55 - row * 20;
    const speed = 5 + type * 0.6;
    drawDwarf(x, y, 1.25 - row * 0.05, DWARVES[type].hat, t * speed + idx * 1.3, side > 0);
  });
}

function drawPlayerPick() {
  if (swingT <= 0) return;
  const c = rockCenter();
  ctx.save(); ctx.translate(c.x + c.r * 0.55, c.y - c.r * 0.55);
  ctx.rotate(-0.9 + (1 - swingT) * 1.4);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-3, -4, 6, 46);
  ctx.fillStyle = '#d6dbe4'; ctx.beginPath(); ctx.moveTo(-22, -2); ctx.quadraticCurveTo(0, -16, 24, 0); ctx.quadraticCurveTo(0, -6, -22, -2); ctx.fill();
  ctx.restore();
}

function drawChest(t) {
  if (!chest) return;
  const y = chest.y + Math.sin(t * 4) * 6;
  ctx.save(); ctx.translate(chest.x, y);
  const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
  glow.addColorStop(0, 'rgba(255,215,90,0.55)'); glow.addColorStop(1, 'rgba(255,215,90,0)');
  ctx.fillStyle = glow; ctx.fillRect(-44, -44, 88, 88);
  ctx.fillStyle = '#7a4a1e'; roundRect(-18, -6, 36, 22, 4); ctx.fill();
  ctx.fillStyle = '#9a6230'; ctx.beginPath(); ctx.moveTo(-18, -6); ctx.quadraticCurveTo(0, -24, 18, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f5c542'; ctx.fillRect(-18, -7, 36, 4); ctx.fillRect(-3, -6, 6, 12);
  ctx.restore();
  if (chest.life < 3) { ctx.globalAlpha = 1; }
}

function drawFx(dt) {
  for (const p of chips) {
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // Münzen fliegen zur Gold-Anzeige
  for (const m of coins) {
    if (m.t < 0) continue;
    const k = Math.min(1, m.t / 0.7), e = k * k;
    if (!m.sx) { m.sx = m.x; m.sy = m.y; }
    const tx = 40, ty = -20;
    const x = m.sx + (tx - m.sx) * e, y = m.sy + (ty - m.sy) * e - Math.sin(k * Math.PI) * 60;
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c9961b'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.font = `900 ${f.crit ? 30 : f.gold ? 24 : 18}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.crit ? '#ff8a3d' : f.gold ? '#f5c542' : '#fff'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (banner) {
    const a = Math.min(1, banner.life * 1.5);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(CW / 2 - 140, CH * 0.06, 280, 62, 14); ctx.fill();
    ctx.fillStyle = banner.color; ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(banner.text, CW / 2, CH * 0.06 + 22);
    ctx.fillStyle = '#fff'; ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillText(String(banner.sub), CW / 2, CH * 0.06 + 46);
    ctx.globalAlpha = 1;
  }
  if (rage > 0) {
    ctx.fillStyle = `rgba(255,120,40,${0.08 + Math.sin(performance.now() / 120) * 0.04})`; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#ff8a3d'; ctx.font = '900 14px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('×3  ' + Math.ceil(rage) + 's', 14, CH - 16);
  }
}

const listEl = document.getElementById('list');
let tab = 'pick';
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  buildPanel();
}));
document.getElementById('tPick').textContent = T.pick;
document.getElementById('tDwarf').textContent = T.dwarf;
document.getElementById('tGem').textContent = T.gem;

const COIN_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f5c542" stroke="#c9961b" stroke-width="2"/></svg>';
const GEM_SVG = '<svg viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z" fill="#57d2ff" stroke="#1d8db6" stroke-width="1.4"/></svg>';

function iconCanvas(draw) {
  const c = document.createElement('canvas'); c.width = 80; c.height = 80;
  const g = c.getContext('2d'); g.scale(2, 2); draw(g); return c;
}
function pickIcon(g) {
  g.translate(20, 22); g.rotate(-0.6);
  g.fillStyle = '#8a5a2b'; g.fillRect(-2, -4, 4, 22);
  g.fillStyle = '#d6dbe4'; g.beginPath(); g.moveTo(-14, -4); g.quadraticCurveTo(0, -14, 15, -3); g.quadraticCurveTo(0, -8, -14, -4); g.fill();
}
function dwarfIcon(i) {
  return (g) => {
    g.translate(20, 26);
    g.fillStyle = '#6a4a8a'; g.fillRect(-9, -2, 18, 12);
    g.fillStyle = '#f0c9a0'; g.beginPath(); g.arc(0, -8, 7, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#d8cfc2'; g.beginPath(); g.moveTo(-7, -7); g.quadraticCurveTo(0, 12, 7, -7); g.closePath(); g.fill();
    g.fillStyle = DWARVES[i].hat; g.beginPath(); g.arc(0, -11, 7.5, Math.PI, 0); g.fill(); g.fillRect(-9, -12, 18, 3);
    g.fillStyle = '#ffe9a0'; g.beginPath(); g.arc(4, -15, 2, 0, Math.PI * 2); g.fill();
  };
}
const GEM_ICON_COLORS = { power: '#ff8a3d', gold: '#f5c542', crit: '#ff6b6b', offline: '#7f8cff', chest: '#6fdc7a' };
function gemIcon(key) {
  return (g) => {
    g.translate(20, 20);
    g.fillStyle = GEM_ICON_COLORS[key];
    g.beginPath(); g.moveTo(-10, -8); g.lineTo(10, -8); g.lineTo(15, -1); g.lineTo(0, 15); g.lineTo(-15, -1); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.4)'; g.beginPath(); g.moveTo(-10, -8); g.lineTo(0, -1); g.lineTo(-15, -1); g.closePath(); g.fill();
  };
}

let rows = [];
function buildPanel() {
  listEl.innerHTML = ''; rows = [];
  if (tab === 'pick') {
    rows.push(makeRow({ icon: iconCanvas(pickIcon), kind: 'pick' }));
  } else if (tab === 'dwarf') {
    DWARVES.forEach((d, i) => rows.push(makeRow({ icon: iconCanvas(dwarfIcon(i)), kind: 'dwarf', i })));
  } else {
    GEM_UPS.forEach((u) => rows.push(makeRow({ icon: iconCanvas(gemIcon(u.key)), kind: 'gem', key: u.key })));
  }
  refreshPanel(true);
}
function makeRow(r) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = '<div class="ico"></div><div class="info"><div class="name"><span class="nm"></span><span class="lvl"></span></div><div class="eff"></div><div class="bar"><i></i></div></div><button class="buy"></button>';
  el.querySelector('.ico').appendChild(r.icon);
  el.querySelector('.buy').addEventListener('click', () => buy(r));
  listEl.appendChild(el);
  r.el = el; r.nm = el.querySelector('.nm'); r.lvl = el.querySelector('.lvl'); r.eff = el.querySelector('.eff'); r.btn = el.querySelector('.buy'); r.bar = el.querySelector('.bar'); r.barI = el.querySelector('.bar i');
  r.last = '';
  return r;
}
function rowData(r) {
  if (r.kind === 'pick') {
    const now = F.pickDmg(S.pick, S), next = F.pickDmg(S.pick + 1, S);
    return { name: T.pickName, lvl: 'Lv ' + S.pick, eff: `<b>${fmt(now)}</b> ${T.perTap} → ${fmt(next)}`, cost: F.pickCost(S.pick), cur: 'gold', locked: false };
  }
  if (r.kind === 'dwarf') {
    const d = DWARVES[r.i], n = S.dw[r.i];
    if (S.maxDepth < d.unlock) return { name: DWARF_NAMES[r.i], lvl: '', eff: `${T.unlock} ${d.unlock}`, cost: d.cost, cur: 'gold', locked: true };
    const ms = [10, 25, 50, 100, 150, 200].find(m => n < m) || null;
    const prev = [0, 10, 25, 50, 100, 150, 200].filter(m => n >= m).pop();
    return { name: DWARF_NAMES[r.i], lvl: '×' + n, eff: `<b>${fmt(F.dwarfDps(r.i, n, S))}</b> ${T.perSec} (+${fmt(F.dwarfDps(r.i, n + 1, S) - F.dwarfDps(r.i, n, S))})`,
      cost: F.dwarfCost(r.i, n), cur: 'gold', locked: false, bar: ms ? (n - prev) / (ms - prev) : 1 };
  }
  const L = S.gu[r.key], g = GEM_UPS.find(u => u.key === r.key);
  const names = { power: T.gemPower, gold: T.gemGold, crit: T.gemCrit, offline: T.gemOffline, chest: T.gemChest };
  const effs = {
    power: `<b>+${Math.round(L * 20)}%</b> ${T.gemPowerE}`, gold: `<b>+${Math.round(L * 25)}%</b> ${T.gemGoldE}`,
    crit: `<b>${Math.round(F.critChance(S) * 100)}%</b> ${T.gemCritE}`, offline: `<b>${Math.round(F.offlineRate(S) * 100)}%</b> ${T.gemOfflineE}`,
    chest: `<b>${Math.round(F.chestEvery(S))}s</b> ${T.gemChestE}`,
  };
  const maxed = L >= g.max;
  return { name: names[r.key], lvl: 'Lv ' + L, eff: effs[r.key], cost: maxed ? Infinity : F.gemCost(r.key, L), cur: 'gem', locked: false, maxed };
}
function refreshPanel(force) {
  for (const r of rows) {
    const d = rowData(r);
    const have = d.cur === 'gold' ? S.gold : S.gems;
    const can = !d.locked && have >= d.cost;
    const key = [d.name, d.lvl, d.eff, d.cost, can, d.locked, d.bar].join('|');
    if (!force && key === r.last) continue;
    r.last = key;
    r.nm.textContent = d.name; r.lvl.textContent = d.lvl; r.eff.innerHTML = d.eff;
    r.el.classList.toggle('locked', d.locked);
    r.btn.innerHTML = d.maxed ? 'MAX' : (d.cur === 'gold' ? COIN_SVG : GEM_SVG) + fmt(d.cost);
    r.btn.className = 'buy' + (can ? (d.cur === 'gold' ? ' can' : ' gemcan') : '');
    r.bar.style.display = d.bar == null ? 'none' : 'block';
    if (d.bar != null) r.barI.style.width = Math.round(d.bar * 100) + '%';
  }
  updateTabDots();
}
function updateTabDots() {
  const canPick = S.gold >= F.pickCost(S.pick);
  const canDwarf = DWARVES.some((d, i) => S.maxDepth >= d.unlock && S.gold >= F.dwarfCost(i, S.dw[i]));
  const canGem = GEM_UPS.some(u => S.gu[u.key] < u.max && S.gems >= F.gemCost(u.key, S.gu[u.key]));
  const dots = { pick: canPick, dwarf: canDwarf, gem: canGem };
  document.querySelectorAll('.tab').forEach(b => b.querySelector('.dot').classList.toggle('show', dots[b.dataset.tab] && b.dataset.tab !== tab));
}
function buy(r) {
  const d = rowData(r);
  if (d.locked || d.maxed) return;
  if (d.cur === 'gold') { if (S.gold < d.cost) return; S.gold -= d.cost; }
  else { if (S.gems < d.cost) return; S.gems -= d.cost; }
  if (r.kind === 'pick') S.pick++;
  else if (r.kind === 'dwarf') {
    const before = F.milestoneMult(S.dw[r.i]);
    S.dw[r.i]++;
    if (F.milestoneMult(S.dw[r.i]) > before) banner = { text: DWARF_NAMES[r.i], sub: T.milestone, life: 2, color: DWARVES[r.i].hat };
  } else S.gu[r.key]++;
  sfx.buy();
  refreshPanel(true);
  save();
}

// ---------- HUD ----------
const goldEl = document.getElementById('gold'), gemsEl = document.getElementById('gems'), depthEl = document.getElementById('depth');
const bossBtn = document.getElementById('bossBtn');
bossBtn.addEventListener('click', () => { retryBoss(); });
function updateBossBtn() {
  bossBtn.style.display = S.farm ? 'block' : 'none';
  bossBtn.textContent = '⚔ ' + T.retry + ' (' + S.maxDepth + ')';
}
const soundBtn = document.getElementById('soundBtn');
function drawSoundIcon() {
  soundBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f3ead8"/>' +
    (S.sound ? '<path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13" stroke="#f3ead8" stroke-width="2" fill="none" stroke-linecap="round"/>'
             : '<path d="M16 9l5 6M21 9l-5 6" stroke="#f3ead8" stroke-width="2" stroke-linecap="round"/>') + '</svg>';
}
soundBtn.addEventListener('click', (e) => { e.stopPropagation(); S.sound = !S.sound; drawSoundIcon(); save(); });

// ---------- Willkommen zurück (Offline-Gold) ----------
const toast = document.getElementById('toast');
function offlineReward(since) {
  if (!since) return;
  const sec = Math.min(F.offlineMaxSec, (Date.now() - since) / 1000);
  const dps = F.totalDps(S);
  if (sec < 60 || dps <= 0) return;
  const perHp = F.rockGold(S.depth, S) / F.rockHp(S.depth);
  const gold = Math.ceil(dps * sec * perHp * F.offlineRate(S));
  if (gold <= 0) return;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  toast.innerHTML = `<div style="font-weight:800">${T.welcome}</div><div class="small">${T.away} ${h ? h + 'h ' : ''}${m}min</div>
    <div class="big">${COIN_SVG}+${fmt(gold)}</div><button id="tCollect">${T.collect}</button>
    <div><button id="tDouble" style="background:#57d2ff;color:#003449;margin-top:6px">${T.double}</button></div>`;
  toast.style.display = 'block';
  const done = (mult) => { S.gold += gold * mult; toast.style.display = 'none'; for (let i = 0; i < 10; i++) coins.push({ x: CW / 2, y: CH * 0.3, t: -i * 0.04, sx: 0, sy: 0 }); refreshPanel(true); save(); };
  document.getElementById('tCollect').onclick = () => done(1);
  document.getElementById('tDouble').onclick = () => Portal.showRewardedAd(() => done(2));
}

// ---------- Schleife ----------
let last = performance.now(), t = 0, saveTimer = 0, panelTimer = 0, paused = false;
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); paused = true; Portal.gameplayStop(); } else { paused = false; last = performance.now(); Portal.gameplayStart(); } });
window.addEventListener('pagehide', save);

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;

  // Zwerge graben
  const dps = F.totalDps(S);
  if (dps > 0 && S.hp > 0) damage(dps * dt * (rage > 0 ? 1 : 1), false);
  if (bossActive) { bossTimer -= dt; if (bossTimer <= 0) failBoss(); }
  if (rage > 0) rage -= dt;

  // Truhe
  if (chest) { chest.life -= dt; if (chest.life <= 0) { chest = null; chestTimer = F.chestEvery(S); } }
  else { chestTimer -= dt; if (chestTimer <= 0) spawnChest(); }

  // Effekte
  shake = Math.max(0, shake - dt * 4); hitFlash = Math.max(0, hitFlash - dt * 6); swingT = Math.max(0, swingT - dt * 7);
  for (const p of chips) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += 0.2; p.life -= dt * 1.4; }
  chips = chips.filter(p => p.life > 0 && p.y < CH + 20);
  if (chips.length > 220) chips.splice(0, chips.length - 220);
  for (const f of floats) { f.y -= 40 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  if (floats.length > 40) floats.splice(0, floats.length - 40);
  for (const m of coins) m.t += dt;
  coins = coins.filter(m => m.t < 0.7);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  // Zeichnen
  drawBackground(t);
  drawDwarves(t);
  drawRock(t);
  drawPlayerPick();
  drawChest(t);
  drawFx(dt);

  // HUD
  goldEl.textContent = fmt(S.gold); gemsEl.textContent = fmt(S.gems); depthEl.textContent = S.depth;
  panelTimer -= dt; if (panelTimer <= 0) { panelTimer = 0.25; refreshPanel(false); }
  saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 5; save(); }
}

// ---------- Start ----------
const since = load();
drawSoundIcon();
layerShown = F.layerOf(S.depth);
spawnRock();
if (S.hp <= 0) S.hp = hpMax;
buildPanel();
updateBossBtn();
resize();
setTimeout(() => offlineReward(since), 300);
Portal.gameplayStart();
requestAnimationFrame(frame);

// Für Tests von aussen (Playwright) erreichbar
window.__mine = { get S() { return S; }, F, DWARVES, tap: () => { const c = rockCenter(); damage(F.pickDmg(S.pick, S), true, c.x, c.y); }, spawnChest, openChest, get chest() { return chest; }, reset: () => { S = freshState(); spawnRock(); buildPanel(); } };
</script>
</body>
</html>
