<!doctype html>

<meta charset="utf-8">

<meta name="description" content="Zwergen-Mine – grabe immer tiefer, heuere Zwerge an und finde Schätze.">
<title>Zwergen-Mine</title>
<style>
  :root {
    --bg: #15111c; --panel: #221b2d; --card: #2e2540; --card-hi: #3a2f52;
    --text: #f3ead8; --muted: #a99bbd; --gold: #f5c542; --gem: #57d2ff; --ok: #6fdc7a; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
  #hud { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; background: linear-gradient(#1d1726, #15111c); z-index: 2; }
  .pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .pill svg { width: 20px; height: 20px; flex: none; }
  #gold { color: var(--gold); }
  #gems { color: var(--gem); }
  #depthPill { margin-left: auto; cursor: pointer; }
  #best { font-size: 12px; color: var(--muted); font-weight: 700; }
  #best:empty { display: none; }
  .runs { display: grid; grid-template-columns: auto auto auto auto; column-gap: 14px; text-align: left; font-size: 13px; margin-top: 10px; max-height: 200px; overflow-y: auto; white-space: nowrap; }
  .runs span { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .runs .cur { color: var(--gold); font-weight: 800; }
  .runs .note { grid-column: 1 / -1; white-space: normal; color: var(--muted); border: 0; }
  #dps { font-size: 12px; color: var(--muted); font-weight: 600; }
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #bossBtn { position: absolute; left: 12px; top: 12px; display: none; background: #8b2d2d; color: #fff; border: 0; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 15px; box-shadow: 0 0 0 0 rgba(255,107,107,0.7); animation: pulse 1.4s infinite; cursor: pointer; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,107,0.6); } 70% { box-shadow: 0 0 0 12px rgba(255,107,107,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); } }
  #panel { flex: 0 0 auto; background: var(--panel); border-radius: 18px 18px 0 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); z-index: 2; }
  #tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 2px; border-radius: 12px; background: transparent; color: var(--muted); border: 0; font-weight: 700; font-size: 13px; cursor: pointer; position: relative; }
  .tab svg { width: 20px; height: 20px; flex: none; }
  .tab.on { background: var(--card); color: var(--text); }
  .tab .dot { position: absolute; top: 5px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: none; }
  .tab .dot.show { display: block; }
  #list { display: flex; flex-direction: column; gap: 6px; height: 34vh; max-height: 300px; min-height: 170px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }
  .card { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 8px 8px 8px 10px; }
  .card.locked { opacity: 0.45; }
  .card.done { opacity: 0.6; }
  .card.prest { background: linear-gradient(90deg, #3a2a5a, #2e2540); border: 1px solid rgba(199,125,255,0.4); }
  .buy.prestcan { background: #c77dff; color: #2a0a40; }
  .buy.rew { background: rgba(87,210,255,0.15); color: var(--gem); }
  .buy.ok { background: rgba(111,220,122,0.15); color: var(--ok); }
  #skills { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; pointer-events: none; }
  #beerBtn { margin-left: auto; }
  .skill { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 24px; display: none; place-items: center; cursor: pointer; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: auto; }
  .skill.show { display: grid; }
  .skill.ready { background: #e07b3c; box-shadow: 0 0 0 0 rgba(255,138,61,0.7); animation: pulse 1.6s infinite; }
  .skill.active { background: #b8860b; box-shadow: 0 0 0 3px #f5c542, 0 0 16px rgba(245,197,66,0.8); }
  .skill.active .cd { display: none; }
  .skill .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,0.75) var(--p, 0%), transparent 0); pointer-events: none; }
  .skill .lbl { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 9px; font-weight: 800; }
  .ico { width: 44px; height: 44px; flex: none; border-radius: 10px; background: rgba(0,0,0,0.25); display: grid; place-items: center; }
  .ico canvas { width: 40px; height: 40px; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 800; font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
  .lvl { color: var(--muted); font-size: 12px; font-weight: 700; }
  .eff { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .eff b { color: var(--ok); font-weight: 700; }
  .bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; }
  .buy { flex: none; min-width: 84px; border: 0; border-radius: 12px; padding: 9px 8px; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #4a3f60; color: var(--muted); cursor: pointer; }
  .buy svg { width: 16px; height: 16px; }
  .buy.can { background: var(--gold); color: #3a2a00; }
  .buy.gemcan { background: var(--gem); color: #003449; }
  .buy:active.can, .buy:active.gemcan { transform: scale(0.96); }
  #toast { position: absolute; left: 50%; top: 18%; transform: translate(-50%, 0); background: rgba(20,15,30,0.92); border: 2px solid var(--gold); border-radius: 16px; padding: 14px 18px; text-align: center; display: none; z-index: 5; min-width: 220px; width: max-content; max-width: min(340px, 88vw); }
  #toast .big { font-size: 26px; font-weight: 900; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 8px; }
  #toast .big svg { width: 28px; height: 28px; }
  #toast .small { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #toast button.ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.18); font-size: 13px; padding: 6px 12px; margin-top: 12px; }
  #toast button { margin-top: 10px; border: 0; border-radius: 12px; padding: 9px 18px; font-weight: 800; background: var(--gold); color: #3a2a00; font-size: 15px; cursor: pointer; }
  #tip { position: absolute; left: 0; top: 14px; z-index: 4; display: none; pointer-events: none; width: max-content; max-width: min(280px, calc(100% - 110px));
    background: #fff7e0; color: #2a1d05; border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; line-height: 1.3; box-shadow: 0 6px 18px rgba(0,0,0,0.45); animation: tipIn 0.25s ease-out; }
  #tip.low { max-width: min(340px, calc(100% - 24px)); }
  #tip::after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff7e0; }
  #tip button { pointer-events: auto; margin-left: 8px; border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 800; background: #2a1d05; color: #fff7e0; cursor: pointer; }
  @keyframes tipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tab.hint { color: var(--text); animation: glow 1.2s infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px rgba(245,197,66,0.95); } 50% { box-shadow: 0 0 0 5px rgba(245,197,66,0.2); } }
  .card.stuck { background: linear-gradient(90deg, #4a1c22, #2e2540); border: 1px solid rgba(255,107,107,0.55); }
  .buy.stuckbtn { background: #ff6b6b; color: #3a0a0a; }
  .card.pop { animation: pop 0.3s ease-out; }
  @keyframes pop { 40% { transform: scale(1.03); box-shadow: 0 0 0 2px rgba(245,197,66,0.8); } }
  .spark { position: fixed; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; pointer-events: none; z-index: 9; animation: spark 0.55s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }
  #soundBtn { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); display: grid; place-items: center; cursor: pointer; }
  #soundBtn svg { width: 22px; height: 22px; }
</style>

const ROMAN = ['', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
function ringName(r) { return ROMAN[r] || String(r + 1); }
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1).length === 3 ? hex.slice(1).replace(/./g, (c) => c + c) : hex.slice(1), 16);
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
function hslToHex(h, s, l) {
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return '#' + [f(0), f(8), f(4)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
const layerCache = {};
function layerAt(d) {
  const i = F.layerOf(d), r = F.ringOf(d), key = i + ':' + r;
  if (layerCache[key]) return layerCache[key];
  const base = LAYERS[i];
  let L;
  if (r === 0) L = Object.assign({ glow: false }, base);
  else {
    const shift = (r * 137.5) % 360;
    const tint = (hex, dl, ds, minL = 0) => { const [h, s, l] = hexToHsl(hex); return hslToHex((h + shift) % 360, Math.min(1, s * 1.1 + ds), Math.min(0.9, Math.max(minL, l + dl))); };
    L = { rock: tint(base.rock, 0.02, 0.12), dark: tint(base.dark, 0, 0.12), ore: tint(base.ore, 0.08, 0.3, 0.6), bg: tint(base.bg, 0, 0.15), glow: true };
  }
  L.name = T.layers[i] + (r ? ' ' + ringName(r) : '');
  return (layerCache[key] = L);
}

const SAVE_KEY = 'zwergenmine.v1';
function freshState() {
  return { gold: 0, gems: 0, depth: 1, maxDepth: 1, farm: false, pick: 0, dw: DWARVES.map(() => 0),
    gu: { power: 0, gold: 0, crit: 0, offline: 0, chest: 0 }, hp: 0, sound: true, saved: Date.now(), taps: 0,
    up: {}, goals: {}, heir: 0, st: { bosses: 0, chests: 0, prest: 0, time: 0 }, cdDyn: 0, cdBeer: 0,
    best: 1, recBase: 0, runs: [], runTime: 0, lastMaxAt: 0, tips: {} };
}
let S = freshState();
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const f = freshState();
    S = Object.assign(f, d, { gu: Object.assign(f.gu, d.gu || {}), dw: DWARVES.map((_, i) => (d.dw && d.dw[i]) || 0), up: Object.assign({}, d.up || {}), goals: Object.assign({}, d.goals || {}), st: Object.assign(f.st, d.st || {}) });
    if (!d.st) S.st.bosses = Math.floor(((d.maxDepth || 1) - 1) / 10);   // Spielstand von vor den Zielen
    S.best = Math.max(d.best || 1, S.maxDepth || 1);                       // Spielstand von vor den Rekorden
    if (d.recBase == null) S.recBase = S.best;
    if (!Array.isArray(S.runs)) S.runs = [];
    if (d.lastMaxAt == null) S.lastMaxAt = S.runTime;                     // Spielstand von vor den Tipps
    if (!S.tips || typeof S.tips !== 'object') S.tips = {};
    return d.saved || null;
  } catch (e) { return null; }
}
function save() { S.saved = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  if (n >= 1e51) return n.toExponential(2).replace('+', '');
  let i = 0; while (n >= 1000 && i < SUFFIX.length - 1) { n /= 1000; i++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + SUFFIX[i];
}

  if (!S.sound || !hasFocus) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.04, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

let hpMax = 1;

const CONFETTI = ['#f5c542', '#57d2ff', '#ff6b6b', '#6fdc7a', '#c77dff'];
let floats = [], chips = [], coins = [], banner = null, chest = null, chestTimer = 25;
const bannerQ = [];
// Meldungen nacheinander zeigen statt sich gegenseitig zu überschreiben
function showBanner(b) {
  if (banner && banner.life > 0.9) { bannerQ.push(b); if (bannerQ.length > 4) bannerQ.shift(); }
  else banner = b;
}
let swingT = 0, rockSeed = 1, layerShown = -1, beer = 0;

function rockCenter() { return { x: CW / 2, y: CH * 0.52, r: Math.min(CW * 0.27, CH * 0.3) * (bossActive ? 1.15 : 1) }; }

function spawnRock() {
  bossActive = F.isBoss(S.depth) && !S.farm;
  hpMax = F.rockHp(S.depth);
  S.hp = hpMax;
  bossTimer = F.bossTime(S.depth, S);
  rockSeed = (S.depth * 9301 + 49297) % 233280;
  const LK = Math.floor((S.depth - 1) / 10);
  if (LK !== layerShown) {
    if (layerShown !== -1) { const ly = layerAt(S.depth); showBanner({ text: T.newLayer, sub: ly.name + ' · ' + S.depth, life: 2.4, color: ly.ore }); }
    layerShown = LK;
  }
  if (bossActive && F.isBigBoss(S.depth)) showBanner({ text: T.bigBoss, sub: '💎 ×' + F.bossGems(S.depth, S), life: 2.4, color: '#ff6b6b' });
  if (bossActive) { bossFlash = 1; lastTick = 0; sfx.bossIn(); }
  updateBossBtn();
}

function damage(amount, fromTap, x, y) {
  if (S.hp <= 0) return;
  let crit = false;
  if (fromTap && Math.random() < F.critChance(S)) { amount *= F.critMult(S); crit = true; }
  S.hp -= amount;
  if (fromTap) {
    shake = Math.min(1, shake + (crit ? 0.6 : 0.25)); hitFlash = 1;
    const c = rockCenter();
    floats.push({ x: (x ?? c.x) + (Math.random() - 0.5) * 30, y: (y ?? c.y) - 20, text: fmt(amount), life: 1, crit });
    const col = layerAt(S.depth);
    for (let i = 0; i < (crit ? 10 : 4); i++) chips.push(chip(x ?? c.x, y ?? c.y, Math.random() < 0.35 ? col.ore : col.rock));
    crit ? sfx.crit() : sfx.hit();
  }
  if (S.hp <= 0) breakRock();
}

function chip(x, y, color) {
  const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
  return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, life: 1, color, size: 2 + Math.random() * 4, rot: Math.random() * 6 };
}

function breakRock() {
  const c = rockCenter();
  const gold = F.rockGold(S.depth, S);
  S.gold += gold;
  for (let i = 0; i < 26; i++) chips.push(chip(c.x + (Math.random() - 0.5) * c.r, c.y + (Math.random() - 0.5) * c.r, layerAt(S.depth)[Math.random() < 0.4 ? 'ore' : 'rock']));
  const n = Math.min(10, 3 + Math.floor(Math.log10(gold + 1) * 2));
  for (let i = 0; i < n; i++) coins.push({ x: c.x + (Math.random() - 0.5) * c.r, y: c.y + (Math.random() - 0.5) * c.r * 0.6, t: -i * 0.04, sx: 0, sy: 0 });
  floats.push({ x: c.x, y: c.y - c.r - 10, text: '+' + fmt(gold), life: 1.3, gold: true });
  sfx.brk();
  if (bossActive) {
    const g = F.bossGems(S.depth, S);
    S.gems += g; S.st.bosses++;
    showBanner({ text: T.bossWin, sub: '+' + g, gem: true, life: 2.4, color: '#57d2ff' });
    sfx.boss(); Portal.happytime();
    shake = 1;
    for (let i = 0; i < 40; i++) { const p = chip(c.x, c.y - c.r * 0.3, CONFETTI[i % CONFETTI.length]); p.vx *= 1.7; p.vy -= 4; p.size = 5 + Math.random() * 4; chips.push(p); }
  }
  if (!S.farm) {
    S.depth++;
    if (S.depth > S.maxDepth) { S.maxDepth = S.depth; onNewMax(); }
  }
  spawnRock();
  refreshPanel(true);
}

    const r = F.ringOf(S.maxDepth);
    if (r > F.ringOf(S.best)) { const g = F.ringGems(r); S.gems += g; showBanner({ text: T.ringNew.replace('{r}', ringName(r)), sub: T.ringSub + '  💎 +' + g, life: 3.2, color: layerAt(S.maxDepth).ore }); sfx.boss(); layerShown = Math.floor((S.maxDepth - 1) / 10); }   // ersetzt die Schicht-Meldung
    S.best = S.maxDepth;
    if (S.best % 10 === 0) Portal.submitScore(S.best);
  }
}

function failBoss() {
  S.farm = true;
  S.depth = Math.max(1, S.depth - 1);
  showBanner({ text: T.bossFail, sub: T.bossFailSub, life: 2.4, color: '#ff6b6b' });
  sfx.fail();
  spawnRock(); buildPanel();
}

function retryBoss() {
  if (!S.farm) return;
  S.farm = false;
  S.depth = S.maxDepth;
  spawnRock(); buildPanel();
}
// Wie viel vom Boss die Zwerge allein in der Zeit schaffen (1 = genug, mit einer Sekunde Reserve)
function bossPower() { const d = S.maxDepth; return F.totalDps(S) * Math.max(1, F.bossTime(d, S) - 1) / F.rockHp(d); }
// Lohnt sich ein Umzug? Prozent mehr Gold und Graben danach, und ob man gerade feststeckt
function movePct() { return Math.round((F.heirMult({ heir: S.heir + F.heirGain(S) }) / F.heirMult(S) - 1) * 100); }
function moveWorth() { return F.canPrestige(S) && movePct() >= 15 && S.runTime - S.lastMaxAt >= (S.farm ? 60 : 300); }

// ---------- Eingabe ----------
let lastTap = 0;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (chest && Math.hypot(x - chest.x, y - chest.y) < 40) { openChest(); return; }
  const now = performance.now();
  if (now - lastTap < 40) return;
  lastTap = now;
  S.taps++;
  swingT = 1;
  damage(F.pickDmg(S.pick, S) * (rage > 0 ? 3 : 1) * (Math.random() < F.doubleChance(S) ? 2 : 1), true, x, y);
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault(); const c = rockCenter(); swingT = 1; S.taps++;
    damage(F.pickDmg(S.pick, S) * (rage > 0 ? 3 : 1) * (Math.random() < F.doubleChance(S) ? 2 : 1), true, c.x, c.y);
  }
  if (e.code === 'KeyD') useDyn();
  if (e.code === 'KeyB') useBeer();
});

// ---------- Fähigkeiten (Werkstatt-Knöpfe) ----------
const dynBtn = document.getElementById('dynBtn'), beerBtn = document.getElementById('beerBtn');
function useDyn() {
  if (!S.up.dyn || S.cdDyn > 0 || S.hp <= 0) return;
  S.cdDyn = F.dynCd; const c = rockCenter(); swingT = 1; shake = 1;
  for (let i = 0; i < 18; i++) chips.push(chip(c.x + (Math.random() - 0.5) * c.r, c.y + (Math.random() - 0.5) * c.r, '#ff8a3d'));
  damage(F.pickDmg(S.pick, S) * F.dynTaps * (rage > 0 ? 3 : 1), true, c.x, c.y - 10);
  sfx.boss(); updateSkillBtns();
}
function useBeer() {
  if (!S.up.bier || S.cdBeer > 0) return;
  S.cdBeer = F.beerCd; beer = F.beerSec;
  showBanner({ text: T.beerOn, sub: F.beerSec + 's', life: 2, color: '#f5c542' });
  sfx.chest(); updateSkillBtns();
}
dynBtn.addEventListener('click', (e) => { e.stopPropagation(); useDyn(); });
beerBtn.addEventListener('click', (e) => { e.stopPropagation(); useBeer(); });
function updateSkillBtns() {
  for (const [btn, have, cd, tot, name] of [[dynBtn, S.up.dyn, S.cdDyn, F.dynCd, T.dyn], [beerBtn, S.up.bier, S.cdBeer, F.beerCd, T.beer]]) {
    btn.classList.toggle('show', !!have);
    if (!have) continue;
    const on = btn === beerBtn && beer > 0;
    btn.classList.toggle('ready', cd <= 0);
    btn.classList.toggle('active', on);
    btn.querySelector('.cd').style.setProperty('--p', Math.max(0, cd / tot * 100) + '%');
    btn.querySelector('.lbl').textContent = on ? '×3 ' + Math.ceil(beer) + 's' : cd > 0 ? Math.ceil(cd) + 's' : name;
  }
}

// ---------- Truhe ----------
function spawnChest() {
  const left = Math.random() < 0.5;
  chest = { x: left ? CW * 0.15 : CW * 0.85, y: CH * (0.25 + Math.random() * 0.45), life: F.chestLife(S), bob: 0 };
}
function openChest() {
  if (!chest) return;
  const kind = Math.random() < 0.6 ? 'gold' : 'rage';
  S.st.chests++;
  if (kind === 'gold') {
    const amount = Math.max(F.rockGold(S.depth, S) * 6, (F.totalDps(S) + F.pickDmg(S.pick, S) * 3) * 25 * F.rockGold(S.depth, S) / F.rockHp(S.depth)) * F.chestMult(S);
    S.gold += Math.ceil(amount);
    showBanner({ text: T.chestGold, sub: '+' + fmt(amount), life: 2, color: '#f5c542', coin: true });
    for (let i = 0; i < 10; i++) coins.push({ x: chest.x, y: chest.y, t: -i * 0.03, sx: 0, sy: 0 });
  } else {
    rage = 15;
    showBanner({ text: T.chestRage, sub: '15s', life: 2, color: '#ff8a3d' });
  }
  for (let i = 0; i < 16; i++) chips.push(chip(chest.x, chest.y, '#f5c542'));
  sfx.chest();
  chest = null;
  chestTimer = F.chestEvery(S) * (0.7 + Math.random() * 0.6);
  refreshPanel(true);
}

// ---------- Zeichnen ----------
function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function drawRock(t) {
  const c = rockCenter();
  const L = layerAt(S.depth);
  const sx = (Math.random() - 0.5) * shake * 10, sy = (Math.random() - 0.5) * shake * 10;
  const R = rng(rockSeed);
  const pts = [];
  const N = 11;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + R() * 0.2;
    const rr = c.r * (0.82 + R() * 0.22);
    pts.push([c.x + sx + Math.cos(a) * rr, c.y + sy + Math.sin(a) * rr * 0.92]);
  }
  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(c.x, c.y + c.r * 0.95, c.r * 0.9, c.r * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  // Körper
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  const g = ctx.createRadialGradient(c.x - c.r * 0.3, c.y - c.r * 0.4, c.r * 0.1, c.x, c.y, c.r * 1.1);
  g.addColorStop(0, shade(L.rock, 30)); g.addColorStop(1, L.dark);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
  ctx.save(); ctx.clip();
  // Erz-Adern (ab Ring II leuchtend)
  if (L.glow) { ctx.shadowColor = L.ore; ctx.shadowBlur = 10; }
  for (let i = 0; i < 9; i++) {
    const ox = c.x + sx + (R() - 0.5) * c.r * 1.5, oy = c.y + sy + (R() - 0.5) * c.r * 1.4, s = 4 + R() * 8;
    ctx.fillStyle = L.ore;
    ctx.beginPath(); ctx.moveTo(ox, oy - s); ctx.lineTo(ox + s * 0.8, oy); ctx.lineTo(ox, oy + s * 0.7); ctx.lineTo(ox - s * 0.9, oy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(ox - s * 0.3, oy - s * 0.5, s * 0.25, s * 0.25);
  }
  ctx.shadowBlur = 0;
  // Risse je nach Schaden
  const dmg = 1 - Math.max(0, S.hp) / hpMax;
  const cracks = Math.floor(dmg * 7);
  ctx.strokeStyle = 'rgba(10,6,4,0.7)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const CR = rng(rockSeed + 7);
  for (let i = 0; i < cracks; i++) {
    let x = c.x + sx + (CR() - 0.5) * c.r * 0.6, y = c.y + sy + (CR() - 0.5) * c.r * 0.6;
    ctx.beginPath(); ctx.moveTo(x, y);
    const a0 = CR() * Math.PI * 2;
    for (let k = 0; k < 4; k++) { const a = a0 + (CR() - 0.5) * 1.2; x += Math.cos(a) * c.r * 0.22; y += Math.sin(a) * c.r * 0.22; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // Treffer-Aufblitzen
  if (hitFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${hitFlash * 0.18})`; ctx.fillRect(0, 0, CW, CH); }
  ctx.restore();
  // Boss-Gesicht
  if (bossActive) {
    const ex = c.r * 0.28, ey = -c.r * 0.12;
    ctx.fillStyle = '#ffdf6b';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(c.x + sx + s * ex, c.y + sy + ey, c.r * 0.1, c.r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#1a0e08'; ctx.lineWidth = 5;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(c.x + sx + s * ex * 1.6, c.y + sy + ey - c.r * 0.14); ctx.lineTo(c.x + sx + s * ex * 0.5, c.y + sy + ey - c.r * 0.06); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(c.x + sx, c.y + sy + c.r * 0.32, c.r * 0.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  // Lebensbalken
  const bw = Math.min(CW * 0.6, 260), bx = CW / 2 - bw / 2, by = c.y + c.r * 1.12 + 6;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(bx, by, bw, 12, 6); ctx.fill();
  ctx.fillStyle = bossActive ? '#ff6b6b' : '#6fdc7a'; roundRect(bx, by, Math.max(0, S.hp / hpMax) * bw, 12, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fmt(Math.max(0, S.hp)) + ' / ' + fmt(hpMax), CW / 2, by + 6.5);
  if (bossActive) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(bx, by + 16, bw, 6, 3); ctx.fill();
    ctx.fillStyle = bossTimer < 8 ? '#ff6b6b' : '#f5c542'; roundRect(bx, by + 16, (bossTimer / F.bossTime(S.depth, S)) * bw, 6, 3); ctx.fill();
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) + amt), g = Math.min(255, ((n >> 8) & 255) + amt), b = Math.min(255, (n & 255) + amt);
  return `rgb(${r},${g},${b})`;
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawBackground(t) {
  const L = layerAt(S.depth);
  ctx.fillStyle = L.bg; ctx.fillRect(0, 0, CW, CH);
  // Stollenwände
  const R = rng(Math.floor((S.depth - 1) / 10) * 31 + 3);
  for (let i = 0; i < 26; i++) {
    const x = R() * CW, y = R() * CH, s = 10 + R() * 26;
    ctx.fillStyle = `rgba(255,255,255,${0.02 + R() * 0.03})`;
    ctx.beginPath(); ctx.ellipse(x, y, s, s * 0.6, R() * 3, 0, Math.PI * 2); ctx.fill();
  }
  // Stützbalken
  ctx.fillStyle = '#5a3d22';
  ctx.fillRect(CW * 0.06, 0, 12, CH); ctx.fillRect(CW * 0.94 - 12, 0, 12, CH);
  ctx.fillRect(CW * 0.06, CH * 0.08, CW * 0.88, 12);
  // Laternen
  for (const lx of [CW * 0.06 + 6, CW * 0.94 - 6]) {
    const flick = 0.85 + Math.sin(t * 9 + lx) * 0.08;
    const lg = ctx.createRadialGradient(lx, CH * 0.2, 2, lx, CH * 0.2, 90);
    lg.addColorStop(0, `rgba(255,190,90,${0.35 * flick})`); lg.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = lg; ctx.fillRect(lx - 90, CH * 0.2 - 90, 180, 180);
    ctx.fillStyle = '#ffcf6b'; ctx.beginPath(); ctx.arc(lx, CH * 0.2, 5, 0, Math.PI * 2); ctx.fill();
  }
  // Name der Schicht
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '800 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (banner) return;
  ctx.fillText(L.name + ' · ' + T.layer + ' ' + (Math.floor((S.depth - 1) / 10) + 1), CW / 2, CH * 0.08 + 30);
  if (S.heir > 0) { ctx.fillStyle = '#c77dff'; ctx.font = '800 12px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('⚱ ' + S.heir + '  +' + Math.round((F.heirMult(S) - 1) * 100) + '%', CW - 14, CH * 0.08 + 30); }
}

function drawDwarf(x, y, s, hat, phase, flip) {
  ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
  // Beine
  ctx.fillStyle = '#3b2b20'; ctx.fillRect(-7, 10, 6, 8); ctx.fillRect(2, 10, 6, 8);
  // Körper
  ctx.fillStyle = '#6a4a8a'; roundRect(-10, -4, 20, 16, 5); ctx.fill();
  // Kopf
  ctx.fillStyle = '#f0c9a0'; ctx.beginPath(); ctx.arc(0, -10, 8, 0, Math.PI * 2); ctx.fill();
  // Bart
  ctx.fillStyle = '#d8cfc2'; ctx.beginPath(); ctx.moveTo(-8, -9); ctx.quadraticCurveTo(0, 12, 8, -9); ctx.closePath(); ctx.fill();
  // Nase
  ctx.fillStyle = '#e0a07a'; ctx.beginPath(); ctx.arc(2, -9, 2.6, 0, Math.PI * 2); ctx.fill();
  // Auge
  ctx.fillStyle = '#222'; ctx.fillRect(3, -14, 2, 2);
  // Helm
  ctx.fillStyle = hat; ctx.beginPath(); ctx.arc(0, -13, 8.5, Math.PI, 0); ctx.fill(); ctx.fillRect(-10, -14, 20, 3);
  ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(5, -17, 2.2, 0, Math.PI * 2); ctx.fill();
  // Hacke (schwingt)
  const a = -1.2 + Math.max(0, Math.sin(phase)) * 1.9;
  ctx.save(); ctx.translate(8, 0); ctx.rotate(a);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-1.5, -16, 3, 18);
  ctx.fillStyle = '#c7ccd6'; ctx.beginPath(); ctx.moveTo(-9, -16); ctx.quadraticCurveTo(0, -22, 10, -15); ctx.quadraticCurveTo(0, -18, -9, -16); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawDwarves(t) {
  const c = rockCenter();
  const owned = [];
  DWARVES.forEach((d, i) => { if (S.dw[i] > 0) owned.push(i); });
  const spots = [];
  owned.forEach((i) => { const n = Math.min(3, Math.ceil(S.dw[i] / 10)); for (let k = 0; k < n; k++) spots.push(i); });
  const show = spots.slice(0, 10);
  show.forEach((type, idx) => {
    const side = idx % 2 === 0 ? -1 : 1;
    const row = Math.floor(idx / 2);
    const x = c.x + side * (c.r + 18 + row * 10);
    const y = c.y + c.r * 0.55 - row * 20;
    const speed = 5 + type * 0.6;
    drawDwarf(x, y, 1.25 - row * 0.05, DWARVES[type].hat, t * speed + idx * 1.3, side > 0);
  });
}

function drawPlayerPick() {
  if (swingT <= 0) return;
  const c = rockCenter();
  ctx.save(); ctx.translate(c.x + c.r * 0.55, c.y - c.r * 0.55);
  ctx.rotate(-0.9 + (1 - swingT) * 1.4);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-3, -4, 6, 46);
  ctx.fillStyle = '#d6dbe4'; ctx.beginPath(); ctx.moveTo(-22, -2); ctx.quadraticCurveTo(0, -16, 24, 0); ctx.quadraticCurveTo(0, -6, -22, -2); ctx.fill();
  ctx.restore();
}

function drawChest(t) {
  if (!chest) return;
  const y = chest.y + Math.sin(t * 4) * 6;
  ctx.save(); ctx.translate(chest.x, y);
  const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
  glow.addColorStop(0, 'rgba(255,215,90,0.55)'); glow.addColorStop(1, 'rgba(255,215,90,0)');
  ctx.fillStyle = glow; ctx.fillRect(-44, -44, 88, 88);
  ctx.fillStyle = '#7a4a1e'; roundRect(-18, -6, 36, 22, 4); ctx.fill();
  ctx.fillStyle = '#9a6230'; ctx.beginPath(); ctx.moveTo(-18, -6); ctx.quadraticCurveTo(0, -24, 18, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f5c542'; ctx.fillRect(-18, -7, 36, 4); ctx.fillRect(-3, -6, 6, 12);
  ctx.restore();
  if (chest.life < 3) { ctx.globalAlpha = 1; }
}

function drawFx(dt) {
  for (const p of chips) {
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // Münzen fliegen zur Gold-Anzeige
  for (const m of coins) {
    if (m.t < 0) continue;
    const k = Math.min(1, m.t / 0.7), e = k * k;
    if (!m.sx) { m.sx = m.x; m.sy = m.y; }
    const tx = 40, ty = -20;
    const x = m.sx + (tx - m.sx) * e, y = m.sy + (ty - m.sy) * e - Math.sin(k * Math.PI) * 60;
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c9961b'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.font = `900 ${f.crit ? 30 : f.gold ? 24 : 18}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.crit ? '#ff8a3d' : f.gold ? '#f5c542' : '#fff'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (banner && toast.style.display !== 'block') {
    const a = Math.min(1, banner.life * 1.5);
    ctx.globalAlpha = a;
    const by = CH * 0.06 + (S.farm ? 44 : 0); // unter dem Knopf «Boss nochmal»
    ctx.fillStyle = 'rgba(14,10,22,0.82)'; roundRect(CW / 2 - 140, by, 280, 62, 14); ctx.fill();
    ctx.fillStyle = banner.color; ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(banner.text, CW / 2, by + 22);
    ctx.fillStyle = '#fff'; ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillText(String(banner.sub), CW / 2, by + 46);
    ctx.globalAlpha = 1;
  }
  if (bossFlash > 0) { ctx.fillStyle = `rgba(255,50,50,${bossFlash * 0.28})`; ctx.fillRect(0, 0, CW, CH); }
  if (rage > 0) {
    ctx.fillStyle = `rgba(255,120,40,${0.08 + Math.sin(performance.now() / 120) * 0.04})`; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#ff8a3d'; ctx.font = '900 14px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.textBaseline = 'middle'; ctx.fillText('⛏ ×3  ' + Math.ceil(rage) + 's', 14, CH - 100);
  }
}

let rows = [];

    const ups = UPGRADES.slice().sort((a, b) => (S.up[a.key] ? 1 : 0) - (S.up[b.key] ? 1 : 0) || a.unlock - b.unlock);
    ups.forEach((u) => rows.push(makeRow({ icon: iconCanvas(emojiIcon(UP_EMOJI[u.key])), kind: 'up', key: u.key })));
  } else if (tab === 'dwarf') {

  } else if (tab === 'gem') {

  } else {

    rows.push(makeRow({ icon: iconCanvas(emojiIcon('🏆')), kind: 'rec' }));
    const gs = GOALS.slice().sort((a, b) => (S.goals[a.id] ? 1 : 0) - (S.goals[b.id] ? 1 : 0));
    gs.forEach((g) => rows.push(makeRow({ icon: iconCanvas(emojiIcon(GOAL_EMOJI[g.type])), kind: 'goal', g })));

function makeRow(r) {

    return { name: DWARF_NAMES[r.i], lvl: '×' + n, eff: `<b>${fmt(F.dwarfDps(r.i, n, S))}</b> ${T.perSec} (+${fmt(F.dwarfDps(r.i, n + 1, S) - F.dwarfDps(r.i, n, S))})`,

  const effs = {
    power: `<b>+${Math.round(L * 20)}%</b> ${T.gemPowerE}`, gold: `<b>+${Math.round(L * 25)}%</b> ${T.gemGoldE}`,
    crit: `<b>${Math.round(F.critChance(S) * 100)}%</b> ${T.gemCritE}`, offline: `<b>${Math.round(F.offlineRate(S) * 100)}%</b> ${T.gemOfflineE}`,

function refreshPanel(force) {

  const canDwarf = DWARVES.some((d, i) => S.maxDepth >= d.unlock && S.gold >= F.dwarfCost(i, S.dw[i]));
  const canGem = GEM_UPS.some(u => S.gu[u.key] < u.max && S.gems >= F.gemCost(u.key, S.gu[u.key]));

let seenPrest = false;
function buy(r) {
  const d = rowData(r);
  if (r.kind === 'goal') return;
  if (r.kind === 'prest') { newMine(); return; }
  if (r.kind === 'rec') { showRecords(); return; }
  if (r.kind === 'stuck') { retryBoss(); return; }
  if (d.locked || d.maxed || d.done) return;
  if (d.cur === 'gold') { if (S.gold < d.cost) return; S.gold -= d.cost; }
  else { if (S.gems < d.cost) return; S.gems -= d.cost; }
  if (r.kind === 'pick') S.pick++;
  else if (r.kind === 'up') { S.up[r.key] = true; showBanner({ text: T.ups[r.key][0], sub: T.ups[r.key][1], life: 2.2, color: '#f5c542' }); updateSkillBtns(); }

}

  { id: 'boss', at: 'rock', when: () => S.st.prest === 0 && S.st.bosses === 0 && bossActive, done: () => !bossActive },
  { id: 'gem', at: 'gem', when: () => tab !== 'gem' && S.st.prest === 0 && S.gems >= F.gemCost('power', 0) && GEM_UPS.every(u => !S.gu[u.key]), done: () => tab === 'gem' || GEM_UPS.some(u => S.gu[u.key]) },

const stageEl = document.getElementById('stage'), tipEl = document.getElementById('tip');

function updateTip() {

  if (toast.style.display === 'block') return;

  const st = stageEl.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;

const toast = document.getElementById('toast');
function offlineReward(since) {
  if (!since) return;
  const sec = Math.min(F.offlineMaxSec, (Date.now() - since) / 1000);
  const dps = F.totalDps(S);
  if (sec < 60 || dps <= 0) return;
  const perHp = F.rockGold(S.depth, S) / F.rockHp(S.depth);
  const gold = Math.ceil(dps * sec * perHp * F.offlineRate(S));
  if (gold <= 0) return;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  toast.innerHTML = `<div style="font-weight:800">${T.welcome}</div><div class="small">${T.away} ${h ? h + 'h ' : ''}${m}min</div>
    <div class="big">${COIN_SVG}+${fmt(gold)}</div><button id="tCollect">${T.collect}</button>
    <div><button id="tDouble" style="background:#57d2ff;color:#003449;margin-top:6px">${T.double}</button></div>`;
  toast.style.display = 'block';
  const done = (mult) => { S.gold += gold * mult; toast.style.display = 'none'; for (let i = 0; i < 10; i++) coins.push({ x: CW / 2, y: CH * 0.3, t: -i * 0.04, sx: 0, sy: 0 }); refreshPanel(true); save(); };
  document.getElementById('tCollect').onclick = () => done(1);
  document.getElementById('tDouble').onclick = () => Portal.showRewardedAd(() => done(2));
}

let last = performance.now(), t = 0, saveTimer = 0, panelTimer = 0, paused = false;
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); paused = true; Portal.gameplayStop(); } else { paused = false; last = performance.now(); Portal.gameplayStart(); } });
window.addEventListener('pagehide', save);

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;
  S.runTime += dt; S.st.time += dt;

  // Zwerge graben
  const dps = F.totalDps(S) * (beer > 0 ? F.beerMult : 1);
  if (dps > 0 && S.hp > 0) damage(dps * dt, false);
  if (bossActive) {
    bossTimer -= dt;
    const sec = Math.ceil(bossTimer); if (sec !== lastTick) { lastTick = sec; if (sec > 0 && sec <= 5) sfx.tick(); }   // die letzten Sekunden ticken
    if (bossTimer <= 0) failBoss();
  }
  bossFlash = Math.max(0, bossFlash - dt * 2.5);
  if (rage > 0) rage -= dt;
  if (beer > 0) beer -= dt;
  if (S.cdDyn > 0) S.cdDyn -= dt; if (S.cdBeer > 0) S.cdBeer -= dt;
  goalTimer -= dt; if (goalTimer <= 0) {
    goalTimer = 0.5; checkGoals(); updateSkillBtns(); updateTip();
    if (S.farm && bossPower() >= 1) { retryBoss(); showBanner({ text: T.autoRetry, sub: T.autoRetrySub, life: 2.2, color: '#6fdc7a' }); }
  }

  // Truhe
  if (chest) { chest.life -= dt; if (chest.life <= 0) { chest = null; chestTimer = F.chestEvery(S); } }
  else { chestTimer -= dt; if (chestTimer <= 0) spawnChest(); }

  // Effekte
  shake = Math.max(0, shake - dt * 4); hitFlash = Math.max(0, hitFlash - dt * 6); swingT = Math.max(0, swingT - dt * 7);
  for (const p of chips) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += 0.2; p.life -= dt * 1.4; }
  chips = chips.filter(p => p.life > 0 && p.y < CH + 20);
  if (chips.length > 220) chips.splice(0, chips.length - 220);
  for (const f of floats) { f.y -= 40 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  if (floats.length > 40) floats.splice(0, floats.length - 40);
  for (const m of coins) m.t += dt;
  coins = coins.filter(m => m.t < 0.7);
  if (banner && toast.style.display !== 'block') { banner.life -= dt * (bannerQ.length ? 1.6 : 1); if (banner.life <= 0) banner = bannerQ.shift() || null; }

  // Zeichnen
  drawBackground(t);
  drawDwarves(t);
  drawRock(t);
  drawPlayerPick();
  drawChest(t);
  drawFx(dt);

  // HUD
  goldEl.textContent = fmt(S.gold); gemsEl.textContent = fmt(S.gems); depthEl.textContent = S.depth;
  const bt = S.best > S.depth ? '🏆' + S.best : ''; if (bestEl.textContent !== bt) bestEl.textContent = bt;
  panelTimer -= dt; if (panelTimer <= 0) { panelTimer = 0.25; refreshPanel(false); }
  saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 5; save(); }
}

// ---------- Start ----------
const since = load();
drawSoundIcon();
layerShown = Math.floor((S.depth - 1) / 10);
spawnRock();
if (S.hp <= 0) S.hp = hpMax;
buildPanel();
updateBossBtn();
updateSkillBtns();
resize();
setTimeout(() => offlineReward(since), 300);
Portal.gameplayStart();
requestAnimationFrame(frame);

// Für Tests von aussen (Playwright) erreichbar
window.__mine = { get S() { return S; }, F, DWARVES, UPGRADES, GOALS, tap: () => { const c = rockCenter(); damage(F.pickDmg(S.pick, S), true, c.x, c.y); }, spawnChest, openChest, get chest() { return chest; }, useDyn, useBeer, newMine, buildPanel, reset: startOver, jump: (d) => { S.depth = d; S.maxDepth = Math.max(S.maxDepth, d); S.best = Math.max(S.best, S.maxDepth); S.farm = false; spawnRock(); buildPanel(); }, onNewMax, showRecords, layerAt, banners: () => [banner, ...bannerQ].filter(Boolean).map(b => b.text), get focus() { return hasFocus; }, get tip() { return tipNow && tipNow.id; }, failBoss, retryBoss, bossPower, moveWorth, movePct };
</script>
