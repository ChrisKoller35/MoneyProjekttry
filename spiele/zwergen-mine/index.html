<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Zwergen-Mine</title>
<style>
  :root {
    --bg: #15111c; --panel: #221b2d; --card: #2e2540; --card-hi: #3a2f52;
    --text: #f3ead8; --muted: #a99bbd; --gold: #f5c542; --gem: #57d2ff; --ok: #6fdc7a; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; position: relative; }

  .pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .pill svg { width: 20px; height: 20px; flex: none; }
  #gold { color: var(--gold); }
  #gems { color: var(--gem); }
  #depthPill { margin-left: auto; cursor: pointer; }
  #best { font-size: 12px; color: var(--muted); font-weight: 700; }
  #best:empty { display: none; }
  .runs { display: grid; grid-template-columns: auto auto auto auto; column-gap: 14px; text-align: left; font-size: 13px; margin-top: 10px; max-height: 200px; overflow-y: auto; white-space: nowrap; }
  .runs span { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .runs .cur { color: var(--gold); font-weight: 800; }
  .runs .note { grid-column: 1 / -1; white-space: normal; color: var(--muted); border: 0; }
  #dps { font-size: 12px; color: var(--muted); font-weight: 600; }
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #bossBtn { position: absolute; left: 12px; top: 12px; display: none; background: #8b2d2d; color: #fff; border: 0; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 15px; box-shadow: 0 0 0 0 rgba(255,107,107,0.7); animation: pulse 1.4s infinite; cursor: pointer; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,107,0.6); } 70% { box-shadow: 0 0 0 12px rgba(255,107,107,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); } }
  #panel { flex: 0 0 auto; background: var(--panel); border-radius: 18px 18px 0 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); z-index: 2; }
  #tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 2px; border-radius: 12px; background: transparent; color: var(--muted); border: 0; font-weight: 700; font-size: 13px; cursor: pointer; position: relative; }
  .tab svg { width: 20px; height: 20px; flex: none; }
  .tab.on { background: var(--card); color: var(--text); }
  .tab .dot { position: absolute; top: 5px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: none; }
  .tab .dot.show { display: block; }
  #list { display: flex; flex-direction: column; gap: 6px; height: 34vh; max-height: 300px; min-height: 170px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }
  .card { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 8px 8px 8px 10px; }
  .card.locked { opacity: 0.45; }
  .card.done { opacity: 0.6; }
  .card.prest { background: linear-gradient(90deg, #3a2a5a, #2e2540); border: 1px solid rgba(199,125,255,0.4); }
  .buy.prestcan { background: #c77dff; color: #2a0a40; }
  .buy.rew { background: rgba(87,210,255,0.15); color: var(--gem); }
  .buy.ok { background: rgba(111,220,122,0.15); color: var(--ok); }
  #skills { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; pointer-events: none; }
  #beerBtn { margin-left: auto; }
  .skill { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 24px; display: none; place-items: center; cursor: pointer; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: auto; }
  .skill.show { display: grid; }
  .skill.ready { background: #e07b3c; box-shadow: 0 0 0 0 rgba(255,138,61,0.7); animation: pulse 1.6s infinite; }
  .skill.active { background: #b8860b; box-shadow: 0 0 0 3px #f5c542, 0 0 16px rgba(245,197,66,0.8); }
  .skill.active .cd { display: none; }
  .skill .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,0.75) var(--p, 0%), transparent 0); pointer-events: none; }
  .skill .lbl { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 9px; font-weight: 800; }
  .ico { width: 44px; height: 44px; flex: none; border-radius: 10px; background: rgba(0,0,0,0.25); display: grid; place-items: center; }
  .ico canvas { width: 40px; height: 40px; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 800; font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
  .lvl { color: var(--muted); font-size: 12px; font-weight: 700; }
  .eff { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .eff b { color: var(--ok); font-weight: 700; }
  .bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; }
  .buy { flex: none; min-width: 84px; border: 0; border-radius: 12px; padding: 9px 8px; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #4a3f60; color: var(--muted); cursor: pointer; }
  .buy svg { width: 16px; height: 16px; }
  .buy.can { background: var(--gold); color: #3a2a00; }
  .buy.gemcan { background: var(--gem); color: #003449; }
  .buy:active.can, .buy:active.gemcan { transform: scale(0.96); }
  #toast { position: absolute; left: 50%; top: 18%; transform: translate(-50%, 0); background: rgba(20,15,30,0.92); border: 2px solid var(--gold); border-radius: 16px; padding: 14px 18px; text-align: center; display: none; z-index: 5; min-width: 220px; width: max-content; max-width: min(340px, 88vw); }
  #toast .big { font-size: 26px; font-weight: 900; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 8px; }
  #toast .big svg { width: 28px; height: 28px; }
  #toast .small { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #toast button.ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.18); font-size: 13px; padding: 6px 12px; margin-top: 12px; }
  #toast button { margin-top: 10px; border: 0; border-radius: 12px; padding: 9px 18px; font-weight: 800; background: var(--gold); color: #3a2a00; font-size: 15px; cursor: pointer; }
  #tip { position: absolute; left: 0; top: 14px; z-index: 4; display: none; pointer-events: none; width: max-content; max-width: min(280px, calc(100% - 110px));
    background: #fff7e0; color: #2a1d05; border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; line-height: 1.3; box-shadow: 0 6px 18px rgba(0,0,0,0.45); animation: tipIn 0.25s ease-out; }
  #tip.low { max-width: min(340px, calc(100% - 24px)); }
  #tip::after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff7e0; }
  #tip button { pointer-events: auto; margin-left: 8px; border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 800; background: #2a1d05; color: #fff7e0; cursor: pointer; }
  @keyframes tipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tab.hint { color: var(--text); animation: glow 1.2s infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px rgba(245,197,66,0.95); } 50% { box-shadow: 0 0 0 5px rgba(245,197,66,0.2); } }

  .buy.stuckbtn { background: #ff6b6b; color: #3a0a0a; }
  .card.pop { animation: pop 0.3s ease-out; }

  .spark { position: fixed; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; pointer-events: none; z-index: 9; animation: spark 0.55s ease-out forwards; }

  #crownPill { color: #ffd447; cursor: pointer; position: relative; display: none; }

  #toast .bk .i b { color: var(--text); font-size: 15px; display: block; }
  #toast .bk button { margin: 0; padding: 8px 10px; font-size: 13px; flex: none; }
  #toast .bk.soon { opacity: 0.5; }
  #toast .bk.here { border-color: var(--gold); }

  #toast .tw .bar { height: 8px; margin: 8px 0 2px; }
  #toast .tw button { margin-top: 8px; }

  bossGems: (d, s) => (1 + Math.floor(d / 20)) * (d % 50 === 0 ? 3 : 1) * (s && s.up.kugel ? 2 : 1),
  bossTime: (d, s) => (d % 50 === 0 ? 40 : 30) + (s.up.zeit ? 10 : 0),
  heirMult: (s) => 1 + 0.05 * (s.heir || 0),

  dwarfMult: (s) => (s.up.band ? 1.25 : 1) * (s.up.lied ? 1.3 : 1) * (s.up.schicht ? 1.5 : 1),

  milestoneMult: (n) => Math.pow(2, [10, 25, 50, 100, 150, 200].filter(m => n >= m).length),
  dwarfCost: (i, n) => Math.ceil(DWARVES[i].cost * Math.pow(1.15, n)),
  dwarfDps: (i, n, s) => DWARVES[i].dps * n * F.milestoneMult(n) * F.powerMult(s) * F.dwarfMult(s),

  critMult: (s) => s.up.gluck ? 6 : 5,
  doubleChance: (s) => s.up.doppel ? 0.15 : 0,
  gemCost: (k, L) => { const g = GEM_UPS.find(u => u.key === k); return Math.ceil(g.base * Math.pow(g.grow, L)); },
  offlineRate: (s) => 0.25 + 0.075 * s.gu.offline,
  offlineMaxSec: 8 * 3600,

  chestMult: (s) => s.up.magnet ? 2 : 1,

const ROMAN = ['', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
function ringName(r) { return ROMAN[r] || String(r + 1); }
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1).length === 3 ? hex.slice(1).replace(/./g, (c) => c + c) : hex.slice(1), 16);
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
function hslToHex(h, s, l) {
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return '#' + [f(0), f(8), f(4)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
const layerCache = {};
// Letzte Schicht jedes Blocks (Tiefe 141 bis 150): das Herz, leuchtend
const HEARTS = {
  stein:  { rock: '#8a6a2a', dark: '#4a3510', ore: '#fff2a8', bg: '#1a1205' },
  vulkan: { rock: '#8a1f0f', dark: '#4a0a04', ore: '#ffdd55', bg: '#220500' },
  eis:    { rock: '#8cc8f0', dark: '#3a6a9a', ore: '#ffffff', bg: '#06121e' },
  wasser: { rock: '#2a8a9a', dark: '#0a3a4a', ore: '#aaffee', bg: '#021418' },
};
// Farbstich je Block: Farbton, wie stark, mehr Sättigung, heller
const TINT = {
  vulkan: { h: 14,  k: 0.6, ds: 0.18, dl: 0,    bk: 0.7,  bds: 0.25 },
  eis:    { h: 200, k: 0.7, ds: 0.05, dl: 0.12, bk: 0.75, bds: 0.2 },
  wasser: { h: 182, k: 0.6, ds: 0.12, dl: 0.02, bk: 0.75, bds: 0.25 },
};
function layerAt(d) {
  const kind = S.blk || 'stein', heart = d > 140 && d <= F.blockEnd;
  const i = F.layerOf(d), r = heart ? 0 : F.ringOf(d), key = kind + ':' + (heart ? 'h' : i + ':' + r);
  if (layerCache[key]) return layerCache[key];
  const base = LAYERS[i];
  let L;
  if (heart) L = Object.assign({ glow: true }, HEARTS[kind] || HEARTS.stein);
  else if (r === 0) L = Object.assign({ glow: false }, base);
  else {
    const shift = (r * 137.5) % 360;
    const tint = (hex, dl, ds, minL = 0) => { const [h, s, l] = hexToHsl(hex); return hslToHex((h + shift) % 360, Math.min(1, s * 1.1 + ds), Math.min(0.9, Math.max(minL, l + dl))); };
    L = { rock: tint(base.rock, 0.02, 0.12), dark: tint(base.dark, 0, 0.12), ore: tint(base.ore, 0.08, 0.3, 0.6), bg: tint(base.bg, 0, 0.15), glow: true };
  }
  const tn = TINT[kind];
  if (tn && !heart) {   // Vulkan rot, Gletscher eisblau, Grotte türkis
    const mix = (hex, k, ds, dl = 0) => { const [h, s, l] = hexToHsl(hex), dh = ((tn.h - h + 540) % 360) - 180; return hslToHex((h + dh * k + 360) % 360, Math.min(1, Math.max(0, s + ds)), Math.min(0.9, l + dl)); };
    L = { rock: mix(L.rock, tn.k, tn.ds, tn.dl), dark: mix(L.dark, tn.k, tn.ds, tn.dl * 0.5), ore: mix(L.ore, 0.25, 0.1, 0.05), bg: mix(L.bg, tn.bk, tn.bds), glow: L.glow };
  }
  const names = T[kind + 'Layers'] || T.layers;
  L.name = heart ? T.heart[kind] || T.heart.stein : names[i] + (r ? ' ' + ringName(r) : '');
  return (layerCache[key] = L);
}

const SAVE_KEY = 'zwergenmine.v1';
function freshState() {
  return { gold: 0, gems: 0, depth: 1, maxDepth: 1, farm: false, pick: 0, dw: DWARVES.map(() => 0),
    gu: { power: 0, gold: 0, crit: 0, offline: 0, chest: 0 }, hp: 0, sound: true, saved: Date.now(), taps: 0,
    up: {}, goals: {}, heir: 0, st: { bosses: 0, chests: 0, prest: 0, time: 0, moles: 0 }, cdDyn: 0, cdBeer: 0,
    best: 1, recBase: 0, runs: [], runTime: 0, lastMaxAt: 0, tips: {}, finds: {},
    blk: 'stein', blockDone: false, blkBest: 1, towers: [], crowns: 0, crownsAll: 0, unl: {}, shop: {}, special: null, specialT: 0,
    daily: { day: '', goals: [], base: {}, done: {}, bonus: false } };
}
let S = freshState(), migrated = 0;
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const f = freshState();
    S = Object.assign(f, d, { gu: Object.assign(f.gu, d.gu || {}), dw: DWARVES.map((_, i) => (d.dw && d.dw[i]) || 0), up: Object.assign({}, d.up || {}), goals: Object.assign({}, d.goals || {}), st: Object.assign(f.st, d.st || {}) });
    if (!d.st) S.st.bosses = Math.floor(((d.maxDepth || 1) - 1) / 10);   // Spielstand von vor den Zielen
    S.best = Math.max(d.best || 1, S.maxDepth || 1);                       // Spielstand von vor den Rekorden
    if (d.recBase == null) S.recBase = S.best;
    if (!Array.isArray(S.runs)) S.runs = [];
    if (d.lastMaxAt == null) S.lastMaxAt = S.runTime;                     // Spielstand von vor den Tipps
    if (!S.tips || typeof S.tips !== 'object') S.tips = {};
    if (!S.finds || typeof S.finds !== 'object') S.finds = {};
    if (!Array.isArray(S.towers)) S.towers = [];
    S.unl = Object.assign({}, d.unl || {});
    S.shop = Object.assign({}, d.shop || {});
    S.daily = Object.assign(f.daily, d.daily && typeof d.daily === 'object' ? d.daily : {});   // Spielstand von vor den Tageszielen
    if (!Array.isArray(S.daily.goals) || !S.daily.base || !S.daily.done) S.daily = freshState().daily;
    if (!BLOCKS.some(b => b.k === S.blk)) S.blk = 'stein';
    if (d.towers == null) {   // Spielstand von vor den Blöcken
      if (S.best > F.blockEnd) {   // Herz des Berges schon besiegt: Alter Berg zählt als geschafft
        S.towers = [{ k: 'stein', since: Date.now() }]; S.crowns = S.crownsAll = F.blockCrowns; migrated = S.best;
        if (S.maxDepth > F.blockEnd) { S.blockDone = true; S.depth = S.maxDepth = F.blockEnd; S.farm = false; }
        S.blkBest = S.maxDepth; S.recBase = 0;
      } else S.blkBest = Math.max(S.maxDepth, Math.min(F.blockEnd, S.best));
    }
    return d.saved || null;
  } catch (e) { return null; }
}
function save() { S.saved = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

  let i = 0; while (n >= 1000 && i < SUFFIX.length - 1) { n /= 1000; i++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + SUFFIX[i];
}

function damage(amount, fromTap, x, y) {

  if (S.special === 'panzer') {   // Panzerfels: nur Dynamit hilft, auch Zwerge machen nichts

    return;
  }
  if (frozen) amount *= F.iceDmg;
  let crit = false, weak = false;
  if (S.special === 'kristall' && fromTap && x != null) { const w = weakSpot(); if (Math.hypot(x - w.x, y - w.y) <= 26) { amount *= 8; crit = weak = true; } }
  if (!weak && fromTap && Math.random() < F.critChance(S)) { amount *= F.critMult(S); crit = true; }
  S.hp -= amount;
  if (fromTap) {
    shake = Math.min(1, shake + (crit ? 0.6 : 0.25)); hitFlash = 1;
    const c = rockCenter();
    floats.push({ x: (x ?? c.x) + (Math.random() - 0.5) * 30, y: (y ?? c.y) - 20, text: fmt(amount), life: 1, crit, color: weak ? SPECIAL_COL.kristall : undefined });
    if (weak) floats.push({ x, y: y - 50, text: TS.weak, life: 1.2, color: SPECIAL_COL.kristall });
    const col = layerAt(S.depth);
    for (let i = 0; i < (crit ? 10 : 4); i++) chips.push(chip(x ?? c.x, y ?? c.y, Math.random() < 0.35 ? col.ore : col.rock));

}

}

function breakRock() {

// Lager eines Turms: Kronen seit dem letzten Abholen, höchstens 12 Stunden
function towerStore(tw, now) {
  const max = F.towerCap(S) * 3600e3;
  if (!(tw.since <= now)) tw.since = now;   // Uhr zurückgestellt: nichts schenken
  const el = Math.min(max, now - tw.since);
  return { n: Math.floor(el / 3600e3 * F.towerRate(tw.k, S) + 1e-9), full: el >= max, el };
}
function storeInfo() {
  const now = Date.now(); let n = 0, rate = 0, cap = 0, next = Infinity;
  for (const tw of S.towers) {
    const st = towerStore(tw, now), r = F.towerRate(tw.k, S), per = 3600e3 / r;
    n += st.n; rate += r; cap += F.towerCap(S) * r;
    if (!st.full) next = Math.min(next, per - (st.el % per));
  }
  return { n, rate: +rate.toFixed(2), cap: Math.floor(cap + 1e-9), next };
}
function collectAll() {
  const now = Date.now(); let n = 0;
  for (const tw of S.towers) {
    const st = towerStore(tw, now);
    if (st.n <= 0) continue;
    n += st.n; tw.since = st.full ? now : tw.since + st.n * 3600e3 / F.towerRate(tw.k, S);
  }
  if (!n) return 0;
  S.crowns += n; S.crownsAll += n;
  Portal.submitScore(S.crownsAll); sfx.crown();
  showBanner({ text: T.collected, sub: '👑 +' + n, life: 2.2, color: '#ffd447' });
  checkGoals(); refreshPanel(true); save();

function drawIce(t) {

function drawSpecial(t) {

let mole = null, moleTimer = 180;   // erster Auftritt frühestens nach 3 Minuten Sitzung

function spawnMole() {
  if (mole) return;
  const left = Math.random() < 0.5, x0 = CW * (left ? 0.2 : 0.8), x1 = CW * (left ? 0.8 : 0.2);   // Löcher neben den Knöpfen Dynamit/Bier
  mole = { x: x0, y: moleY(), x0, x1, dir: left ? 1 : -1, ph: 'in', k: 0, out: false, sack: 0, seen: false };

function moleStep(dt) {
  if (!mole) {

    moleTimer -= dt;
    if (moleTimer <= 0) { spawnMole(); moleTimer = 120 + Math.random() * 120; }
    return;
  }
  mole.y = moleY();
  if (mole.ph === 'in') {   // kommt 0,6 s lang aus dem Loch, dann greift er sich den Sack
    mole.k += dt / 0.6;
    if (mole.k >= 1) {
      mole.k = 1; mole.ph = 'run'; mole.out = true;
      mole.sack = Math.ceil(Math.min(S.gold * 0.08, F.rockGold(S.depth, S) * 3));
      S.gold -= mole.sack;

      showBanner({ text: TM.steal, sub: TM.stealSub, life: 2, color: '#ff6b6b' });

  } else if (mole.ph === 'run') {
    mole.x += mole.dir * Math.abs(mole.x1 - mole.x0) / 4.5 * dt;
    if (Math.random() < dt * 8) { const p = chip(mole.x - mole.dir * 12, mole.y + 8, layerAt(S.depth).rock); p.vx = -mole.dir * Math.random() * 2; p.vy = -1.5 - Math.random() * 1.5; p.size = 3 + Math.random() * 3; chips.push(p); }
    if ((mole.x - mole.x1) * mole.dir >= 0) { mole.x = mole.x1; moleEscape(); }

function drawMole(t) {

// ---------- Zeichnen ----------
function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

// Aussehen je Schicht (Reihenfolge wie LAYERS): Felsform, Erzmuster, Stollen-Deko
const LOOKS = [
  { form: 'rund',     ore: 'nuggets', deko: 'wurzeln',     dekoCol: '#4a2f18' },  // Erde
  { form: 'kantig',   ore: 'nuggets', deko: 'stalaktiten', dekoCol: '#8f8f99' },  // Stein
  { form: 'kantig',   ore: 'adern',   deko: 'floez',       dekoCol: '#08070a' },  // Kohle
  { form: 'rund',     ore: 'adern',   deko: 'rohre',       dekoCol: '#b8693a' },  // Kupfer
  { form: 'kantig',   ore: 'adern',   deko: 'traeger',     dekoCol: '#4c4f57' },  // Eisen
  { form: 'rund',     ore: 'adern',   deko: 'silberadern' },                      // Silber
  { form: 'rund',     ore: 'nuggets', deko: 'nuggets' },                          // Gold
  { form: 'facetten', ore: 'zapfen',  deko: 'kristallzapfen' },                   // Kristall
  { form: 'blasig',   ore: 'glut',    deko: 'lavatropfen' },                      // Lava
  { form: 'rund',     ore: 'zapfen',  deko: 'nebel' },                            // Tiefe
  { form: 'scherben', ore: 'adern',   deko: 'scherben' },                         // Obsidian
  { form: 'facetten', ore: 'adern',   deko: 'runen' },                            // Mithril
  { form: 'blasig',   ore: 'glut',    deko: 'glutfunken' },                       // Glutkern
  { form: 'scherben', ore: 'augen',   deko: 'sterne',      dekoCol: '#f4eaff' },  // Leere
];

function drawRock(t) {
  const c = rockCenter();
  const L = layerAt(S.depth);
  const look = LOOKS[F.layerOf(S.depth)] || LOOKS[0];
  const sx = (Math.random() - 0.5) * shake * 10, sy = (Math.random() - 0.5) * shake * 10;
  const R = rng(rockSeed);
  const pts = [], form = look.form;
  // Umriss je Form; alle Punkte bleiben innerhalb 0.82-1.04 × c.r
  const N = form === 'rund' ? 14 : form === 'kantig' ? 7 : form === 'facetten' ? 6 : form === 'scherben' ? 9 : 11;
  const rot = form === 'facetten' ? R() * 0.5 : 0;
  for (let i = 0; i < N; i++) {
    let a = (i / N) * Math.PI * 2, f;
    if (form === 'rund') { a += R() * 0.1; f = 0.94 + R() * 0.07; }
    else if (form === 'kantig') { a += R() * 0.45; f = 0.82 + R() * 0.22; }
    else if (form === 'facetten') { a += rot; f = 1.0; }
    else if (form === 'scherben') { a += R() * 0.15; f = i % 3 === 0 ? 0.99 + R() * 0.05 : 0.82 + R() * 0.08; }
    else if (form === 'blasig') { a += R() * 0.2; f = 0.82 + R() * 0.12; }
    else { a += R() * 0.2; f = 0.82 + R() * 0.22; }
    const rr = c.r * f;
    pts.push([c.x + sx + Math.cos(a) * rr, c.y + sy + Math.sin(a) * rr * 0.92]);
  }
  const outline = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(c.x, c.y + c.r * 0.95, c.r * 0.9, c.r * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  // Körper
  outline();
  const g = ctx.createRadialGradient(c.x - c.r * 0.3, c.y - c.r * 0.4, c.r * 0.1, c.x, c.y, c.r * 1.1);
  g.addColorStop(0, shade(L.rock, 30)); g.addColorStop(1, L.dark);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.stroke();
  if (form === 'blasig') {   // Halbkreis-Blasen am Rand (Punkte ≤ 0.94, Blase ≤ 0.10 → ≤ 1.04)
    const nb = 4 + Math.floor(R() * 3);
    for (let i = 0; i < nb; i++) {
      const p = pts[Math.floor((i / nb) * N + R() * 2) % N], a = Math.atan2(p[1] - c.y - sy, p[0] - c.x - sx), b = c.r * (0.07 + R() * 0.03);
      ctx.beginPath(); ctx.arc(p[0], p[1], b, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(p[0], p[1], b, a - Math.PI / 2, a + Math.PI / 2); ctx.stroke();
    }
  }
  outline();
  ctx.save(); ctx.clip();
  if (form === 'facetten') {   // Kanten der Kristall-Facetten
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; ctx.beginPath();
    for (const p of pts) { ctx.moveTo(c.x + sx, c.y + sy - c.r * 0.08); ctx.lineTo(p[0], p[1]); }
    ctx.stroke();
  }
  // Erz (ab Ring II leuchtend)
  if (L.glow) { ctx.shadowColor = L.ore; ctx.shadowBlur = 10; }
  drawOre(L, look, c, R, sx, sy, t);
  ctx.shadowBlur = 0;
  // Risse je nach Schaden
  const dmg = 1 - Math.max(0, S.hp) / hpMax;
  const cracks = Math.floor(dmg * 7);
  ctx.strokeStyle = 'rgba(10,6,4,0.7)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const CR = rng(rockSeed + 7);
  for (let i = 0; i < cracks; i++) {
    let x = c.x + sx + (CR() - 0.5) * c.r * 0.6, y = c.y + sy + (CR() - 0.5) * c.r * 0.6;
    ctx.beginPath(); ctx.moveTo(x, y);
    const a0 = CR() * Math.PI * 2;
    for (let k = 0; k < 4; k++) { const a = a0 + (CR() - 0.5) * 1.2; x += Math.cos(a) * c.r * 0.22; y += Math.sin(a) * c.r * 0.22; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // Treffer-Aufblitzen
  if (hitFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${hitFlash * 0.18})`; ctx.fillRect(0, 0, CW, CH); }
  ctx.restore();
  // Boss-Gesicht
  if (bossActive) {

function drawCrown(x, y, w, t) {

// ---------- Erzmuster und Stollen-Deko je Schicht ----------
function drawOre(L, look, c, R, sx, sy, t) {
  const x0 = c.x + sx, y0 = c.y + sy, r = c.r;
  ctx.fillStyle = L.ore; ctx.strokeStyle = L.ore; ctx.lineCap = 'round';
  if (look.ore === 'adern') {   // geschwungene Adern
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      const ax = x0 + (R() - 0.5) * r * 1.3, ay = y0 + (R() - 0.5) * r * 1.2, a = R() * Math.PI * 2, l = r * (0.35 + R() * 0.35), b = (R() - 0.5) * l * 0.9;
      const bx = ax + Math.cos(a) * l, by = ay + Math.sin(a) * l;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 - Math.sin(a) * b, (ay + by) / 2 + Math.cos(a) * b, bx, by); ctx.stroke();
    }
  } else if (look.ore === 'zapfen') {   // Kristallzapfen von innen nach aussen, mit Glanz
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + R() * 0.6, r0 = r * 0.14, r1 = r * (0.55 + R() * 0.3), w = 0.13;
      ctx.beginPath(); ctx.moveTo(x0 + Math.cos(a - w) * r0, y0 + Math.sin(a - w) * r0); ctx.lineTo(x0 + Math.cos(a + w) * r0, y0 + Math.sin(a + w) * r0);
      ctx.lineTo(x0 + Math.cos(a) * r1, y0 + Math.sin(a) * r1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath();
      ctx.moveTo(x0 + Math.cos(a - w * 0.4) * r0, y0 + Math.sin(a - w * 0.4) * r0); ctx.lineTo(x0 + Math.cos(a) * r1 * 0.85, y0 + Math.sin(a) * r1 * 0.85); ctx.stroke();
    }
  } else if (look.ore === 'glut') {   // glühende Risse, Leuchten pulsiert
    ctx.shadowColor = L.ore; ctx.shadowBlur = 6 + 10 * (0.5 + 0.5 * Math.sin(t * 3)); ctx.lineWidth = 2.5;
    for (let i = 0; i < 6; i++) {
      let x = x0 + (R() - 0.5) * r * 1.1, y = y0 + (R() - 0.5) * r * 1.1;
      const a0 = R() * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < 3; k++) { const a = a0 + (R() - 0.5) * 1.2; x += Math.cos(a) * r * 0.18; y += Math.sin(a) * r * 0.18; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  } else if (look.ore === 'augen') {   // Augenpaare, blinzeln alle 3-5 s
    for (let i = 0; i < 3; i++) {
      const ex = x0 + (R() - 0.5) * r * 1.0, ey = y0 + (R() - 0.5) * r * 0.9, ew = r * 0.065, k = (Math.PI * 2) / (3 + R() * 2), seed = R() * 10;
      const shut = Math.sin(t * k + seed) > 0.97;
      for (const s of [-1, 1]) {
        const x = ex + s * ew * 1.5;
        if (shut) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - ew, ey); ctx.lineTo(x + ew, ey); ctx.stroke(); continue; }

        ctx.fillStyle = L.ore; ctx.beginPath(); ctx.arc(x, ey, ew * 0.38, 0, Math.PI * 2); ctx.fill();
      }
    }
  } else {   // Nuggets (wie bisher)
    for (let i = 0; i < 9; i++) {
      const ox = x0 + (R() - 0.5) * r * 1.5, oy = y0 + (R() - 0.5) * r * 1.4, s = 4 + R() * 8;
      ctx.fillStyle = L.ore;
      ctx.beginPath(); ctx.moveTo(ox, oy - s); ctx.lineTo(ox + s * 0.8, oy); ctx.lineTo(ox, oy + s * 0.7); ctx.lineTo(ox - s * 0.9, oy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(ox - s * 0.3, oy - s * 0.5, s * 0.25, s * 0.25);
    }
  }
}
// x an den Stollenwänden (links oder rechts vom Felsen)
const wallX = (R) => R() < 0.5 ? R() * CW * 0.22 : CW * (0.78 + R() * 0.22);
const DEKO = {
  wurzeln(R, col) {   // Wurzelstränge von oben
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const x = R() * CW, l = CH * (0.06 + R() * 0.14), b = (R() - 0.5) * 30;
      ctx.lineWidth = 2 + R() * 2.5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.quadraticCurveTo(x + b, l * 0.5, x - b * 0.4, l); ctx.stroke();
      ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x + b * 0.3, l * 0.45); ctx.lineTo(x + b * 0.3 + (R() - 0.5) * 24, l * 0.75); ctx.stroke();
    }
  },
  stalaktiten(R, col) {   // graue Zapfen oben
    ctx.fillStyle = col; ctx.globalAlpha = 0.8; ctx.beginPath();
    for (let i = 0; i < 11; i++) { const x = R() * CW, w = 5 + R() * 8, h = 14 + R() * 36, y = CH * 0.08 + 12; ctx.moveTo(x - w, y); ctx.lineTo(x + w, y); ctx.lineTo(x, y + h); ctx.closePath(); }
    ctx.fill(); ctx.globalAlpha = 1;
  },
  floez(R, col) {   // schwarzes Kohleband quer, mit Glanz
    const y = CH * (0.2 + R() * 0.04), h = 12 + R() * 6, w1 = R() * 6, w2 = R() * 6;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, y + w1); ctx.quadraticCurveTo(CW / 2, y - 8, CW, y + w2);
    ctx.lineTo(CW, y + w2 + h); ctx.quadraticCurveTo(CW / 2, y + h + 6, 0, y + w1 + h); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, y + w1 + 2); ctx.quadraticCurveTo(CW / 2, y - 6, CW, y + w2 + 2); ctx.stroke();
  },
  rohre(R, col) {   // Kupferrohre mit Bogen, Patina-Flecken
    for (const s of [-1, 1]) {
      const x = s < 0 ? CW * 0.13 : CW * 0.87, y1 = CH * (0.55 + R() * 0.15), rb = 14;
      ctx.beginPath(); ctx.moveTo(x, CH * 0.08 + 12); ctx.lineTo(x, y1); ctx.arc(x + s * rb, y1, rb, s < 0 ? 0 : Math.PI, Math.PI / 2, s > 0); ctx.lineTo(s < 0 ? 0 : CW, y1 + rb);
      ctx.strokeStyle = col; ctx.lineWidth = 7; ctx.stroke(); ctx.strokeStyle = 'rgba(255,220,180,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#4fb39a'; ctx.globalAlpha = 0.75; ctx.beginPath();
      for (let i = 0; i < 3; i++) { const py = CH * 0.15 + R() * (y1 - CH * 0.15); ctx.moveTo(x + 3, py); ctx.arc(x, py, 3, 0, Math.PI * 2); }
      ctx.fill(); ctx.globalAlpha = 1;

  },
  traeger(R, col) {   // Eisenträger mit Nieten links und rechts
    for (const x of [CW * 0.15, CW * 0.85 - 10]) {
      ctx.fillStyle = col; ctx.fillRect(x, CH * 0.08 + 12, 10, CH);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + 4, CH * 0.08 + 12, 2, CH);
      ctx.fillStyle = '#9a9ea8'; ctx.beginPath();

  },
  silberadern(R, col) {   // feine helle Linien in den Wänden

    for (let i = 0; i < 9; i++) { let x = wallX(R), y = R() * CH; ctx.moveTo(x, y); for (let k = 0; k < 3; k++) { x += (R() - 0.5) * 30; y += 8 + R() * 16; ctx.lineTo(x, y); } }
    ctx.stroke(); ctx.globalAlpha = 1;
  },
  nuggets(R, col, t) {   // glänzende Goldpunkte in den Wänden, blinken
    ctx.fillStyle = col;
    for (let i = 0; i < 14; i++) {
      const x = wallX(R), y = R() * CH, s = 1.5 + R() * 2;

  },
  kristallzapfen(R, col) {   // hellblaue Zapfen oben und unten, durchsichtig

    for (let i = 0; i < 14; i++) {
      const x = R() * CW, w = 4 + R() * 7, h = 16 + R() * 40, top = i < 7, y = top ? CH * 0.08 + 12 : CH;
      ctx.moveTo(x - w, y); ctx.lineTo(x + w, y); ctx.lineTo(x, top ? y + h : y - h); ctx.closePath();
    }
    ctx.fill(); ctx.globalAlpha = 1;
  },
  lavatropfen(R, col, t) {   // 3 Tropfen fallen langsam, mit Glut-Schein
    ctx.fillStyle = col;
    for (let i = 0; i < 3; i++) {
      const x = wallX(R), y0 = CH * 0.08 + 12, sp = 25 + R() * 20, y = y0 + ((t * sp + R() * CH) % (CH - y0));

  glutfunken(R, col, t) {   // 12 Funken steigen auf

function drawBackground(t) {

  }

    const E = rng(77);
    for (let i = 0; i < 18; i++) {
      const sp = 20 + E() * 40, x = E() * CW + Math.sin(t * 1.5 + i) * 8, y = CH - ((t * sp + E() * CH) % CH);
      ctx.fillStyle = `rgba(255,${120 + Math.floor(E() * 80)},40,${0.35 + 0.3 * Math.sin(t * 4 + i) ** 2})`;
      ctx.beginPath(); ctx.arc(x, y, 1.5 + E() * 1.5, 0, Math.PI * 2); ctx.fill();
    }

    for (let i = 0; i < 16; i++) {

}

  const canGem = GEM_UPS.some(u => S.gu[u.key] < u.max && S.gems >= F.gemCost(u.key, S.gu[u.key]));
  const dots = { pick: canPick, dwarf: canDwarf, gem: canGem, goal: ((F.canPrestige(S) || S.blockDone) && !seenPrest) || moveWorth() };
  document.querySelectorAll('.tab').forEach(b => b.querySelector('.dot').classList.toggle('show', dots[b.dataset.tab] && b.dataset.tab !== tab));
}
let seenPrest = false;
function buy(r) {
  const d = rowData(r);
  if (r.kind === 'goal' || r.kind === 'daily') return;
  if (r.kind === 'prest') { if (S.blockDone) showRealm(); else newMine(); return; }
  if (r.kind === 'realm') { showRealm(); return; }
  if (r.kind === 'rec') { showRecords(); return; }
  if (r.kind === 'finds') { showFinds(); return; }
  if (r.kind === 'stuck') { retryBoss(); return; }
  if (d.locked || d.maxed || d.done) return;
  if (d.cur === 'gold') { if (S.gold < d.cost) return; S.gold -= d.cost; }
  else { if (S.gems < d.cost) return; S.gems -= d.cost; }
  if (r.kind === 'pick') S.pick++;
  else if (r.kind === 'up') { S.up[r.key] = true; showBanner({ text: T.ups[r.key][0], sub: T.ups[r.key][1], life: 2.2, color: '#f5c542' }); updateSkillBtns(); }
  else if (r.kind === 'dwarf') {
    const before = F.milestoneMult(S.dw[r.i]);
    S.dw[r.i]++;
    if (F.milestoneMult(S.dw[r.i]) > before) showBanner({ text: DWARF_NAMES[r.i], sub: T.milestone, life: 2, color: DWARVES[r.i].hat });
  } else S.gu[r.key]++;
  sfx.buy(); popBuy(r, d.cur === 'gold' ? '#f5c542' : '#57d2ff');
  if (r.kind === 'up') buildPanel(); else refreshPanel(true);
  save();
}

// Kauf-Gefühl: Karte hüpft kurz, Funken fliegen aus dem Knopf
function popBuy(r, color) {

    sp.style.setProperty('--dx', Math.cos(a) * dist + 'px'); sp.style.setProperty('--dy', Math.sin(a) * dist + 'px');

// ---------- Tipps: erklären das Spiel in den ersten Minuten, jeder nur einmal ----------
const TIPS = [

  { id: 'dwarf', at: 'dwarf', when: () => S.st.prest === 0 && S.st.bosses === 0 && S.dw.every(n => n === 0) && S.gold >= F.dwarfCost(0, 0), done: () => S.dw[0] > 0 },
  { id: 'boss', at: 'rock', when: () => S.st.prest === 0 && S.st.bosses === 0 && bossActive, done: () => !bossActive },
  { id: 'gem', at: 'gem', when: () => tab !== 'gem' && S.st.prest === 0 && S.dw[0] > 0 && !bossActive && S.gems >= F.gemCost('power', 0) && GEM_UPS.every(u => !S.gu[u.key]), done: () => tab === 'gem' || GEM_UPS.some(u => S.gu[u.key]) },

];
const stageEl = document.getElementById('stage'), tipEl = document.getElementById('tip');

// ---------- Tagesziele: drei kleine Ziele je Kalendertag ----------
function dayKey() { const d = new Date(), z = (n) => (n < 10 ? '0' : '') + n; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function dailyCount(type) { return { taps: S.taps, boss: S.st.bosses, dw: S.dw.reduce((a, b) => a + b, 0), chest: S.st.chests }[type] || 0; }
function dailyName(g) { return g.type === 'boss' && g.n === 1 ? T.daily1 : T.goals[g.type].replace('{n}', g.n); }
// Neuer Tag nur bei einem grösseren Schlüssel: Uhr zurückstellen würfelt nicht neu
function ensureDaily() {
  const key = dayKey();
  if (!(key > S.daily.day)) return;
  const had = !!S.daily.day, deep = Math.max(S.best || 1, S.blkBest || 1, S.maxDepth || 1);
  const size = deep < 30 ? 0 : deep < 100 ? 1 : 2;
  const pool = DAILY_POOL.slice(), goals = [], base = {};
  while (goals.length < 3) {
    const p = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    goals.push({ id: p.type + p.n[size], type: p.type, n: p.n[size], gems: p.gems[size] });
    base[p.type] = dailyCount(p.type);
  }
  S.daily = { day: key, goals, base, done: {}, bonus: false };
  if (had) showBanner({ text: '📅 ' + T.dailyNew, sub: goals.map(dailyName).join(' · '), life: 3, color: '#6fdc7a' });
  if (tab === 'goal') buildPanel();
  save();
}
// Fortschritt seit Tagesstart; nie negativ (sonst Startwert auf den jetzigen Zähler setzen)
function dailyProgress(g) {
  const p = dailyCount(g.type) - (S.daily.base[g.type] || 0);
  if (p < 0) { S.daily.base[g.type] = dailyCount(g.type); return 0; }
  return p;
}
// Umzug / neuer Block: bisherige Zwerge vom Startwert abziehen, damit das Zwerge-Ziel weiter zählt
function dailyMove() { S.daily.base.dw = (S.daily.base.dw || 0) - S.dw.reduce((a, b) => a + b, 0); }
function checkDaily() {
  const done = S.daily.goals.filter(g => !S.daily.done[g.id] && dailyProgress(g) >= g.n);
  for (const g of done) {
    S.daily.done[g.id] = true; S.gems += g.gems;
    showBanner({ text: T.goalDone, sub: T.daily + ': ' + dailyName(g) + '  💎 +' + g.gems, life: 2.6, color: '#6fdc7a' });
  }
  if (S.daily.goals.length && !S.daily.bonus && S.daily.goals.every(g => S.daily.done[g.id])) {
    S.daily.bonus = true; S.gems += 5;
    showBanner({ text: '📅 ' + T.dailyAll, sub: T.dailyBonus + '  💎 +5', life: 3, color: '#ffd447' });
  }
  if (!done.length) return;
  sfx.boss();
  if (tab === 'goal') buildPanel();
  save();
}

// ---------- Ziele ----------
function goalName(g) { return (g.n === 1 && T.goals1[g.type]) || T.goals[g.type].replace('{n}', g.n); }

function checkGoals() {

// ---------- Fundstücke: finden und ansehen ----------
function findCount() { return FINDS.filter(f => S.finds[f.id]).length; }
function layerFinds(i) { return FINDS.filter(f => f.layer === i && S.finds[f.id]); }

function rollFind() {
  if (S.maxDepth < 2 || S.maxDepth > 140) return;   // im Herz (141-150) gibt es keine Fundstücke
  const i = F.layerOf(S.maxDepth);
  const open = FINDS.filter(f => f.layer === i && !S.finds[f.id]);
  if (!open.length || Math.random() >= 0.22) return;
  const f = open[Math.floor(Math.random() * open.length)];
  S.finds[f.id] = 1; S.gems += 1;
  showBanner({ text: TF.found, sub: f.icon + ' ' + f.name[FL] + '  💎 +1', life: 3, color: '#ffd447' });
  sfx.chest();
  const c = rockCenter();
  for (let k = 0; k < 20; k++) { const p = chip(c.x, c.y - c.r * 0.3, CONFETTI[k % CONFETTI.length]); p.vx *= 1.7; p.vy -= 4; p.size = 5 + Math.random() * 4; chips.push(p); }
  if (layerFinds(i).length === 3) { S.gems += 5; showBanner({ text: TF.layerDone, sub: layerAt(S.maxDepth).name + ' · 💎 ' + TF.layerDoneSub, life: 2.6, color: '#57d2ff' }); }
  if (findCount() === FINDS.length) { S.gems += 50; showBanner({ text: TF.allDone, sub: TF.allDoneSub, life: 3.2, color: '#ffd447' }); sfx.boss(); }
  save();
}

// ---------- Kronen-Laden ----------
function shopEff(k, L) {

  if (k === 'lager') return `<b style="color:#6fdc7a">${F.towerCap(S)} h</b>`;

function renderShop() {

function buyShop(k) {

}
function doNewMine(gain) {
  S.runs.unshift({ n: S.st.prest + 1, d: S.maxDepth, h: gain, t: Math.round(S.runTime) }); if (S.runs.length > 30) S.runs.length = 30;
  S.heir += gain; S.st.prest++; S.runTime = 0; S.lastMaxAt = 0; S.recBase = S.blkBest;
  dailyMove();
  S.gold = 0; S.depth = 1; S.maxDepth = 1; S.farm = false; S.pick = 0; S.dw = DWARVES.map(() => 0); S.up = {}; S.cdDyn = 0; S.cdBeer = 0;
  rage = 0; beer = 0; lava = 0; frost = 0; chest = null; chestTimer = 25; layerShown = -1;
  applyStart();
  spawnRock(); buildPanel(); updateSkillBtns(); seenPrest = false;
  bannerQ.length = 0; banner = null; showBanner({ text: T.newMine, sub: '⚱ +' + gain + ' ' + T.heir, life: 3, color: '#c77dff' });
  sfx.boss(); Portal.happytime();
  save();
}

// ---------- HUD ----------
const goldEl = document.getElementById('gold'), gemsEl = document.getElementById('gems'), depthEl = document.getElementById('depth'), bestEl = document.getElementById('best');
document.getElementById('depthPill').addEventListener('click', () => showRecords());
const crownPill = document.getElementById('crownPill'), crownsEl = document.getElementById('crowns'), crownDot = crownPill.querySelector('.dot');
crownPill.addEventListener('click', () => showRealm());
const bossBtn = document.getElementById('bossBtn'), blockBtn = document.getElementById('blockBtn');
bossBtn.addEventListener('click', () => { retryBoss(); });
blockBtn.addEventListener('click', (e) => { e.stopPropagation(); showRealm(); });
function updateBossBtn() {
  bossBtn.style.display = S.farm ? 'block' : 'none';
  bossBtn.textContent = '⚔ ' + T.retry + ' (' + S.maxDepth + ')';
  blockBtn.style.display = S.blockDone ? 'block' : 'none';
  blockBtn.textContent = '🗺 ' + T.nextBlock;
}
function updateCrowns() {
  const show = S.towers.length > 0 || S.blkBest >= 100;
  crownPill.style.display = show ? 'flex' : 'none';
  if (!show) return;
  crownsEl.textContent = fmt(S.crowns);
  crownDot.classList.toggle('show', storeInfo().n > 0);
}
const soundBtn = document.getElementById('soundBtn');
function drawSoundIcon() {
  soundBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#f3ead8"/>' +
    (S.sound ? '<path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13" stroke="#f3ead8" stroke-width="2" fill="none" stroke-linecap="round"/>'
             : '<path d="M16 9l5 6M21 9l-5 6" stroke="#f3ead8" stroke-width="2" stroke-linecap="round"/>') + '</svg>';
}
soundBtn.addEventListener('click', (e) => { e.stopPropagation(); S.sound = !S.sound; drawSoundIcon(); save(); });

// ---------- Willkommen zurück (Offline-Gold) ----------
const toast = document.getElementById('toast');
function offlineReward(since) {
  if (!since) return;
  const sec = Math.min(F.offlineMaxSec, (Date.now() - since) / 1000);
  const dps = F.totalDps(S);
  if (sec < 60 || dps <= 0) return;
  const inStore = storeInfo().n;
  const perHp = F.rockGold(S.depth, S) / F.rockHp(S.depth);
  const gold = Math.ceil(dps * sec * perHp * F.offlineRate(S));
  if (gold <= 0) return;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  popup(`<div style="font-weight:800">${T.welcome}</div><div class="small">${T.away} ${h ? h + 'h ' : ''}${m}min</div>
    <div class="big">${COIN_SVG}+${fmt(gold)}</div>${inStore ? `<div class="small" style="color:#ffd447;font-weight:800">${T.inStore.replace('{n}', inStore)}</div>` : ''}<button id="tCollect">${T.collect}</button>
    <div><button id="tDouble" style="background:#57d2ff;color:#003449;margin-top:6px">${T.double}</button></div>`);
  const done = (mult) => { S.gold += gold * mult; toast.style.display = 'none'; for (let i = 0; i < 10; i++) coins.push({ x: CW / 2, y: CH * 0.3, t: -i * 0.04, sx: 0, sy: 0 }); refreshPanel(true); save(); };
  document.getElementById('tCollect').onclick = () => done(1);
  document.getElementById('tDouble').onclick = () => Portal.showRewardedAd(() => done(2));
}

// ---------- Schleife ----------
let last = performance.now(), t = 0, saveTimer = 0, panelTimer = 0, paused = false;
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); paused = true; Portal.gameplayStop(); } else { paused = false; last = performance.now(); Portal.gameplayStart(); } });
window.addEventListener('pagehide', save);

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;
  S.runTime += dt; S.st.time += dt;

  // Zwerge graben
  const dps = F.totalDps(S) * (beer > 0 ? F.beerMult : 1) * (lava > 0 ? 0 : 1) * (frost > 0 && beer <= 0 ? F.frostDw : 1);   // Lava: in Deckung, Kälte: frieren (Bier wärmt)
  if (dps > 0 && S.hp > 0) damage(dps * dt, false);
  if (bossActive) {
    bossTimer -= dt;
    const sec = Math.ceil(bossTimer); if (sec !== lastTick) { lastTick = sec; if (sec > 0 && sec <= 5) sfx.tick(); }   // die letzten Sekunden ticken
    if (bossTimer <= 0) failBoss();
  }
  bossFlash = Math.max(0, bossFlash - dt * 2.5);
  if (rage > 0) rage -= dt;
  if (beer > 0) beer -= dt;
  if (lava > 0) { lava -= dt; if (Math.random() < 0.6) { const p = chip(Math.random() * CW, CH + 4, Math.random() < 0.5 ? '#ff8a3d' : '#ffd23f'); p.vy = -7 - Math.random() * 6; p.vx *= 0.3; chips.push(p); } }
  else if (frost > 0) frost -= dt;
  else if ((S.blk === 'vulkan' || S.blk === 'eis') && !S.blockDone && toast.style.display !== 'block') { lavaTimer -= dt; if (lavaTimer <= 0) (S.blk === 'vulkan' ? startLava : startFrost)(); }
  if (S.cdDyn > 0) S.cdDyn -= dt; if (S.cdBeer > 0) S.cdBeer -= dt;
  goalTimer -= dt; if (goalTimer <= 0) {
    goalTimer = 0.5; checkGoals(); ensureDaily(); checkDaily(); updateSkillBtns(); updateTip(); updateCrowns();
    if (S.farm && bossPower() >= 1) { retryBoss(); showBanner({ text: T.autoRetry, sub: T.autoRetrySub, life: 2.2, color: '#6fdc7a' }); }
  }

  // Truhe
  if (chest) { chest.life -= dt; if (chest.life <= 0) { chest = null; chestTimer = F.chestEvery(S); } }
  else { chestTimer -= dt; if (chestTimer <= 0) spawnChest(); }

  // Effekte
  shake = Math.max(0, shake - dt * 4); hitFlash = Math.max(0, hitFlash - dt * 6); swingT = Math.max(0, swingT - dt * 7);
  for (const p of chips) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += 0.2; p.life -= dt * 1.4; }
  chips = chips.filter(p => p.life > 0 && p.y < CH + 20);
  if (chips.length > 220) chips.splice(0, chips.length - 220);
  for (const f of floats) { f.y -= 40 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  if (floats.length > 40) floats.splice(0, floats.length - 40);
  for (const m of coins) m.t += dt;
  coins = coins.filter(m => m.t < 0.7);
  if (banner && toast.style.display !== 'block') { banner.life -= dt * (bannerQ.length ? 1.6 : 1); if (banner.life <= 0) banner = bannerQ.shift() || null; }

  // Zeichnen
  drawBackground(t);
  drawDwarves(t);
  drawRock(t); specialStep(dt); drawSpecial(t); drawIce(t);
  drawPlayerPick();
  drawChest(t); moleStep(dt); drawMole(t);
  quoteStep(dt);
  drawFx(dt);
  drawQuote(t);   // Sprechblase über den fliegenden Münzen, damit der Text lesbar bleibt

  // HUD
  goldEl.textContent = fmt(S.gold); gemsEl.textContent = fmt(S.gems); depthEl.textContent = S.depth;
  const bt = S.blkBest > S.depth ? '🏆' + S.blkBest : ''; if (bestEl.textContent !== bt) bestEl.textContent = bt;
  panelTimer -= dt; if (panelTimer <= 0) { panelTimer = 0.25; refreshPanel(false); }
  saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 5; save(); }
}

// ---------- Start ----------
const since = load();
ensureDaily();
drawSoundIcon();
layerShown = Math.floor((S.depth - 1) / 10);
spawnRock();
if (S.hp <= 0) S.hp = hpMax;
buildPanel();
updateBossBtn();
updateSkillBtns();
resize();
updateCrowns();
setTimeout(() => offlineReward(since), 300);
// Alter Spielstand mit besiegtem Herz des Berges: Erklärung, danach zur Karte
if (migrated) setTimeout(() => afterToast(() => {
  popup(`<div style="font-weight:900;font-size:20px">👑 ${T.migTitle}</div><div class="small" style="font-size:14px;max-width:290px;margin:8px auto 0">${T.migText.replace('{d}', migrated)}${S.blockDone ? '' : ' ' + T.migGoOn}</div>
    <button id="tMap">${T.toMap}</button>`);
  document.getElementById('tMap').onclick = () => { toast.style.display = 'none'; showRealm(); };
}), 700);
Portal.gameplayStart();
requestAnimationFrame(frame);

// Für Tests von aussen (Playwright) erreichbar
window.__mine = { get S() { return S; }, F, DWARVES, UPGRADES, GOALS, tap: () => { const c = rockCenter(); damage(F.pickDmg(S.pick, S) * tapMult(), true, c.x, c.y); }, spawnChest, openChest, get chest() { return chest; }, useDyn, useBeer, newMine, buildPanel, reset: startOver, jump: (d) => { d = Math.min(d, F.blockEnd); S.depth = d; S.maxDepth = Math.max(S.maxDepth, d); S.best = Math.max(S.best, S.maxDepth); S.blkBest = Math.max(S.blkBest, S.maxDepth); S.farm = false; spawnRock(); buildPanel(); }, onNewMax, showRecords, layerAt, banners: () => [banner, ...bannerQ].filter(Boolean).map(b => b.text), get focus() { return hasFocus; }, get tip() { return tipNow && tipNow.id; }, failBoss, retryBoss, bossPower, moveWorth, movePct,
  showRealm, collectAll, startBlock, startLava, storeInfo, BLOCKS, get lava() { return lava; }, get bossActive() { return bossActive; },
  startFrost, get frost() { return frost; }, get frozen() { return frozen; }, freeze: () => { frozen = iceGold = true; }, buyShop, renderShop, applyStart, SHOP, ensureDaily, checkDaily, dailyProgress, LOOKS };
</script>
